<!DOCTYPE html>
<html lang="vi">
<head>
      <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ND2 Radiology OS V5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--panel:#fff;--panel2:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent2:#1e40af;--soft:#f1f5f9;--good:#16a34a;--goodbg:#dcfce7;--warn:#d97706;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--sh:0 1px 3px rgba(15,23,42,.06);--shlg:0 20px 40px rgba(15,23,42,.15)}
html,body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--accent2)}
.btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600}
.btn-soft:hover{background:#e2e8f0}
.btn-danger{background:var(--bad);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-weight:600}
.btn-sm{padding:5px 9px;font-size:12px}
.icon-btn{background:transparent;border:0;padding:4px 6px;font-size:15px;border-radius:5px}
.icon-btn:hover{background:var(--soft)}
/* LOGIN */
#login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1220,#1e3a8a)}
.login-card{background:#fff;padding:36px 32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h1{font-size:20px;margin-bottom:6px;color:#1e40af}
.login-card p{color:#64748b;font-size:13px;margin-bottom:24px}
.login-card input{margin-bottom:14px;padding:11px 14px;font-size:15px}
.login-card button{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:15px}
.login-card button:hover{background:#1e40af}
.login-err{color:#dc2626;font-size:12px;margin-top:10px;min-height:18px}
/* LAYOUT */
#app{display:none;min-height:100vh}
header.top{background:linear-gradient(135deg,#0b1220,#1e3a8a 70%,#2563eb);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.top h1{font-size:16px;font-weight:800}
header.top .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top .user-badge{font-size:12px;padding:5px 12px;background:rgba(255,255,255,.15);border-radius:20px}
header.top .role-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;margin-left:6px}
.role-admin{background:#fbbf24;color:#78350f}.role-doctor{background:#34d399;color:#064e3b}.role-tech{background:#60a5fa;color:#1e3a8a}.role-viewer{background:#94a3b8;color:#1e293b}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
nav .group-title{cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
nav .group-title:hover{color:var(--accent);}
nav .group-items{display:block;}
nav .group-items.hidden{display:none;}
nav .group-title .toggle-icon{font-size:10px; transition:transform .2s;}
nav .group-title.closed .toggle-icon{transform:rotate(-90deg);}
nav{background:#fff;border-right:1px solid var(--line);padding:14px 8px;height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:0}
nav .group-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:750;padding:12px 10px 6px}
nav .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink);font-size:13px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;margin-bottom:1px}
nav .nav-item:hover{background:var(--soft)}
nav .nav-item.on{background:#eff6ff;color:var(--accent);font-weight:700}
nav .nav-icon{width:22px;text-align:center;font-size:14px}
nav .nav-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
main{padding:20px;min-width:0;overflow-x:hidden}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{height:auto;position:relative}}
/* PAGE */
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:800}
.page-head .subtitle{color:var(--muted);font-size:12px;margin-top:2px}
.filter-bar{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar select,.filter-bar input{width:auto;min-width:130px;font-size:13px;padding:6px 9px}
.filter-bar .search{flex:1;min-width:200px}
.table-wrap{background:#fff;border-radius:10px;border:1px solid var(--line);overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel2);font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:750;white-space:nowrap;position:sticky;top:0;z-index:1}
tr:hover td{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty::before{content:"📭";display:block;font-size:32px;margin-bottom:8px;opacity:.4}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}
.badge.good{background:var(--goodbg);color:var(--good)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:#eff6ff;color:var(--accent)}
/* FORM DIALOG */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(900px,96vw);max-height:92vh;box-shadow:var(--shlg);display:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(5,10,20,.55);backdrop-filter:blur(4px)}
.dialog-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dialog-head h3{font-size:16px}
.dialog-body{padding:20px;max-height:70vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-body .full{grid-column:1/-1}
.dialog-foot{padding:12px 20px;background:var(--panel2);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 14px 14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.3px}
.form-group.full{grid-column:1/-1}
/* DASHBOARD */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--sh)}
.tile small{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.tile strong{display:block;font-size:26px;font-weight:800;margin-top:4px;color:var(--accent)}
.tile .sub{font-size:11px;color:var(--muted);margin-top:2px}
.card{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:750;margin-bottom:12px}
/* CALENDAR */
.cal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.cal-toolbar .nav-btns{display:flex;gap:6px}
.cal-toolbar .title{font-size:17px;font-weight:750;text-align:center;flex:1}
.cal-modes{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:8px}
.cal-modes button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:650;color:var(--muted)}
.cal-modes button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;padding:8px 0;font-size:11px;text-transform:uppercase;font-weight:750;color:var(--muted);background:var(--panel2);border-radius:5px}
.cal-cell{min-height:100px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:7px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:hover{border-color:var(--accent);box-shadow:var(--sh)}
.cal-cell.empty{background:var(--panel2);cursor:default;opacity:.4}
.cal-cell.empty:hover{border-color:var(--line);box-shadow:none}
.cal-cell.today{border:2px solid var(--accent);background:#eff6ff}
.cal-day{font-weight:800;font-size:13px;margin-bottom:3px}
.cal-cell.today .cal-day{color:var(--accent)}
.cal-ev{display:block;font-size:10.5px;padding:2px 5px;margin-bottom:2px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid}
.cal-ev.type-Truc{background:#dbeafe;color:#1e40af;border-color:#2563eb}
.cal-ev.type-HoiChan{background:#fef3c7;color:#92400e;border-color:#d97706}
.cal-ev.type-DaoTao{background:#dcfce7;color:#15803d;border-color:#16a34a}
.cal-ev.type-Khac{background:#ede9fe;color:#5b21b6;border-color:#7c3aed}
.cal-day-view{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--line)}
.cal-day-ev{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.cal-day-ev:hover{background:var(--panel2)}
.cal-day-ev .time{font-weight:700;font-size:13px;color:var(--accent);min-width:80px}
.cal-week-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:11.5px}
.cal-week-table th{background:var(--panel2);padding:8px;text-align:center}
.cal-week-table td{padding:4px;border-right:1px solid var(--line);vertical-align:top;height:70px}
.cal-week-table td.emp{background:var(--panel2);font-weight:700;width:130px;padding:8px}
.sync-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:650;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer}
.sync-badge.ok{background:rgba(52,211,153,.25);border-color:#34d399}
.sync-badge.err{background:rgba(248,113,113,.25);border-color:#f87171}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--ink);color:#fff;border-radius:10px;box-shadow:var(--shlg);z-index:9999;font-weight:650;font-size:13px}
@media(max-width:600px){.dialog-body{grid-template-columns:1fr}.page-head h1{font-size:17px}header.top{padding:10px 14px}main{padding:12px}}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.btn:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>ND2 Radiology OS V5</h1>
    <p>Hệ điều hành quản trị Khoa CĐHA Nhi · BV Nhi Đồng 2</p>
    <input type="text" id="login-u" placeholder="Tên đăng nhập" autocomplete="username">
    <input type="password" id="login-p" placeholder="Mật khẩu" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>🩻 ND2 RADIOLOGY OS V5</h1>
    <div class="actions">
      <span class="user-badge" id="user-info"></span>
      <span class="sync-badge" id="sync-badge" onclick="route('sync_center')">☁️ Sync Center</span>
      <button class="btn-soft btn-sm" onclick="backup()">💾 Backup</button>
      <button class="btn-soft btn-sm" onclick="logout()">Đăng xuất</button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form" onsubmit="event.preventDefault()">
    <div class="dialog-head"><h3 id="dlg-title"></h3><button type="button" class="icon-btn" onclick="closeDlg()">✕</button></div>
    <div class="dialog-body" id="dlg-body"></div>
    <div class="dialog-foot" id="dlg-foot"></div>
  </form>
</dialog>

<script>
/* =====================================================================
   ND2 RADIOLOGY OS V5 — FINAL
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate = v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('vi-VN')};
const fmtNum = v=>v===''||v==null?'—':Number(v).toLocaleString('vi-VN');
/* ===== V5.1 HELPERS ===== */
const localDate = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const liveEvents = () => (DB.data.events || []).filter(e => !e._deleted);
const getSyncCfg = () => { try{ return JSON.parse(localStorage.getItem('nd2_sync')||'{}'); }catch(e){ return {}; } };
function setSyncBadge(state,text){ const b=$('#sync-badge'); if(!b) return; b.className='sync-badge '+(state||''); b.textContent='☁️ '+text; }
function mergeRows(local,cloud){
  const m=new Map(local.map(r=>[r.id,r])); let added=0,updated=0;
  for(const c of cloud){
    const l=m.get(c.id);
    if(!l){ m.set(c.id,c); added++; }
    else if((c.updatedAt||0)>(l.updatedAt||0)){ m.set(c.id,c); updated++; }
  }
  return {rows:[...m.values()],added,updated};
}
const toast = m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}

const ROLES={admin:{n:'Quản trị'},doctor:{n:'Bác sĩ'},tech:{n:'KTV'},viewer:{n:'Chỉ xem'}};
const PERM={
  admin:{'*':['c','r','u','d']},
  doctor:{dashboard:['r'],calendar:['r','c'],staff:['r'],daily_volumes:['r'],modality_production:['r'],staff_production:['r'],inpatient_activity:['r'],outpatient_activity:['r'],emergency_activity:['r'],after_hours_activity:['r'],tat_tracking:['r'],backlog:['r'],image_quality:['r'],errors_redos:['r'],consultation_log:['r','c'],timesheet:['r']},
  tech:{dashboard:['r'],calendar:['r'],staff:['r'],daily_volumes:['c','r','u'],modality_production:['c','r','u'],inpatient_activity:['c','r','u'],outpatient_activity:['c','r','u'],emergency_activity:['c','r','u'],after_hours_activity:['c','r','u'],tat_tracking:['c','r','u'],backlog:['c','r','u'],image_quality:['c','r','u'],errors_redos:['c','r','u'],timesheet:['c','r','u']},
  viewer:{dashboard:['r'],calendar:['r'],staff:['r']}
};
function can(mod,action){
  if(!CURRENT)return false;
  const p=PERM[CURRENT.role]||{};
  const a=p[mod]||p['*']||[];
  return a.includes(action)||a.includes('*');
}

const SCHEMA={
     procedure_mgmt: {g:'C', n:'Quản Lý Thủ Thuật', icon:'🔪', view:'procedure_mgmt'},
    emergency_dashboard: {g:'K', n:'Báo Động & Cấp Cứu', icon:'🚨', view:'emergency_dashboard'},
    payroll: {g:'K', n:'Tính Công Ngoài Giờ', icon:'💰', view:'payroll'},
    approval_hub: {g:'K', n:'Trung Tâm Phê Duyệt', icon:'✅', view:'approval_hub'},
    ops_center: {g:'K', n:'Trung Tâm Vận Hành', icon:'🚀', view:'ops_center'},
  // ---- A. DASHBOARD (7) ----
    my_workspace: {g:'A', n:'Góc Làm Việc', icon:'🏠', view:'my_workspace'},
  dash_executive:{g:'A',n:'Dashboard Lãnh đạo',icon:'📊',view:'dashboard'},
  dash_clinical:{g:'A',n:'Dashboard Chuyên môn',icon:'🩺',view:'dashboard'},
  dash_hr:{g:'A',n:'Dashboard Nhân sự',icon:'👥',view:'dashboard'},
  dash_equipment:{g:'A',n:'Dashboard Thiết bị',icon:'🩻',view:'dashboard'},
  dash_finance:{g:'A',n:'Dashboard Tài chính',icon:'💰',view:'dashboard'},
  dash_quality:{g:'A',n:'Dashboard Chất lượng',icon:'🎯',view:'dashboard'},
  dash_training:{g:'A',n:'Dashboard Đào tạo',icon:'🎓',view:'dashboard'},
  
  // ---- B. NHÂN SỰ (16) ----
    leave_requests:{g:'B',n:'Đơn nghỉ phép',icon:'🌴',f:[
      {k:'empCode',l:'Mã NV',t:'text',r:1},
      {k:'type',l:'Loại nghỉ',t:'select',o:['Phép năm','Nghỉ bù','Ốm','Thai sản','Không lương']},
      {k:'startDate',l:'Từ ngày',t:'date',r:1},{k:'endDate',l:'Đến ngày',t:'date',r:1},
      {k:'reason',l:'Lý do',t:'textarea',full:1},
      {k:'approvedBy',l:'Người duyệt',t:'text'},
      {k:'status',l:'Trạng thái',t:'select',o:['Chờ duyệt','Đã duyệt','Từ chối']}
    ]},
  staff_360:{g:'B',n:'Hồ sơ 360°',icon:'🔄',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},

  ]},
  positions:{g:'B',n:'Chức danh',icon:'🏷️',f:[
    {k:'code',l:'Mã',t:'text',r:1},{k:'name',l:'Tên chức danh',t:'text',r:1},

    {k:'status',l:'Trạng thái',t:'select',o:['Chưa','Đang làm','Hoàn thành']}
  ]},
  overtime:{g:'B',n:'Làm thêm ngoài giờ',icon:'⏰',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'date',l:'Ngày',t:'date',r:1},
    {k:'slot',l:'Ca',t:'select',o:['Ca 0 (05:30-07:00)','Ca 1 (07:00-11:00)','Ca 2 (11:00-13:00)','Ca 3 (13:00-16:00)','Ca 4 (16:00-19:30)','Ca 5 (19:30-21:00)']},
    {k:'hours',l:'Số giờ',t:'num'},{k:'amount',l:'Thù lao',t:'num'},
    {k:'status',l:'Trạng thái',t:'select',o:['Chưa duyệt','Đã duyệt','Đã thanh toán']}
  ]},
  timesheet:{g:'B',n:'Chấm công',icon:'✍️',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'year',l:'Năm',t:'num',r:1},{k:'month',l:'Tháng',t:'num',r:1},
    {k:'workDays',l:'Ngày công',t:'num'},{k:'leaveDays',l:'Ngày phép',t:'num'},
    {k:'sickDays',l:'Ngày ốm',t:'num'},{k:'overtime',l:'Giờ OT',t:'num'},

  ]},
  timesheet_reconciliation:{g:'B',n:'Đối soát chấm công',icon:'🔍',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'period',l:'Kỳ',t:'text',r:1},
    {k:'reportedDays',l:'Ngày báo cáo',t:'num'},{k:'actualDays',l:'Ngày thực',t:'num'},
    {k:'diff',l:'Chênh lệch',t:'num'},{k:'notes',l:'Ghi chú',t:'textarea',full:1}
  ]},

async function initDB(){
  const saved=localStorage.getItem('nd2_v5');
  if(saved){DB=JSON.parse(saved);}
  else{
    const v4=localStorage.getItem('nd2_v4');
    if(v4){
      if(!confirm('Phát hiện dữ liệu V4. Tự động backup và nâng cấp lên V5?')){location.reload();return;}
      const blob=new Blob([v4],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AUTO_BACKUP_V4_'+localDate()+'.json';a.click();
      try{const old=JSON.parse(v4);DB.data=old.data||{};DB.auditLog=old.auditLog||[];}catch(e){}
    }
    if(!DB.data.users||!DB.data.users.length){
      const h=await sha256('123456');
      DB.data.users=[
        {id:'u1',username:'admin',passwordHash:h,name:'Trưởng khoa',role:'admin',status:'active'},
        {id:'u2',username:'bacsi',passwordHash:h,name:'Bác sĩ CĐHA',role:'doctor',status:'active'},
        {id:'u3',username:'ktv',passwordHash:h,name:'KTV CĐHA',role:'tech',status:'active'}
      ];
    }
    if(!DB.data.staff||!DB.data.staff.length){
      DB.data.staff=[

async function doLogin(){
  const u=$('#login-u').value.trim(),p=$('#login-p').value,err=$('#login-err');
  err.textContent='';
  await initDB();
  const user=DB.data.users.find(x=>x.username===u);
  if(!user){err.textContent='Tài khoản không tồn tại';return;}
  if(user.status!=='active'){err.textContent='Tài khoản đã bị khóa';return;}
  const h=await sha256(p);
  if(h!==user.passwordHash){audit('login_fail','system',user.id,'Sai mật khẩu');err.textContent='Sai mật khẩu';return;}
  CURRENT={id:user.id,username:user.username,name:user.name,role:user.role};
  localStorage.setItem('nd2_user',JSON.stringify(CURRENT));
  user.lastLogin=Date.now();saveDB();audit('login','system',user.id,'Đăng nhập');
  await enterApp();
}

function renderNav(){
  const groups={};
  Object.keys(SCHEMA).forEach(k=>{const g=SCHEMA[k].g;if(!groups[g])groups[g]=[];groups[g].push(k)});
  let html='';
  Object.keys(groups).sort().forEach(g=>{
    // Kiểm tra xem nhóm này đang bị ẩn hay không (lưu trong localStorage)
    const isClosed = localStorage.getItem('nav_closed_'+g) === '1';
    html+=`<div class="group-title ${isClosed?'closed':''}" onclick="toggleNavGroup('${g}')">
      <span>${GROUP_NAMES[g]||g}</span>
      <span class="toggle-icon">▼</span>
    </div>`;
    
    html+=`<div class="group-items ${isClosed?'hidden':''}" id="nav-group-${g}">`;
    groups[g].forEach(k=>{
      const m=SCHEMA[k];
      const count=m.f?(DB.data[k]||[]).filter(x=>!x._deleted).length:'';
      // Nếu tài khoản không có quyền xem module này -> Ẩn luôn
      if(!can(k, 'r') && !can(k, 'c') && !can(k, 'u')) return;

    });

  });

function renderGeneric(key){
  const mod=SCHEMA[key];
  const canC=can(key,'c'),canU=can(key,'u'),canD=can(key,'d');
  const rows=(DB.data[key]||[]).filter(r=>!r._deleted)
    .filter(r=>{
      const f=FILTERS[key]||{};
      for(const fk in f){if(f[fk]&&String(r[fk]||'')!==f[fk])return false}
      const s=SEARCHS[key];
      if(s){const txt=(mod.f||[]).map(x=>String(r[x.k]||'')).join(' ').toLowerCase();if(!txt.includes(s.toLowerCase()))return false}
      return true;
    });
  
  let fb='<div class="filter-bar">';
  const selectFields=(mod.f||[]).filter(f=>f.t==='select'&&f.o);
  selectFields.forEach(f=>{
    const cur=(FILTERS[key]||{})[f.k]||'';
    fb+=`<select data-fk="${f.k}"><option value="">${esc(f.l)}</option>${f.o.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  });
  fb+=`<input type="text" class="search" data-search placeholder="🔍 Tìm kiếm..." value="${esc(SEARCHS[key]||'')}">`;
  if(canC)fb+=`<button class="btn-soft" data-add>+ Thêm</button>`;
  fb+=`<button class="btn-soft" data-csv>📥 CSV</button>`;
  fb+='</div>';
  
  const cols=(mod.f||[]);
  let tb='<table><thead><tr><th style="width:40px">#</th>';
  cols.forEach(c=>tb+=`<th>${esc(c.l)}</th>`);
  tb+='<th style="width:90px"></th></tr></thead><tbody>';
  if(!rows.length)tb+=`<tr><td colspan="${cols.length+2}" class="empty">Chưa có dữ liệu</td></tr>`;
  rows.forEach((r,i)=>{
    tb+='<tr>';
    tb+=`<td>${i+1}</td>`;
    cols.forEach(c=>tb+=`<td>${renderCell(c,r[c.k])}</td>`);
    tb+='<td style="white-space:nowrap">';
    if(canU)tb+=`<button class="icon-btn" data-edit="${r.id}" title="Sửa">✏️</button>`;
    if(canD)tb+=`<button class="icon-btn" data-del="${r.id}" title="Xóa">🗑️</button>`;
    tb+='</td></tr>';
  });
  tb+='</tbody></table>';
  
  $('#view').innerHTML=`
    <div class="page-head">
      <div><h1>${mod.icon||'📄'} ${esc(mod.n)}</h1><div class="subtitle">${GROUP_NAMES[mod.g]||''} · ${rows.length} bản ghi</div></div>
    </div>
    ${fb}
    <div class="table-wrap">${tb}</div>
  `;
  
  $$('[data-add]').forEach(b=>b.onclick=()=>openForm(key,null));
  $$('[data-edit]').forEach(b=>b.onclick=()=>openForm(key,b.dataset.edit));
  $$('[data-del]').forEach(b=>b.onclick=()=>delRecord(key,b.dataset.del));
  $$('[data-fk]').forEach(s=>s.onchange=()=>{
    if(!FILTERS[key])FILTERS[key]={};
    FILTERS[key][s.dataset.fk]=s.value;renderGeneric(key);
  });
  const srch=$('[data-search]');if(srch)srch.oninput=e=>{SEARCHS[key]=e.target.value;renderGeneric(key)};
  const csvBtn=$('[data-csv]');if(csvBtn)csvBtn.onclick=()=>showCSVMenu(key);
}

function renderCell(f,v){
  if(v===''||v==null)return '<span style="color:#94a3b8">—</span>';
  if(f.t==='date')return fmtDate(v);
  if(f.t==='num')return fmtNum(v);
  if(f.t==='bool')return v?'<span class="badge good">✔</span>':'<span class="badge">—</span>';
  if(f.k==='status'){const s=String(v);const c=/Hoàn thành|Đã duyệt|Đang làm|Hiệu lực|Đạt|Xong/.test(s)?'good':/Chờ|Đề xuất|Sắp hết|Đang/.test(s)?'warn':/Hết hạn|Từ chối|Không|Đã nghỉ/.test(s)?'bad':'info';return `<span class="badge ${c}">${esc(s)}</span>`}
  return esc(v);
}

function openForm(key,id){
  const mod=SCHEMA[key];
  const r=id?DB.data[key].find(x=>x.id===id):{};
  let html='';
  (mod.f||[]).forEach(f=>{
    const val=r[f.k]??'';
    html+=`<div class="form-group ${f.full?'full':''}"><label>${esc(f.l)}${f.r?' *':''}</label>`;
    if(f.t==='select')html+=`<select data-k="${f.k}" ${f.r?'required':''}><option value="">— chọn —</option>${(f.o||[]).map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.t==='textarea')html+=`<textarea data-k="${f.k}" rows="3" ${f.r?'required':''}>${esc(val)}</textarea>`;
    else if(f.t==='date')html+=`<input type="date" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='num')html+=`<input type="number" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='bool')html+=`<input type="checkbox" data-k="${f.k}" ${val?'checked':''}>`;
    else html+=`<input type="text" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    html+=`</div>`;
  });
  $('#dlg-title').textContent=(id?'Sửa':'Thêm')+': '+mod.n;
  $('#dlg-body').innerHTML=html;
  $('#dlg-foot').innerHTML=`<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" onclick="saveForm('${key}','${id||''}')">💾 Lưu</button>`;
  $('#dlg').showModal();
  $('#dlg')._ctx={key,id};
}
function closeDlg(){$('#dlg').close()}

function saveForm(key,id){
  const mod=SCHEMA[key];
  const data={};
  for(const f of (mod.f||[])){
    const el=$(`[data-k="${f.k}"]`);if(!el)continue;
    if(f.t==='bool')data[f.k]=el.checked;
    else if(f.t==='num')data[f.k]=el.value===''?'':Number(el.value);
    else data[f.k]=el.value;
  }
  for(const f of (mod.f||[])){
    if(f.r&&(data[f.k]===''||data[f.k]==null)){toast('Vui lòng nhập: '+f.l);return}
  }
  if(id){const i=DB.data[key].findIndex(x=>x.id===id);if(i>=0){DB.data[key][i]={...DB.data[key][i],...data,updatedAt:Date.now()};audit('update',key,id,data[Object.keys(data)[0]]||'')}}
  else{const nid=uid();DB.data[key].push({id:nid,...data,createdAt:Date.now(),updatedAt:Date.now()});audit('create',key,nid,data[Object.keys(data)[0]]||'')}
  saveDB();closeDlg();renderGeneric(key);renderNav();toast('Đã lưu');
}

function delRecord(key,id){
  if(!confirm('Xóa bản ghi này? (có thể khôi phục từ backup)'))return;
  const i=DB.data[key].findIndex(x=>x.id===id);
  if(i<0)return;
  DB.data[key][i]._deleted=true;DB.data[key][i]._deletedAt=Date.now();DB.data[key][i].updatedAt=Date.now();
  audit('delete',key,id,'');saveDB();renderGeneric(key);renderNav();toast('Đã xóa');
}

        <button class="${view==='day'?'on':''}" onclick="setView('day')">Ngày</button>

function calTitle(){
  const {year,month,view,day}=CAL;
  if(view==='month'||view==='quarter')return `Tháng ${month+1} / ${year}`;
  if(view==='week'){const monday=weekMonday(CAL.day);const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);return `${monday.getDate()}/${monday.getMonth()+1} - ${sunday.getDate()}/${sunday.getMonth()+1} / ${year}`}
  if(view==='day')return `${day.getDate()}/${day.getMonth()+1}/${day.getFullYear()}`;
  return `Năm ${year}`;
}
function weekMonday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}

function renderMonthView(){
  const {year,month}=CAL;
  const first=new Date(year,month,1),last=new Date(year,month+1,0);
  const startDow=(first.getDay()+6)%7,days=last.getDate();
  const today=localDate();
  let html='<div class="cal-grid">';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++)html+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=liveEvents().filter(e=>e.date===dateStr);
    const isToday=dateStr===today;
    html+=`<div class="cal-cell ${isToday?'today':''}" onclick="openEvent('${dateStr}')">
      <div class="cal-day">${d}</div>
      ${evs.slice(0,3).map(e=>`<div class="cal-ev type-${e.type||'Khac'}" onclick="event.stopPropagation();editEvent('${e.id}')">${esc(e.title||e.type||'')}</div>`).join('')}
      ${evs.length>3?`<div style="font-size:10px;color:var(--muted)">+${evs.length-3}</div>`:''}
    </div>`;
  }
  html+='</div>';
  return html;
}

function renderWeekView(){
  const monday=weekMonday(CAL.day);
  const days=[];for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);days.push(d)}
  const dayStrs=days.map(d=>localDate(d));
  const byEmp={};

function calPrev(){
  if(CAL.view==='month'||CAL.view==='quarter'){CAL.month--;if(CAL.month<0){CAL.month=11;CAL.year--}}
  else if(CAL.view==='week'){CAL.day=new Date(CAL.day.getTime()-7*86400000)}
  else if(CAL.view==='day'){CAL.day=new Date(CAL.day.getTime()-86400000)}
  else CAL.year--;
  if(CAL.view==='quarter'&&CAL.month%3!==2)CAL.month=Math.floor(CAL.month/3)*3+2;
  renderCalendar();
}
function calNext(){
  if(CAL.view==='month'||CAL.view==='quarter'){CAL.month++;if(CAL.month>11){CAL.month=0;CAL.year++}}
  else if(CAL.view==='week'){CAL.day=new Date(CAL.day.getTime()+7*86400000)}
  else if(CAL.view==='day'){CAL.day=new Date(CAL.day.getTime()+86400000)}
  else CAL.year++;
  if(CAL.view==='quarter')CAL.month=Math.floor(CAL.month/3)*3+2;
  renderCalendar();
}
function calToday(){CAL.year=new Date().getFullYear();CAL.month=new Date().getMonth();CAL.day=new Date();renderCalendar()}
function setView(v){CAL.view=v;renderCalendar()}

function exportCSV(key){
  const mod=SCHEMA[key],rows=DB.data[key]||[];
  if(!rows.length){toast('Không có dữ liệu');return}
  const cols=mod.f||[];
  const headers=cols.map(c=>c.l);
  const lines=rows.map(r=>cols.map(c=>{
    let v=r[c.k]??'';
    if(typeof v==='string'&&/^[=+\-@]/.test(v))v="'"+v;
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  const csv='\ufeff'+headers.join(',')+'\n'+lines.join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${key}_${localDate()}.csv`;a.click();
  audit('export',key,'',rows.length+' rows');toast('Đã xuất CSV');
  closeDlg();
}

function downloadTemplate(key){
  const mod=SCHEMA[key];
  const cols=mod.f||[];
  const header=cols.map(c=>c.l).join(',');
  const example=cols.map(c=>{
    if(c.k==='empCode'||c.k==='assetCode'||c.k==='code')return 'AUTO';
    if(c.t==='date')return '2026-01-01';
    if(c.t==='num')return '0';
    return `[${c.l}]`;
  }).join(',');
  const csv='\ufeff'+header+'\n'+example;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`template_${key}.csv`;a.click();
  toast('Đã tải template');
}

function parseCSVText(text){
  const lines=[];let row=[''],inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'){if(inQ&&n==='"'){row[row.length-1]+='"';i++}else inQ=!inQ}
    else if(c===','&&!inQ)row.push('');
    else if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&n==='\n')i++;if(row.length>1||row[0]!=='')lines.push(row);row=['']}
    else row[row.length-1]+=c;
  }
  if(row.length>1||row[0]!=='')lines.push(row);
  return lines;
}

function handleImportFile(e,key){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    const rows=parseCSVText(evt.target.result);
    if(rows.length<2){toast('File rỗng');return}
    const headers=rows[0],mod=SCHEMA[key];
    const cols=mod.f||[];
    const keyField=(cols.find(c=>c.k==='empCode'||c.k==='assetCode'||c.k==='code')||cols[0]).k;
    const parsed=rows.slice(1).filter(r=>r[0]!=='').map((row,idx)=>{
      const obj={_row:idx+2,_status:'new',_errors:[]};
      headers.forEach((h,i)=>{
        const col=cols.find(c=>c.l===h||c.k===h);
        if(col)obj[col.k]=row[i]||'';
      });
      cols.filter(c=>c.r).forEach(c=>{if(!obj[c.k])obj._errors.push('Thiếu '+c.l)});
      const existing=DB.data[key].find(x=>String(x[keyField])===String(obj[keyField])&&!x._deleted);
      if(existing){obj._status='update';obj.id=existing.id}
      if(obj._errors.length)obj._status='error';
      return obj;
    });
    showImportPreview(key,parsed);
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}

function showImportPreview(key,data){
  const mod=SCHEMA[key];
  const newC=data.filter(r=>r._status==='new').length;
  const updC=data.filter(r=>r._status==='update').length;
  const errC=data.filter(r=>r._status==='error').length;
  const cols=mod.f||[];
  let html=`<div style="display:flex;gap:16px;margin-bottom:20px;grid-column:1/-1">
    <div style="flex:1;padding:12px;background:var(--panel2);border-radius:8px;text-align:center"><b style="font-size:20px">${data.length}</b><br><small>Tổng</small></div>
    <div style="flex:1;padding:12px;background:var(--goodbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--good)">${newC}</b><br><small>Thêm</small></div>
    <div style="flex:1;padding:12px;background:var(--warnbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--warn)">${updC}</b><br><small>Sửa</small></div>
    <div style="flex:1;padding:12px;background:var(--badbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--bad)">${errC}</b><br><small>Lỗi</small></div>
  </div>
  <div style="grid-column:1/-1;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px">
    <table><thead><tr><th>Dòng</th><th>Trạng thái</th><th>Lỗi</th>${cols.slice(0,4).map(c=>`<th>${c.l}</th>`).join('')}</tr></thead>
    <tbody>${data.slice(0,30).map(r=>`<tr style="background:${r._status==='new'?'#f0fdf4':r._status==='update'?'#fefce8':'#fef2f2'}">
      <td>${r._row}</td>
      <td><b style="font-size:11px;color:${r._status==='new'?'var(--good)':r._status==='update'?'var(--warn)':'var(--bad)'}">${r._status.toUpperCase()}</b></td>
      <td style="font-size:11px;color:var(--bad)">${r._errors.join('; ')}</td>
      ${cols.slice(0,4).map(c=>`<td>${esc(r[c.k]||'')}</td>`).join('')}
    </tr>`).join('')}</tbody></table>
  </div>`;
  $('#dlg-title').textContent='Preview Import: '+mod.n;
  $('#dlg-body').innerHTML=html;
  $('#dlg-foot').innerHTML=`<button class="btn-soft" onclick="closeDlg()">Hủy</button>
    <button class="btn" onclick="commitImport('${key}')" ${errC===data.length?'disabled style="opacity:.5"':''}>✅ Ghi ${newC+updC} bản ghi</button>`;
  window._importData=data;
}

function commitImport(key){
  const data=window._importData||[];
  let add=0,upd=0;
  data.forEach(r=>{
    if(r._status==='error')return;
    const {_row,_status,_errors,...clean}=r;
    if(_status==='update'&&clean.id){
      const i=DB.data[key].findIndex(x=>x.id===clean.id);
      if(i>=0){DB.data[key][i]={...DB.data[key][i],...clean,updatedAt:Date.now()};upd++}
    }else{
      delete clean.id;
      DB.data[key].push({id:uid(),...clean,createdAt:Date.now(),updatedAt:Date.now()});add++;
    }
  });
  saveDB();
  audit('import',key,'',`Thêm ${add}, Sửa ${upd}`);
  closeDlg();
  toast(`Import xong: ${add} thêm, ${upd} sửa`);
  renderGeneric(key);renderNav();
}

function generateFromTemplate(id){
  const t = (DB.data.report_templates||[]).find(x=>x.id===id); if(!t) return;
  const vars = [...new Set((t.body.match(/\{\{(\w+)\}\}/g)||[]).map(v=>v.replace(/[{}]/g,'').trim()))];
  
  if(!vars.length){
    showTemplateOutput(t, {});

  $('#dlg-body').innerHTML = `
    <div class="form-group full" style="background:var(--panel2);padding:10px;border-radius:8px">

      <div class="form-group ${i%2===0?'':'full'}"><label>${esc(v)}</label>
        ${v.includes('mo_ta')||v.includes('ket_luan')||v.includes('nhan_xet')||v.includes('findings')?
          `<textarea id="tv-${v}" rows="3"></textarea>`:
          `<input type="text" id="tv-${v}">`}
      </div>
    `).join('')}
    <div class="form-group full" style="margin-top:12px">
      <button type="button" class="btn" onclick="buildTemplateOutput('${id}')">✅ Tạo văn bản</button>

      <label>Kết quả (có thể copy/paste)</label>

    </div>
  `;
  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Đóng</button>
    <button type="button" class="btn-soft" onclick="copyTemplateOutput()">📋 Copy</button>`;
  $('#dlg').showModal();
}

function buildTemplateOutput(id){
  const t = (DB.data.report_templates||[]).find(x=>x.id===id); if(!t) return;
  const vars = [...new Set((t.body.match(/\{\{(\w+)\}\}/g)||[]).map(v=>v.replace(/[{}]/g,'').trim()))];
  let out = t.body;
  vars.forEach(v=>{
    const val = (document.getElementById('tv-'+v)?.value) || `[${v}]`;
    out = out.replace(new RegExp(`\\{\\{\\s*${v}\\s*\\}\\}`,'g'), val);
  });
  $('#tpl-out').value = out;
}

function copyTemplateOutput(){
  const ta = document.getElementById('tpl-out');
  if(!ta || !ta.value){ toast('Chưa có nội dung'); return; }
  navigator.clipboard.writeText(ta.value).then(()=>toast('Đã copy')).catch(()=>{ta.select();document.execCommand('copy');toast('Đã copy')});
}

function renderRiskMatrix(){
  const risks = (DB.data.risks||[]).filter(x=>!x._deleted);
  const matrix = Array(5).fill(0).map(()=>Array(5).fill(0));
  const cells = Array(5).fill(0).map(()=>Array(5).fill(null).map(()=>[]));
  risks.forEach(r=>{
    const p = Math.max(1,Math.min(5,Number(r.probability)||1));
    const i = Math.max(1,Math.min(5,Number(r.impact)||1));
    matrix[5-p][i-1]++; cells[5-p][i-1].push(r);
  });
  const getColor = (p,i)=>{ const score = p*i; if(score>=15) return '#dc2626'; if(score>=8) return '#f59e0b'; if(score>=4) return '#fbbf24'; return '#22c55e'; };
  let html = `<div class="page-head"><div><h1>🎲 Ma trận rủi ro</h1><div class="subtitle">${risks.length} rủi ro · Khả năng × Tác động</div></div></div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;flex-wrap:wrap">
      <div><span style="display:inline-block;width:14px;height:14px;background:#22c55e;border-radius:3px;vertical-align:middle"></span> Thấp (1-3)</div>
      <div><span style="display:inline-block;width:14px;height:14px;background:#fbbf24;border-radius:3px;vertical-align:middle"></span> T.Bình (4-7)</div>
      <div><span style="display:inline-block;width:14px;height:14px;background:#f59e0b;border-radius:3px;vertical-align:middle"></span> Cao (8-14)</div>
      <div><span style="display:inline-block;width:14px;height:14px;background:#dc2626;border-radius:3px;vertical-align:middle"></span> N.Cao (15-25)</div>
    </div>
    <div style="display:flex;gap:4px">
      <div style="writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);padding:8px;background:var(--panel2);border-radius:6px;font-weight:700;font-size:12px">Khả năng →</div>
      <div style="flex:1"><table style="width:100%;border-collapse:separate;border-spacing:4px">
        ${[5,4,3,2,1].map(p=>`<tr>
          <td style="text-align:right;font-weight:700;font-size:12px;padding:6px;width:40px">${p}</td>
          ${[1,2,3,4,5].map(i=>`<td style="height:70px;text-align:center;background:${getColor(p,i)};color:white;border-radius:6px;font-weight:800;font-size:20px;cursor:${cells[5-p][i-1].length?'pointer':'default'}" title="${cells[5-p][i-1].map(r=>r.title).join('\n')}">${matrix[5-p][i-1]||''}</td>`).join('')}
        </tr>`).join('')}
        <tr><td></td>${[1,2,3,4,5].map(i=>`<td style="text-align:center;font-weight:700;font-size:12px;padding:6px">${i}</td>`).join('')}</tr>
        <tr><td></td><td colspan="5" style="text-align:center;font-weight:700;font-size:12px;padding:6px">Tác động →</td></tr>
      </table></div>
    </div>
  </div>
  <div class="card"><h3>Danh sách rủi ro theo mức độ</h3>
    ${risks.length ? risks.sort((a,b)=>(b.probability*b.impact)-(a.probability*a.impact)).map(r=>{
      const score = (r.probability||0)*(r.impact||0);
      const level = score>=15?'N.Cao':score>=8?'Cao':score>=4?'T.Bình':'Thấp';
      const color = score>=15?'bad':score>=8?'warn':score>=4?'warn':'good';
      return `<div style="padding:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px"><div style="flex:1"><b>${esc(r.title||'')}</b><br><small style="color:var(--muted)">P=${r.probability} · I=${r.impact} · Phụ trách: ${esc(r.owner||'—')}</small></div><div style="text-align:right"><span class="badge ${color}">${level} (${score})</span></div></div>`;
    }).join('') : '<div class="empty">Chưa có rủi ro nào</div>'}
  </div>`;
  $('#view').innerHTML = html;
}

function removeCustomField(mod,i){

}

function renderConflicts(){
  const conflicts=DB.data._conflicts||[];
  let html=`<div class="page-head"><div><h1>⚠️ Xung đột đồng bộ</h1><div class="subtitle">${conflicts.length} xung đột cần xử lý</div></div></div>`;
  if(!conflicts.length){html+='<div class="card"><div class="empty">Không có xung đột. Dữ liệu đang đồng bộ tốt.</div></div>';}
  else{conflicts.forEach((c,i)=>{html+=`<div class="card" style="border-left:4px solid var(--bad)"><h3>${esc(c.module)} · ${esc(c.recordId||'')}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0"><div style="padding:10px;background:var(--panel2);border-radius:8px"><b style="font-size:11px;color:var(--muted)">LOCAL</b><pre style="font-size:11px;overflow:auto;margin-top:6px">${esc(JSON.stringify(c.local||{},null,2).slice(0,300))}</pre></div><div style="padding:10px;background:var(--panel2);border-radius:8px"><b style="font-size:11px;color:var(--muted)">CLOUD</b><pre style="font-size:11px;overflow:auto;margin-top:6px">${esc(JSON.stringify(c.cloud||{},null,2).slice(0,300))}</pre></div></div><div style="display:flex;gap:8px"><button class="btn-soft" onclick="resolveConflict(${i},'local')">Giữ Local</button><button class="btn-soft" onclick="resolveConflict(${i},'cloud')">Giữ Cloud</button><button class="btn-danger" onclick="resolveConflict(${i},'skip')">Bỏ qua</button></div></div>`;});}
  $('#view').innerHTML=html;
}
function resolveConflict(i,choice){
  const c=DB.data._conflicts[i];
  if(choice==='local'){const exists=(DB.data[c.module]||[]).find(x=>x.id===c.recordId);if(exists)Object.assign(exists,c.local);}
  else if(choice==='cloud'){const exists=(DB.data[c.module]||[]).find(x=>x.id===c.recordId);if(exists)Object.assign(exists,c.cloud);else(DB.data[c.module]=DB.data[c.module]||[]).push(c.cloud);}
  DB.data._conflicts.splice(i,1);saveDB();renderConflicts();toast('Đã xử lý xung đột');
}

async function saveUser(id){
  const username=$('#u-username').value.trim(),name=$('#u-name').value.trim(),role=$('#u-role').value,pass=$('#u-pass').value;
  if(!username||!name){toast('Nhập đủ thông tin');return;}
  if(!id){if(DB.data.users.find(u=>u.username===username)){toast('Username tồn tại');return;}if(pass.length<6){toast('Mật khẩu ≥ 6 ký tự');return;}const h=await sha256(pass);DB.data.users.push({id:uid(),username,name,role,passwordHash:h,status:'active',createdAt:Date.now()});audit('create','users','',username);}
  else{const u=DB.data.users.find(x=>x.id===id);u.name=name;u.role=role;if(pass){if(pass.length<6){toast('Mật khẩu ≥ 6 ký tự');return;}u.passwordHash=await sha256(pass);}audit('update','users',id,username);}
  saveDB();closeDlg();renderUsers();toast('Đã lưu');
}
function editUser(id){openUserForm(id)}

async function syncPush(){
  const cfg=JSON.parse(localStorage.getItem('nd2_sync')||'{}');
  if(!cfg.url){toast('Chưa cấu hình URL');return;}
  toast('Đang đẩy dữ liệu...');
  try{
    const payload={token:cfg.token,action:'batchUpsert',data:{}};
    Object.keys(SCHEMA).forEach(k=>{
      if(SCHEMA[k].f||SCHEMA[k].view) payload.data[k]=(DB.data[k]||[]).filter(r=>!r.synthetic);
    });
    payload.data.events=DB.data.events||[];
    const res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    if(!(res.headers.get('content-type')||'').includes('json')){
      throw new Error('Trình duyệt chưa được phép truy cập Apps Script. Hãy mở URL trong tab mới, đăng nhập đúng tài khoản và cho phép (chỉ cần làm một lần).');
    }
    const out=await res.json();
    if(out.error) throw new Error(out.error);
    addSyncLog('push',`Đã đẩy ${out.stats?.added||0} thêm, ${out.stats?.updated||0} sửa`,true);
    toast('Push thành công');
    renderSyncCenter();
  }catch(e){
    addSyncLog('push','Lỗi: '+e.message,false);
    toast('Lỗi: '+e.message);
    renderSyncCenter();
  }
}
async function syncPull(){
  const cfg=getSyncCfg(); if(!cfg.url){ toast('Chưa cấu hình URL'); return false; }
  setSyncBadge('','Đang tải…');
  try{
    const res=await fetch(`${cfg.url}?action=pull&token=${encodeURIComponent(cfg.token||'')}`);
    const out=await res.json(); if(out.error) throw new Error(out.error);
    let added=0,updated=0;
    for(const [mod,rows] of Object.entries(out.data||{})){
      if(!Array.isArray(rows)) continue;
      if(!SCHEMA[mod] && mod!=='events') continue;
      const r=mergeRows(DB.data[mod]||[],rows);
      DB.data[mod]=r.rows; added+=r.added; updated+=r.updated;
    }
    saveDB();
    addSyncLog('pull',`Thêm ${added}, cập nhật ${updated}`,true);
    setSyncBadge('ok','Đã đồng bộ');
    return true;
  }catch(e){
    addSyncLog('pull','Lỗi: '+e.message,false);
    setSyncBadge('err','Lỗi sync');
    return false;
  }
}
async function syncFull(){await syncPull();}
function addSyncLog(action,detail,ok){if(!DB.data._syncLog)DB.data._syncLog=[];DB.data._syncLog.unshift({ts:Date.now(),action,detail,ok});if(DB.data._syncLog.length>100)DB.data._syncLog.length=100;localStorage.setItem('nd2_last_sync',new Date().toLocaleString('vi-VN'));saveDB();}

let AI_HISTORY=[];
function renderAI(){
  if(CURRENT.role!=='admin'){ $('#view').innerHTML='<div class="empty">Chỉ Admin được dùng</div>'; return; }
  const cfg=getSyncCfg();
  $('#view').innerHTML=`
    <div class="page-head"><div><h1>🤖 Trợ lý AI (DeepSeek)</h1><div class="subtitle">${cfg.aiUrl?'Đã cấu hình proxy':'Chưa cấu hình AI Proxy URL trong Sync Center'}</div></div>
      <button class="btn-soft btn-sm" onclick="AI_HISTORY=[];renderAI()">🗑 Xóa hội thoại</button></div>
    <div class="card" style="background:#fffbeb;border-color:#fcd34d"><b>⚠️ Quy tắc dữ liệu:</b> Không nhập họ tên, mã NV, số bệnh án, ngày sinh hay bất kỳ thông tin nhận dạng bệnh nhân. Chỉ dùng nội dung đã ẩn danh hoặc câu hỏi chung. Hội thoại chỉ lưu trong bộ nhớ tạm, không ghi xuống máy.</div>

      <div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn" id="ai-send" onclick="aiSend()">Gửi</button></div></div>`;
  paintAI();

function paintAI(){
  const log=$('#ai-log'); if(!log) return;
  log.innerHTML=AI_HISTORY.length
    ? AI_HISTORY.map(m=>`<div style="margin-bottom:12px"><b style="font-size:12px;color:${m.role==='user'?'var(--accent)':'var(--good)'}">${m.role==='user'?'Bạn':'AI'}</b><div style="white-space:pre-wrap">${esc(m.content)}</div></div>`).join('')
    : '<div class="empty">Đặt câu hỏi để bắt đầu</div>';
  log.scrollTop=log.scrollHeight;
}
async function aiSend(){
  const input=$('#ai-in'); const text=input.value.trim(); if(!text) return;
  const cfg=getSyncCfg(); if(!cfg.aiUrl){ toast('Chưa có AI Proxy URL'); return; }
  AI_HISTORY.push({role:'user',content:text}); input.value=''; paintAI();
  const btn=$('#ai-send'); btn.disabled=true; btn.textContent='Đang trả lời…';
  try{
    const res=await fetch(cfg.aiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:cfg.token,action:'chat',messages:[
        {role:'system',content:'Bạn là trợ lý hỗ trợ khoa Chẩn đoán hình ảnh nhi. Trả lời tiếng Việt, ngắn gọn, nêu rõ khi không chắc chắn.'},
        ...AI_HISTORY.slice(-10)
      ]})});
    const out=await res.json(); if(out.error) throw new Error(out.error);
    AI_HISTORY.push({role:'assistant',content:out.reply||'(không có nội dung)'});
  }catch(e){
    AI_HISTORY.push({role:'assistant',content:'Lỗi: '+e.message});
  }finally{
    btn.disabled=false; btn.textContent='Gửi'; paintAI();
  }
}
</script>
</script><script id="rs-v4">
/* =====================================================================
   RS v4 — 1 bộ máy lịch tuần (BS · KTV · Ngoài giờ) + Lịch trực tháng
            + Lịch họp kiểu Google Calendar
   ===================================================================== */

// ---------- 0. Quyền, menu ----------
PERM.doctor.roster_doctor=['r']; PERM.doctor.roster_tech=['r']; PERM.doctor.roster_after=['r']; PERM.doctor.duty_month=['r'];
PERM.tech.roster_doctor=['r'];   PERM.tech.roster_tech=['r','u']; PERM.tech.roster_after=['r']; PERM.tech.duty_month=['r'];
PERM.viewer.roster_doctor=['r']; PERM.viewer.roster_tech=['r']; PERM.viewer.roster_after=['r']; PERM.viewer.duty_month=['r'];
delete SCHEMA.roster;
SCHEMA.roster_doctor={g:'D',n:'Lịch làm việc BS',icon:'🩺',rs:'doctor'};
SCHEMA.roster_tech  ={g:'D',n:'Lịch làm việc KTV',icon:'🧑‍🔧',rs:'tech'};
SCHEMA.roster_after ={g:'D',n:'Lịch ngoài giờ',icon:'🌙',rs:'after'};
SCHEMA.duty_month   ={g:'D',n:'Lịch trực theo tháng',icon:'📆',rs:'duty'};
SCHEMA.calendar.n='Lịch họp & hội chẩn'; SCHEMA.calendar.icon='🤝';
if(!SCHEMA.staff.f.some(f=>f.k==='short')) SCHEMA.staff.f.push({k:'short',l:'Tên trên lịch',t:'text'});

// ---------- 1. Cấu hình ----------
const RS_KINDS={
  doctor:{title:'Lịch làm việc Bác sĩ',key:'roster_doctor',icon:'🩺',noConflict:['GB/HỌP/HỘI CHẨN','GHÉP TẠNG','PHÉP/BÙ 1','PHÉP/BÙ 2','PHÉP/BÙ 3','HỌC/CT']},
  tech:  {title:'Lịch làm việc KTV',key:'roster_tech',icon:'🧑‍🔧',noConflict:['PHÉP/BÙ 1','PHÉP/BÙ 2','PHÉP/BÙ 3','HỌC/CT']},
  after: {title:'Lịch ngoài giờ',key:'roster_after',icon:'🌙',noConflict:[]}
};
const RS_COLORS={
  green:{label:'Xanh lá',color:'#dcfce7',bar:'#16a34a'}, amber:{label:'Vàng cam',color:'#fef3c7',bar:'#d97706'},
  blue:{label:'Xanh dương',color:'#dbeafe',bar:'#2563eb'}, gray:{label:'Xám',color:'#e2e8f0',bar:'#64748b'},
  rose:{label:'Hồng',color:'#fce7f3',bar:'#db2777'}, violet:{label:'Tím',color:'#ede9fe',bar:'#7c3aed'}
};
const RS_DEFAULT={ // mẫu ban đầu, sửa được bằng nút ⚙️ Vị trí
  doctor:[
    {label:'TRỰC',color:'green',rows:['TRỰC','RA TRỰC','TRỰC 2','RA TRỰC 2']},
    {label:'NGOẠI TRÚ',color:'amber',rows:['XQCT PKND S','XQCT PKND','SA ND222 S','SA ND223','SA ND224','SA ND429','SA CLC1','SA CLC2 S']},
    {label:'NỘI TRÚ',color:'blue',rows:['P1 CT','P1 CT + XQ CLC','SA TG2','P234 XQ S + CLC','P234 XQ','P5 MRI','P5 MRI C','P6 SA','P6 SA2','P7 SA TIM MM','GB/HỌP/HỘI CHẨN','GHÉP TẠNG']},
    {label:'NGHỈ',color:'gray',rows:['PHÉP/BÙ 1','PHÉP/BÙ 2','PHÉP/BÙ 3','HỌC/CT']}
  ],
  tech:[
    {label:'CT',color:'blue',rows:['CT 1','CT 2','CT trực']},
    {label:'MRI',color:'violet',rows:['MRI 1','MRI 2','MRI trực']},
    {label:'XQ & SA',color:'amber',rows:['XQ 1','XQ 2','SA 1','SA 2']},
    {label:'NGHỈ',color:'gray',rows:['PHÉP/BÙ','HỌC/CT']}
  ],
  after:[
    {label:'NGÀY THƯỜNG',color:'green',rows:['Ca 0 (05:30–07:00)','Ca 1 (07:00–11:00)','Ca 2 (11:00–13:00)','Ca 3 (13:00–16:00)','Ca 4 (16:00–19:30)','Ca 5 (19:30–21:00)']},
    {label:'CUỐI TUẦN / LỄ',color:'rose',rows:['Ca 0 (05:30–07:00)','Ca 1 (07:00–11:00)','Ca 2 (11:00–13:00)','Ca 3 (13:00–16:00)','Ca 4 (16:00–19:30)','Ca 5 (19:30–21:00)']}
  ]
};
const RS_DOW=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
let RS_WEEK={doctor:rsWeekStart(new Date()),tech:rsWeekStart(new Date()),after:rsWeekStart(new Date())};
let RS_MONTH=localDate().slice(0,7);
let RS_IK=null, RS_IMP=null, RS_LK=null, RS_LEDIT=null;

// ---------- 2. Tiện ích chung ----------
function rsNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');}
function rsWeekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return localDate(x);}
function rsDays(ws){const d0=new Date(ws+'T00:00:00');return Array.from({length:7},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return d;});}
function rsFmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function rsISOWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);}
function rsCSV(rows,name){const csv='\ufeff'+rows.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();}
function rsShort(code){const s=(DB.data.staff||[]).find(x=>x.empCode===code&&!x._deleted);return s?(s.short||s.fullName||code):code;}
function rsChipText(e){return e.startsWith('~')?e.slice(1):rsShort(e);}
function rsLeaveHit(code,ds){return (DB.data.leave_requests||[]).some(l=>!l._deleted&&l.status==='Đã duyệt'&&l.empCode===code&&l.startDate<=ds&&ds<=l.endDate);}

// ---------- 3. Cấu trúc vị trí theo loại ----------
function rsLayout(kind){
  if(!DB.meta) DB.meta={};
  if(!DB.meta.rsLayouts) DB.meta.rsLayouts={};
  if(!DB.meta.rsLayouts[kind]){
    const src=(kind==='doctor'&&DB.meta.rosterLayout)?DB.meta.rosterLayout:RS_DEFAULT[kind];
    DB.meta.rsLayouts[kind]=src.map(s=>({id:s.id||uid(),label:s.label,color:s.color,
      rows:s.rows.map(r=>typeof r==='string'?{id:uid(),label:r}:{id:r.id||uid(),label:r.label})}));
    saveDB();
  }
  return DB.meta.rsLayouts[kind];
}
function rsRows(kind){
  const out=[];
  rsLayout(kind).forEach(sec=>{
    const c=RS_COLORS[sec.color]||RS_COLORS.gray;
    sec.rows.forEach((row,j)=>out.push({rid:row.id,label:row.label,sec:sec.label,color:c.color,bar:c.bar,first:j===0,size:sec.rows.length}));
  });
  return out;
}
function rsFindRow(label,kind){
  const k=rsNorm(label);
  for(const sec of rsLayout(kind)) for(const row of sec.rows) if(rsNorm(row.label)===k) return {sec,row};
  return null;
}

// ---------- 4. Dữ liệu tuần ----------
function rsRec(kind,ws){return (DB.data.roster||[]).find(r=>!r._deleted&&r.weekStart===ws&&(r.kind||'doctor')===kind);}
function rsEnsure(kind,ws){
  if(!DB.data.roster) DB.data.roster=[];
  let r=rsRec(kind,ws);
  if(!r){r={id:uid(),kind,weekStart:ws,cells:{},notes:'',createdAt:Date.now(),updatedAt:Date.now()};DB.data.roster.push(r);}
  return r;
}
function rsConflicts(kind,r){
  const bad={}, rows=rsRows(kind).filter(x=>!RS_KINDS[kind].noConflict.includes(x.label));
  for(let day=0;day<7;day++){
    const seen={};
    rows.forEach(row=>{
      const key=row.rid+'|'+day;
      (r.cells[key]||[]).filter(e=>!e.startsWith('~')).forEach(code=>{
        if(seen[code]){bad[key]=true;bad[seen[code]]=true;} else seen[code]=key;
      });
    });
  }
  return bad;
}

// ---------- 5. Bảng lịch tuần (dùng chung) ----------
function rsRenderWeek(kind){
  const cfg=RS_KINDS[kind], ws=RS_WEEK[kind], days=rsDays(ws), r=rsRec(kind,ws)||{cells:{},notes:''};
  const conf=rsConflicts(kind,r), canE=can(cfg.key,'u'), rows=rsRows(kind);
  let h=`<div class="page-head">
    <div><h1>${cfg.icon} ${esc(cfg.title)}</h1><div class="subtitle">Khoa CĐHA · Tuần ${rsISOWeek(days[0])} · ${rsFmt(days[0])} – ${rsFmt(days[6])}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn-soft btn-sm" onclick="rsShift('${kind}',-7)">◀</button>
      <button class="btn-soft btn-sm" onclick="rsToday('${kind}')">Hôm nay</button>
      <button class="btn-soft btn-sm" onclick="rsShift('${kind}',7)">▶</button>
      ${canE?`<button class="btn-soft btn-sm" onclick="rsCopyPrev('${kind}')">📋 Sao chép tuần trước</button>
      <button class="btn-soft btn-sm" onclick="rsImportOpen('${kind}')">📥 Import</button>
      <button class="btn-soft btn-sm" onclick="rsLayoutOpen('${kind}')">⚙️ Vị trí</button>`:''}
      <button class="btn-soft btn-sm" onclick="rsExportWeek('${kind}')">📤 Xuất CSV</button>
    </div></div>
  <div class="table-wrap"><table style="min-width:960px;font-size:12px"><thead><tr>
    <th colspan="2" style="min-width:170px">Vị trí</th>
    ${days.map((d,i)=>`<th style="text-align:center;${i>=5?'background:#fff7ed;':''}">${RS_DOW[i]}<br><small>${rsFmt(d)}</small></th>`).join('')}
  </tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="9" class="empty">Chưa có vị trí nào. Bấm "⚙️ Vị trí" để thêm.</td></tr>`;
  rows.forEach(row=>{
    h+='<tr>';
    if(row.first) h+=`<td rowspan="${row.size}" style="background:${row.bar};color:#fff;font-weight:700;text-align:center;width:34px;padding:0"><div style="writing-mode:vertical-rl;transform:rotate(180deg);margin:auto">${esc(row.sec)}</div></td>`;
    h+=`<td style="font-weight:600;background:${row.color};white-space:nowrap">${esc(row.label)}</td>`;
    for(let day=0;day<7;day++){
      const key=row.rid+'|'+day, list=r.cells[key]||[], ds=localDate(days[day]);
      const chips=list.map(e=>{
        if(e.startsWith('~')) return `<span class="badge warn" style="margin:1px">${esc(e.slice(1))}</span>`;
        const lv=rsLeaveHit(e,ds);
        return `<span class="badge ${lv?'bad':'info'}" title="${lv?'Có đơn nghỉ đã duyệt':''}" style="margin:1px">${lv?'⚠ ':''}${esc(rsShort(e))}</span>`;
      }).join('');
      const st=`min-width:96px;${conf[key]?'box-shadow:inset 0 0 0 2px var(--bad);':''}${day>=5?'background:#fffaf3;':''}${canE?'cursor:pointer;':''}`;
      h+=`<td ${canE?`onclick="rsEditCell('${kind}','${row.rid}',${day})"`:''} style="${st}">${chips||(canE?'<span style="color:#cbd5e1">+</span>':'')}</td>`;
    }
    h+='</tr>';
  });
  if(canE) h+=`<tr><td colspan="9" style="text-align:center"><button class="btn-soft btn-sm" onclick="rsLayoutOpen('${kind}')">＋ Thêm vị trí mới</button></td></tr>`;
  h+=`</tbody></table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
    <div class="card"><h3>Ghi chú</h3><textarea rows="5" ${canE?'':'disabled'} onchange="rsNotes('${kind}',this.value)">${esc(r.notes||'')}</textarea></div>
    <div class="card"><h3>Chú thích</h3><div style="font-size:12px;line-height:2">
      <span class="badge info">Tên</span> đã phân công &nbsp;
      <span class="badge warn">Tên</span> không có trong nhân sự &nbsp;
      <span class="badge bad">⚠ Tên</span> có đơn nghỉ đã duyệt<br>
      <span style="box-shadow:inset 0 0 0 2px var(--bad);padding:0 6px">Ô viền đỏ</span> cùng một người ở nhiều vị trí trong ngày
    </div></div>
  </div>`;
  $('#view').innerHTML=h;
}
function rsShift(kind,n){const d=new Date(RS_WEEK[kind]+'T00:00:00');d.setDate(d.getDate()+n);RS_WEEK[kind]=localDate(d);rsRenderWeek(kind);}
function rsToday(kind){RS_WEEK[kind]=rsWeekStart(new Date());rsRenderWeek(kind);}
function rsNotes(kind,v){const r=rsEnsure(kind,RS_WEEK[kind]);r.notes=v;r.updatedAt=Date.now();saveDB();toast('Đã lưu ghi chú');}

// ---------- 6. Phân công một ô ----------
function rsPick(title,cur,onSave){
  const staff=(DB.data.staff||[]).filter(s=>!s._deleted).sort((a,b)=>String(a.empCode).localeCompare(String(b.empCode)));
  const picked=cur.filter(e=>!e.startsWith('~')), free=cur.filter(e=>e.startsWith('~')).map(e=>e.slice(1)).join(', ');
  $('#dlg-title').textContent=title;
  $('#dlg-body').innerHTML=`<div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${
    staff.map(s=>`<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;letter-spacing:0">
      <input type="checkbox" data-emp="${esc(s.empCode)}" ${picked.includes(s.empCode)?'checked':''} style="width:auto">
      ${esc(rsShort(s.empCode))} <small style="color:var(--muted)">${esc(s.empCode)}</small></label>`).join('')
    || '<div class="empty">Chưa có nhân sự. Thêm ở module Nhân sự trước.</div>'}</div>
  <div class="form-group full"><label>Tên khác (không có trong nhân sự, cách nhau bằng dấu phẩy)</label><input id="rs-free" value="${esc(free)}"></div>`;
  $('#dlg-foot').innerHTML=`<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" id="rs-save">💾 Lưu</button>`;
  $('#rs-save').onclick=()=>{
    const p=$$('[data-emp]:checked',$('#dlg-body')).map(x=>x.dataset.emp);
    const f=($('#rs-free').value||'').split(/[,\/;]+/).map(s=>s.trim()).filter(Boolean).map(s=>'~'+s);
    onSave([...p,...f]);
  };
  $('#dlg').showModal();
}
function rsEditCell(kind,rid,day){
  const row=rsRows(kind).find(x=>x.rid===rid); if(!row) return;
  const ws=RS_WEEK[kind], cur=(rsRec(kind,ws)||{cells:{}}).cells[rid+'|'+day]||[];
  rsPick(`${row.label} · ${RS_DOW[day]} ${rsFmt(rsDays(ws)[day])}`,cur,list=>{
    const r=rsEnsure(kind,ws), key=rid+'|'+day;
    if(list.length) r.cells[key]=list; else delete r.cells[key];
    r.updatedAt=Date.now(); saveDB(); audit('update',RS_KINDS[kind].key,r.id,key);
    closeDlg(); rsRenderWeek(kind); toast('Đã lưu phân công');
  });
}
function rsCopyPrev(kind){
  const prev=new Date(RS_WEEK[kind]+'T00:00:00'); prev.setDate(prev.getDate()-7);
  const src=rsRec(kind,localDate(prev));
  if(!src){toast('Tuần trước chưa có lịch');return;}
  if(rsRec(kind,RS_WEEK[kind])&&!confirm('Tuần này đã có lịch. Ghi đè bằng lịch tuần trước?')) return;
  const r=rsEnsure(kind,RS_WEEK[kind]);
  r.cells=JSON.parse(JSON.stringify(src.cells)); r.updatedAt=Date.now(); saveDB();
  rsRenderWeek(kind); toast('Đã sao chép lịch tuần trước');
}
function rsExportWeek(kind){
  const ws=RS_WEEK[kind], days=rsDays(ws), r=rsRec(kind,ws)||{cells:{}};
  const head=['Nhóm','Vị trí',...days.map((d,i)=>RS_DOW[i]+' '+rsFmt(d))];
  const lines=rsRows(kind).map(row=>[row.sec,row.label,...days.map((_,day)=>(r.cells[row.rid+'|'+day]||[]).map(rsChipText).join(' / '))]);
  rsCSV([head,...lines],`${RS_KINDS[kind].key}_${ws}.csv`);
}

// ---------- 7. Lịch trực theo tháng ----------
function rsDutyRows(){return rsRows('doctor').filter(r=>rsNorm(r.sec)==='truc');}
function rsDutyRec(){return (DB.data.duty_month||[]).find(r=>!r._deleted&&r.month===RS_MONTH);}
function rsDutyEnsure(){
  if(!DB.data.duty_month) DB.data.duty_month=[];
  let r=rsDutyRec();
  if(!r){r={id:uid(),month:RS_MONTH,cells:{},createdAt:Date.now(),updatedAt:Date.now()};DB.data.duty_month.push(r);}
  return r;
}
function rsRenderDuty(){
  const [y,m]=RS_MONTH.split('-').map(Number), dim=new Date(y,m,0).getDate();
  const rec=rsDutyRec()||{cells:{}}, rows=rsDutyRows(), canE=can('duty_month','u');
  const byP={};
  rows.forEach(row=>{for(let d=1;d<=dim;d++){(rec.cells[row.rid+'|'+d]||[]).filter(e=>!e.startsWith('~')).forEach(c=>{
    byP[c]=byP[c]||{days:{},count:0}; byP[c].days[d]=(byP[c].days[d]||0)+1; byP[c].count++; });}});
  let h=`<div class="page-head"><div><h1>📆 Lịch trực theo tháng</h1><div class="subtitle">Tháng ${m}/${y} · ${rows.length} vị trí trực</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn-soft btn-sm" onclick="rsMonthShift(-1)">◀</button>
      <button class="btn-soft btn-sm" onclick="rsMonthShift(0)">Tháng này</button>
      <button class="btn-soft btn-sm" onclick="rsMonthShift(1)">▶</button>
      ${canE?'<button class="btn-soft btn-sm" onclick="rsDutyFromWeeks()">🔄 Tạo từ lịch BS các tuần</button>':''}
      <button class="btn-soft btn-sm" onclick="rsDutyExport()">📤 Xuất CSV</button>
    </div></div>`;
  if(!rows.length){
    h+=`<div class="card"><div class="empty">Chưa có vị trí trực. Vào "Lịch làm việc BS" → ⚙️ Vị trí, và đặt tên nhóm là TRỰC.</div></div>`;
  } else {
    h+=`<div class="table-wrap"><table style="min-width:${150+dim*46}px;font-size:11px"><thead><tr><th style="min-width:130px">Vị trí</th>`;
    for(let d=1;d<=dim;d++){const dow=(new Date(y,m-1,d).getDay()+6)%7; h+=`<th style="text-align:center;${dow>=5?'background:#fff7ed;':''}">${d}<br><small>${['T2','T3','T4','T5','T6','T7','CN'][dow]}</small></th>`;}
    h+=`</tr></thead><tbody>`;
    rows.forEach(row=>{
      h+=`<tr><td style="background:${row.color};font-weight:600;white-space:nowrap">${esc(row.label)}</td>`;
      for(let d=1;d<=dim;d++){
        const key=row.rid+'|'+d, list=rec.cells[key]||[], dow=(new Date(y,m-1,d).getDay()+6)%7;
        const chips=list.map(e=>{
          if(e.startsWith('~')) return `<span class="badge warn" style="margin:1px">${esc(e.slice(1))}</span>`;
          const p=byP[e]||{days:{}};
          const dup=p.days[d]>1, near=p.days[d-1]||p.days[d+1];
          const tip=dup?'Trùng: cùng người ở nhiều vị trí trong ngày':near?'Trực liên tiếp với ngày kề bên':'';
          return `<span class="badge ${dup?'bad':near?'warn':'info'}" title="${tip}" style="margin:1px">${esc(rsShort(e))}</span>`;
        }).join('');
        h+=`<td ${canE?`onclick="rsDutyEdit('${row.rid}',${d})" style="cursor:pointer;`:'style="'}min-width:80px;${dow>=5?'background:#fffaf3;':''}">${chips||(canE?'<span style="color:#cbd5e1">+</span>':'')}</td>`;
      }
      h+='</tr>';
    });
    h+=`</tbody></table></div>
    <div class="card" style="margin-top:14px"><h3>Số ca trực trong tháng</h3>
      ${Object.keys(byP).length?`<table style="font-size:12px"><thead><tr><th>Nhân viên</th><th>Số ca</th><th>Số ngày</th></tr></thead><tbody>${
        Object.keys(byP).sort((a,b)=>byP[b].count-byP[a].count).map(c=>`<tr><td>${esc(rsShort(c))}</td><td><b>${byP[c].count}</b></td><td>${Object.keys(byP[c].days).length}</td></tr>`).join('')
      }</tbody></table>`:'<div class="empty">Chưa có ca trực trong tháng</div>'}
    </div>`;
  }
  $('#view').innerHTML=h;
}
function rsMonthShift(n){
  if(n===0) RS_MONTH=localDate().slice(0,7);
  else{const [y,m]=RS_MONTH.split('-').map(Number);const d=new Date(y,m-1+n,1);RS_MONTH=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

}
function rsDutyEdit(rid,d){
  const row=rsDutyRows().find(x=>x.rid===rid); if(!row) return;
  const cur=(rsDutyRec()||{cells:{}}).cells[rid+'|'+d]||[];
  rsPick(`${row.label} · ngày ${d}/${RS_MONTH.split('-')[1]}`,cur,list=>{
    const r=rsDutyEnsure(), key=rid+'|'+d;

function rsDutyFromWeeks(){
  const [y,m]=RS_MONTH.split('-').map(Number), dim=new Date(y,m,0).getDate();
  if(!confirm('Điền lịch trực tháng từ lịch BS các tuần? Các ô trùng ngày sẽ được ghi đè.')) return;
  const r=rsDutyEnsure(), rows=rsDutyRows(); let n=0;
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m-1,d), wk=rsRec('doctor',rsWeekStart(dt)); if(!wk) continue;
    const di=(dt.getDay()+6)%7;
    rows.forEach(row=>{
      const list=wk.cells[row.rid+'|'+di], key=row.rid+'|'+d;
      if(list&&list.length){r.cells[key]=[...list];n++;} else delete r.cells[key];
    });
  }
  r.updatedAt=Date.now(); saveDB(); rsRenderDuty(); toast(`Đã điền ${n} ô từ lịch tuần`);
}
function rsDutyExport(){
  const [y,m]=RS_MONTH.split('-').map(Number), dim=new Date(y,m,0).getDate(), rec=rsDutyRec()||{cells:{}};
  const head=['Vị trí',...Array.from({length:dim},(_,i)=>String(i+1))];
  const lines=rsDutyRows().map(row=>[row.label,...Array.from({length:dim},(_,i)=>(rec.cells[row.rid+'|'+(i+1)]||[]).map(rsChipText).join(' / '))]);

}

function rsTemplate(kind){
  rsCSV([['Nhóm','Vị trí',...RS_DOW],...rsRows(kind).map(r=>[r.sec,r.label,'','','','','','',''])],`mau_${RS_KINDS[kind].key}.csv`);
}
function rsParseText(text){
  const t=String(text||'').replace(/^\ufeff/,'');
  if(!t.trim()) return [];
  const first=t.split(/\r?\n/)[0];
  if(first.includes('\t')&&!first.includes(',')) return t.split(/\r?\n/).filter(l=>l.trim()!=='').map(l=>l.split('\t').map(x=>x.trim()));
  return parseCSVText(t).map(r=>r.map(x=>String(x).trim()));
}
function rsStaffIndex(){
  const exact=new Map(), last=new Map();
  (DB.data.staff||[]).filter(s=>!s._deleted).forEach(s=>{
    [s.empCode,s.short,s.fullName].forEach(v=>{const k=rsNorm(v);if(!k)return;
      if(!exact.has(k)) exact.set(k,s.empCode); else if(exact.get(k)!==s.empCode) exact.set(k,'__AMBIG__');});
    const parts=String(s.fullName||'').trim().split(/\s+/), lk=rsNorm(parts[parts.length-1]);
    if(lk){if(!last.has(lk)) last.set(lk,[]); last.get(lk).push(s.empCode);}
  });
  return {exact,last};
}
function rsResolve(text,idx){
  return String(text).split(/[\/,;\n]+/).map(s=>s.trim()).filter(s=>s&&!/^[.\-…]+$/.test(s)).map(s=>{
    const t=s.replace(/^(BSPK|BS|KTV|ĐD|NV)\.?\s*/i,'').trim(); if(!t) return null;
    const k=rsNorm(t), ex=idx.exact.get(k);
    if(ex&&ex!=='__AMBIG__') return {kind:'ok',code:ex,text:t};
    const fz=idx.last.get(k);
    if(fz&&fz.length===1) return {kind:'fuzzy',code:fz[0],text:t};
    return {kind:'miss',text:t};
  }).filter(Boolean);
}
function rsBuildPlan(kind,body){
  const idx=rsStaffIndex(), out=[]; let cur='';
  body.forEach(row=>{
    if(row[0]) cur=row[0].trim();
    const label=(row[1]||'').trim();
    if(!label||/^(vị trí|vi tri|nhóm)$/i.test(label)) return;
    const found=rsFindRow(label,kind), days=[];
    for(let d=0;d<7;d++) days.push(rsResolve(row[2+d]||'',idx));
    const secExists=!!rsLayout(kind).find(s=>rsNorm(s.label)===rsNorm(cur));
    out.push({rid:found?found.row.id:null,label:found?found.row.label:label,secName:found?null:(cur||'NHÓM KHÁC'),
      status:found?'Có sẵn':(secExists?'Vị trí mới':'Vị trí + nhóm mới'),days});
  });
  return out;
}
function rsImportOpen(kind){

function rsImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=evt=>{$('#ri-text').value=evt.target.result;};
  reader.readAsText(f,'UTF-8'); e.target.value='';
}
function rsAnalyze(){
  const rows=rsParseText($('#ri-text').value);
  if(!rows.length){toast('Chưa có dữ liệu');return;}
  const isHeader=rows[0].slice(2).filter(c=>/^(thứ|chủ nhật|t[2-7]|cn)/i.test(c)).length>=3;
  const plan=rsBuildPlan(RS_IK,isHeader?rows.slice(1):rows);
  if(!plan.length){toast('Không nhận diện được dòng vị trí nào');return;}
  RS_IMP={week:rsWeekStart(new Date($('#ri-date').value+'T00:00:00')),mode:$('#ri-mode').value,plan};
  rsPreview();
}
function rsPreview(){
  const P=RS_IMP.plan, all=P.flatMap(it=>it.days.flat());
  const miss=all.filter(x=>x.kind==='miss').length, fz=all.filter(x=>x.kind==='fuzzy').length, newc=P.filter(x=>!x.rid).length;
  const chip=x=>x.kind==='ok'?`<span class="badge good">${esc(rsShort(x.code))}</span>`
    :x.kind==='fuzzy'?`<span class="badge warn" title="Khớp gần đúng">${esc(rsShort(x.code))}?</span>`
    :`<span class="badge bad" title="Không có trong nhân sự">${esc(x.text)}</span>`;
  $('#ri-preview').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:12px">
    <span class="badge info">Tuần ${esc(RS_IMP.week)}</span><span class="badge info">${P.length} dòng</span>
    <span class="badge ${newc?'warn':'good'}">${newc} vị trí mới</span>
    <span class="badge ${fz?'warn':'good'}">${fz} khớp gần đúng</span>
    <span class="badge ${miss?'bad':'good'}">${miss} không khớp</span></div>
    <div style="overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px">
    <table style="font-size:11px;min-width:820px"><thead><tr><th>Vị trí</th><th>Trạng thái</th>${RS_DOW.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>
    ${P.map(it=>`<tr><td><b>${esc(it.label)}</b></td><td><span class="badge ${it.status==='Có sẵn'?'good':'warn'}">${esc(it.status)}</span></td>${it.days.map(l=>`<td>${l.map(chip).join(' ')}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  $('#ri-go').disabled=false;
}
function rsApply(){
  if(!RS_IMP) return;
  const kind=RS_IK, L=rsLayout(kind);
  RS_IMP.plan.forEach(it=>{
    if(it.rid) return;
    const ex=rsFindRow(it.label,kind); if(ex){it.rid=ex.row.id;return;}
    let sec=L.find(s=>rsNorm(s.label)===rsNorm(it.secName));
    if(!sec){sec={id:uid(),label:it.secName,color:'gray',rows:[]};L.push(sec);}
    const row={id:uid(),label:it.label}; sec.rows.push(row); it.rid=row.id;
  });
  const r=rsEnsure(kind,RS_IMP.week);
  RS_IMP.plan.forEach(it=>it.days.forEach((list,day)=>{
    const key=it.rid+'|'+day, entries=list.map(x=>x.kind==='miss'?'~'+x.text:x.code);
    const value=RS_IMP.mode==='merge'?[...new Set([...(r.cells[key]||[]),...entries])]:entries;
    if(value.length) r.cells[key]=value; else delete r.cells[key];
  }));
  r.updatedAt=Date.now(); saveDB(); audit('import',RS_KINDS[kind].key,r.id,`${RS_IMP.week}: ${RS_IMP.plan.length} dòng`);
  RS_WEEK[kind]=RS_IMP.week; RS_IMP=null;
  closeDlg(); rsRenderWeek(kind); toast('Đã nhập lịch làm việc');
}

/* =====================================================================
   LỊCH HỌP & HỘI CHẨN (kiểu Google Calendar)
   ===================================================================== */
const MT_TYPES={'Giao ban':'#2563eb','Hội chẩn':'#d97706','Hội nghị/Chuyên đề':'#7c3aed','Đào tạo':'#16a34a','Họp khoa':'#0891b2','Khác':'#64748b'};
const MT_FORMATS=['Trực tiếp','Trực tuyến','Hỗn hợp'];
const MT_REPEAT=['Không lặp','Hàng tuần','Hàng tháng'];
let MT={view:'week',date:localDate()};

// Chuyển sự kiện cũ sang Lịch họp (một lần)
function mtMigrate(){
  if(!DB.meta) DB.meta={};
  if(DB.meta.mtMigrated) return;
  if(!DB.data.meetings) DB.data.meetings=[];
  const T={Truc:'Khác',HoiChan:'Hội chẩn',DaoTao:'Đào tạo',Khac:'Khác'};
  (DB.data.events||[]).filter(e=>!e._deleted&&e.date).forEach(e=>{
    const st=e.time||'08:00', [h,mi]=st.split(':').map(Number);
    const en=String((h+1)%24).padStart(2,'0')+':'+String(mi||0).padStart(2,'0');
    DB.data.meetings.push({id:uid(),title:e.title||'(không tiêu đề)',date:e.date,start:st,end:en,
      type:T[e.type]||'Khác',format:'Trực tiếp',location:'',link:'',organizer:'',
      attendees:e.empCode?[e.empCode]:[],agenda:e.note||'',repeat:'Không lặp',repeatUntil:'',
      createdBy:'',createdAt:Date.now(),updatedAt:Date.now()});
  });
  DB.meta.mtMigrated=true; saveDB();
}
function mtAll(){ if(!DB.data.meetings) DB.data.meetings=[]; return DB.data.meetings.filter(m=>!m._deleted); }
function mtDateAdd(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return localDate(d);}

// Mở rộng chuỗi lặp thành các lượt trong khoảng [from,to]
function mtOccs(from,to){
  const out=[];
  mtAll().forEach(m=>{
    const until=m.repeatUntil||'9999-12-31';
    if(m.repeat==='Hàng tuần'){
      let n=0;
      for(let s=m.date; s<=to && s<=until && n<400; s=mtDateAdd(s,7), n++) if(s>=from) out.push({m,date:s});
    } else if(m.repeat==='Hàng tháng'){
      const base=new Date(m.date+'T00:00:00'), bd=base.getDate();
      for(let k=0;k<400;k++){
        const d=new Date(base.getFullYear(),base.getMonth()+k,bd), s=localDate(d);
        if(s>to||s>until) break;
        if(d.getDate()===bd && s>=from) out.push({m,date:s});
      }
    } else if(m.date>=from && m.date<=to) out.push({m,date:m.date});
  });
  return out.sort((a,b)=>(a.date+a.m.start).localeCompare(b.date+b.m.start));
}
// Các lượt trùng giờ và cùng người hoặc cùng phòng
function mtClash(occs){
  const bad=new Set();
  for(let i=0;i<occs.length;i++) for(let j=i+1;j<occs.length;j++){
    const a=occs[i], b=occs[j];
    if(a.date!==b.date) continue;
    if(!(a.m.start<b.m.end && b.m.start<a.m.end)) continue;
    const shared=a.m.attendees.some(x=>!x.startsWith('~')&&b.m.attendees.includes(x));
    const room=a.m.location && a.m.location===b.m.location;
    if(shared||room){bad.add(a.m.id+'|'+a.date);bad.add(b.m.id+'|'+b.date);}
  }
  return bad;
}
function mtRange(){
  const d=new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return [MT.date,MT.date];
  if(MT.view==='week'){const s=rsWeekStart(d);return [s,mtDateAdd(s,6)];}
  if(MT.view==='month'){
    const f=new Date(d.getFullYear(),d.getMonth(),1), l=new Date(d.getFullYear(),d.getMonth()+1,0);
    return [rsWeekStart(f), mtDateAdd(rsWeekStart(l),6)];
  }
  return [MT.date, mtDateAdd(MT.date,30)];
}
function mtTitle(){
  const d=new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return `${RS_DOW[(d.getDay()+6)%7]}, ${rsFmt(d)}/${d.getFullYear()}`;
  if(MT.view==='month') return `Tháng ${d.getMonth()+1} / ${d.getFullYear()}`;
  const [f,t]=mtRange();
  if(MT.view==='week') return `${rsFmt(new Date(f+'T00:00:00'))} – ${rsFmt(new Date(t+'T00:00:00'))} / ${d.getFullYear()}`;
  return `31 ngày từ ${rsFmt(d)}`;
}
function mtShift(n){
  const d=new Date(MT.date+'T00:00:00');
  if(MT.view==='month') d.setMonth(d.getMonth()+n);
  else if(MT.view==='day') d.setDate(d.getDate()+n);
  else if(MT.view==='week') d.setDate(d.getDate()+7*n);
  else d.setDate(d.getDate()+31*n);
  MT.date=localDate(d); renderCalendar();
}
function mtNames(m){return (m.attendees||[]).map(e=>e.startsWith('~')?e.slice(1):rsShort(e)).join(', ');}
function mtChip(o,clash){
  const m=o.m, c=MT_TYPES[m.type]||'#64748b';
  return `<div title="${esc(m.title)}${mtNames(m)?' · '+esc(mtNames(m)):''}" onclick="event.stopPropagation();mtEdit('${m.id}','${o.date}')"
    style="border-left:3px solid ${c};background:${c}22;padding:3px 6px;border-radius:5px;margin-bottom:3px;font-size:11px;cursor:pointer;${clash?'box-shadow:inset 0 0 0 1px var(--bad);':''}">
    <b>${esc(m.start)}</b> ${clash?'⚠ ':''}${esc(m.title)}</div>`;
}
function mtRow(o,clash){
