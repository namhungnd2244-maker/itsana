// Nhãn nơi lưu dữ liệu của module: đồng bộ máy chủ hay chỉ trên máy này
function scopeTag(dataKey){
  if(!isCloud()) return '';
  return isSynced(dataKey) ? '<span class="scope-tag cloud" title="Dữ liệu module này được đồng bộ với máy chủ">☁️ Đồng bộ</span>'
    : '<span class="scope-tag local" title="Module này chưa nằm trong danh sách đồng bộ — dữ liệu chỉ lưu trên máy này">💻 Chỉ trên máy này</span>';
}
const stateChip = (state, labels)=>`<span class="state-chip ${labels[state]?state:''}">${esc(labels[state]||state)}</span>`;
const staffName = code=>{ const s = (DB.data.staff||[]).find(x=>x.empCode===code&&!x._deleted); return s ? (s.fullName||s.short||'') : ''; };
function leaveCanEdit(r){
  if(isAdmin()) return true;
  return (r.state||'draft')==='draft' && can('leave_requests','u') && isOwner(r);
}
function leaveDays(r){
  const a = new Date(r.startDate+'T00:00:00'), b = new Date(r.endDate+'T00:00:00');
  return isNaN(a)||isNaN(b) ? '' : Math.round((b-a)/86400000)+1;
}
function renderLeaveWorkflow(){
  const all = (DB.data.leave_requests||[]).filter(r=>!r._deleted);

    ${canC?'<button class="btn" onclick="openLeaveForm(null)">+ Tạo đơn</button>':''}</div>
    <div class="filter-bar"><select id="lv-filter" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option>${LEAVE_STATES.map(s=>`<option value="${s}" ${fs===s?'selected':''}>${LEAVE_STATE_LABEL[s]}</option>`).join('')}</select>
      <span class="hint" style="margin:0">Duyệt / từ chối: chỉ Quản trị. Sau khi gửi duyệt, người tạo không sửa được ngày nghỉ.</span></div>`;
  if(!rows.length){ h += `<div class="card"><div class="empty">${all.length?'Không có đơn ở trạng thái này':'Chưa có đơn'}</div></div>`; }
  else {
    h += '<div class="table-wrap"><table><thead><tr><th>Mã NV</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Số ngày</th><th>Lý do</th><th>Trạng thái</th><th>Duyệt bởi</th><th></th></tr></thead><tbody>';
    rows.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(r=>{
      const state = r.state||'draft', T = LEAVE_TRANSITIONS[state]||[], mine = isAdmin() || (canU && isOwner(r));
      h += `<tr><td><b>${esc(r.empCode)}</b>${staffName(r.empCode)?`<br><small style="color:var(--mut)">${esc(staffName(r.empCode))}</small>`:''}</td><td>${esc(r.type)}</td><td>${fmtDate(r.startDate)}</td><td>${fmtDate(r.endDate)}</td><td>${esc(leaveDays(r))}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(r.reason||'')}${r.rejectReason?`<br><small style="color:var(--bad)">Từ chối: ${esc(r.rejectReason)}</small>`:''}</td>
        <td>${stateChip(state, LEAVE_STATE_LABEL)}${r._rej?' <span class="badge bad" title="'+esc(REJECT_LABEL[r._rej.reason]||r._rej.reason)+'">⚠ máy chủ từ chối</span>':''}</td>
        <td>${esc(r.approvedBy||'—')}</td>
        <td class="row-actions">
          ${canA && T.includes('approved')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','approved')">✓ Duyệt</button>`:''}
          ${canA && T.includes('rejected')?`<button class="btn-danger btn-sm" onclick="leaveTransition('${r.id}','rejected')">✗ Từ chối</button>`:''}
          ${mine && T.includes('submitted')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','submitted')">Gửi duyệt</button>`:''}
          ${mine && T.includes('taken')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','taken')">Đã nghỉ</button>`:''}
          ${mine && T.includes('cancelled')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','cancelled')">Hủy</button>`:''}
          ${leaveCanEdit(r)?`<button class="icon-btn" onclick="openLeaveForm('${r.id}')" title="Sửa" aria-label="Sửa">✏️</button>`:''}
        </td></tr>`;

    const approved = all.filter(r=>r.state==='approved'&&r.startDate&&r.endDate);

    if(!approved.length) h += '<div class="empty">Không có đơn đã duyệt</div>';
    else {
      h += '<table style="font-size:12px"><thead><tr><th>Mã NV</th><th>Từ</th><th>Đến</th><th>Cảnh báo</th></tr></thead><tbody>';
      approved.forEach(r=>{
        const hits = [];
        for(let s = r.startDate, n = 0; s<=r.endDate && n<62; s = mtDateAdd(s,1), n++){

      });
      h += '</tbody></table>';

    h += '</div>';
  }
  $('#view').innerHTML = h;
  $('#lv-filter').onchange = e=>{ FILTERS.leave_requests = {state:e.target.value}; renderLeaveWorkflow(); };

function leaveTransition(id, newState){
  const r = (DB.data.leave_requests||[]).find(x=>x.id===id); if(!r) return;
  const cur = r.state||'draft';
  if(!LEAVE_TRANSITIONS[cur]?.includes(newState)){ toast(`Không thể chuyển ${LEAVE_STATE_LABEL[cur]||cur} → ${LEAVE_STATE_LABEL[newState]||newState}`); return; }
  const decide = newState==='approved' || newState==='rejected';
  if(decide && !isAdmin()){ toast('Chỉ Quản trị được duyệt hoặc từ chối đơn'); return; }
  if(!decide && !(isAdmin() || (can('leave_requests','u') && isOwner(r)))){ toast('Chỉ người tạo đơn hoặc Quản trị được thao tác'); return; }
  if(newState==='rejected'){
    const why = prompt('Lý do từ chối (không bắt buộc):');
    if(why === null) return;
    r.rejectReason = why.trim().slice(0,200);
  }
  if(newState==='cancelled' && !confirm('Hủy đơn nghỉ này?')) return;
  r.state = newState;
  r.updatedAt = Date.now();
  if(decide){ r.approvedBy = CURRENT.name; r.approvedAt = Date.now(); }
  if(newState==='taken') r.takenAt = Date.now();
  audit(newState==='approved'?'approve':newState==='rejected'?'reject':'transition','leave_requests',id,`${cur}→${newState}`);
  saveDB(); renderLeaveWorkflow(); renderNav(); toast(`Đã ${LEAVE_STATE_LABEL[newState]}`);
}

function saveLeave(id){
  const empCode = $('#lv-emp').value.trim(), type = $('#lv-type').value;
  const startDate = $('#lv-start').value, endDate = $('#lv-end').value, reason = $('#lv-reason').value.trim();
  if(!empCode||!startDate||!endDate){ toast('Điền mã NV và ngày'); return; }
  if(endDate<startDate){ toast('Ngày kết thúc phải từ ngày bắt đầu trở đi'); return; }
  const known = (DB.data.staff||[]).some(s=>!s._deleted && s.empCode===empCode);
  if(!known && (DB.data.staff||[]).length && !confirm(`Mã NV "${empCode}" chưa có trong danh sách nhân sự. Vẫn lưu?`)) return;
  const dup = (DB.data.leave_requests||[]).some(x=>!x._deleted && x.id!==id && x.empCode===empCode && !['rejected','cancelled'].includes(x.state||'draft') && x.startDate<=endDate && startDate<=x.endDate);
  if(dup && !confirm('Nhân viên này đã có đơn nghỉ trùng khoảng ngày. Vẫn lưu?')) return;
  if(id){
    const r = DB.data.leave_requests.find(x=>x.id===id);

  saveDB(); closeDlg(); renderLeaveWorkflow(); renderNav(); toast('Đã lưu');
}

function taskTransition(id, newState){

  saveDB(); renderTaskWorkflow(); renderNav(); toast(`→ ${TASK_STATE_LABEL[newState]}`);

/* ---------- 15. GENERIC RENDER ---------- */
function genericRows(key){
  const mod = SCHEMA[key], f = FILTERS[key]||{}, s = (SEARCHS[key]||'').trim().toLowerCase();
  let rows = (DB.data[key]||[]).filter(r=>!r._deleted).filter(r=>{
    for(const fk in f){ if(f[fk] && String(r[fk]??'')!==f[fk]) return false; }
    if(s){ const txt = (mod.f||[]).map(x=>String(r[x.k]??'')).join(' ').toLowerCase(); if(!txt.includes(s)) return false; }
    return true;
  });
  const so = SORTS[key];
  if(so){
    const col = (mod.f||[]).find(c=>c.k===so.k), dir = so.d==='desc'?-1:1;
    rows = rows.slice().sort((a,b)=>{
      const x = a[so.k], y = b[so.k], ex = x===''||x==null, ey = y===''||y==null;
      if(ex||ey) return ex&&ey?0:ex?1:-1;                 // ô trống luôn nằm cuối
      if(col && col.t==='num') return (Number(x)-Number(y))*dir;
      return String(x).localeCompare(String(y),'vi',{numeric:true})*dir;
    });
  }
  return rows;
}
function renderGeneric(key){
  const mod = SCHEMA[key];
  const canC = can(key,'c');
  let fb = '<div class="filter-bar">';
  (mod.f||[]).filter(f=>f.t==='select'&&f.o).forEach(f=>{
    const cur = (FILTERS[key]||{})[f.k]||'';
    fb += `<select data-fk="${esc(f.k)}" aria-label="Lọc ${esc(f.l)}"><option value="">${esc(f.l)}</option>${f.o.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  });
  fb += `<input type="search" class="search" data-search placeholder="🔍 Tìm…" value="${esc(SEARCHS[key]||'')}" aria-label="Tìm kiếm">`;
  if(canC) fb += `<button class="btn" data-add>+ Thêm</button>`;
  fb += `<button class="btn-soft" data-csv>📥 CSV</button></div>`;
  $('#view').innerHTML = `
    <div class="page-head"><div><h1>${mod.icon||'📄'} ${esc(mod.n)}</h1><div class="subtitle">${esc(GROUP_NAMES[mod.g]||'')} · <span id="gen-count"></span> ${scopeTag(key)}</div></div></div>
    ${fb}<div class="table-wrap" id="gen-table"></div>`;
  $$('[data-add]').forEach(b=>b.onclick = ()=>openForm(key,null));
  $$('[data-fk]').forEach(s=>s.onchange = ()=>{
    if(!FILTERS[key]) FILTERS[key] = {};
    FILTERS[key][s.dataset.fk] = s.value; PAGES[key] = 0; paintGenericTable(key);
  });
  // Chỉ vẽ lại bảng — ô tìm kiếm giữ nguyên con trỏ khi đang gõ
  const srch = $('[data-search]'); if(srch) srch.oninput = e=>{ SEARCHS[key] = e.target.value; PAGES[key] = 0; paintGenericTable(key); };
  const csvBtn = $('[data-csv]'); if(csvBtn) csvBtn.onclick = ()=>showCSVMenu(key);
  paintGenericTable(key);
}
function paintGenericTable(key){
  const mod = SCHEMA[key], box = $('#gen-table'); if(!box) return;
  const canU = can(key,'u'), canD = can(key,'d');
  const rows = genericRows(key), cols = mod.f||[], so = SORTS[key];
  const pages = Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
  const page = Math.min(PAGES[key]||0, pages-1); PAGES[key] = page;
  const slice = rows.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE);
  let tb = '<table><thead><tr><th style="width:40px">#</th>';
  cols.forEach(c=>tb += `<th class="sortable" data-sort="${esc(c.k)}" title="Bấm để sắp xếp">${esc(c.l)}${so&&so.k===c.k?`<span class="sort-ind">${so.d==='desc'?'▼':'▲'}</span>`:''}</th>`);
  tb += '<th style="width:90px"></th></tr></thead><tbody>';
  if(!rows.length) tb += `<tr><td colspan="${cols.length+2}" class="empty">${(DB.data[key]||[]).some(r=>!r._deleted)?'Không có bản ghi khớp bộ lọc':'Chưa có dữ liệu'}</td></tr>`;
  slice.forEach((r,i)=>{
    tb += `<tr><td>${page*PAGE_SIZE+i+1}</td>`;
    cols.forEach(c=>tb += `<td>${renderCell(c,r[c.k],key)}</td>`);
    tb += '<td class="row-actions">';

    tb += '</td></tr>';
  });
  tb += '</tbody></table>';
  if(pages > 1) tb += `<div class="pager"><span>Trang ${page+1}/${pages}</span><button class="btn-soft btn-sm" data-page="${page-1}" ${page<=0?'disabled':''}>◀ Trước</button><button class="btn-soft btn-sm" data-page="${page+1}" ${page>=pages-1?'disabled':''}>Sau ▶</button></div>`;
  box.innerHTML = tb;

  $$('[data-edit]',box).forEach(b=>b.onclick = ()=>openForm(key,b.dataset.edit));
  $$('[data-del]',box).forEach(b=>b.onclick = ()=>delRecord(key,b.dataset.del));
  $$('[data-page]',box).forEach(b=>b.onclick = ()=>{ PAGES[key] = Number(b.dataset.page); paintGenericTable(key); });
  $$('[data-sort]',box).forEach(th=>th.onclick = ()=>{
    const k = th.dataset.sort, cur = SORTS[key];
    SORTS[key] = !cur || cur.k!==k ? {k,d:'asc'} : cur.d==='asc' ? {k,d:'desc'} : null;
    PAGES[key] = 0;                      // đổi cách sắp xếp → quay về trang đầu
    paintGenericTable(key);

function statusClass(s, key){
  if(s==='Đang làm' && (key==='staff'||key==='radiation_workers')) return 'good';
  if(/^(Hoàn thành|Đã duyệt|Hiệu lực|Đạt|Xong|Đủ|Hoạt động|An toàn|Đã thanh toán|Đang áp dụng|Đã mua|Đã gửi|Đóng|Đang tuân thủ|Đã khắc phục|Đã thẩm định)$/.test(s)) return 'good';
  if(/^(Hết hạn|Từ chối|Không đạt|Chưa đạt|Hết|Ngừng|Vượt ngưỡng|Trễ hạn|Trễ|Hủy|Có vi phạm|Cần thay|Đã nghỉ|Hết hiệu lực)$/.test(s)) return 'bad';
  if(/^(Chờ|Đề xuất|Sắp hết|Đang làm|Đang|Đang sửa|Đang xử lý|Bảo trì|Nháp|Chưa duyệt|Mở|Mới|Chưa|Tạm ngưng|Tạm hoãn|Nghỉ phép|Thai sản|Đang theo dõi|Chờ thanh lý)$/.test(s)) return 'warn';
  return 'info';
}
function renderCell(f,v,key){
  if(v===''||v==null) return '<span style="color:#94a3b8">—</span>';
  if(f.t==='date') return fmtDate(v);
  if(f.t==='datetime-local') return esc(fmtDateTime(v));
  if(f.t==='num') return fmtNum(v);
  if(f.t==='bool') return v?'<span class="badge good">✔</span>':'<span class="badge mut">—</span>';
  if(f.k==='status'||f.k==='result'){ const s = String(v); return `<span class="badge ${statusClass(s,key)}">${esc(s)}</span>`; }
  if(f.t==='textarea'){ const s = String(v); return esc(s.length>160 ? s.slice(0,160)+'…' : s); }
  return esc(v);
}
function openForm(key,id){
  const mod = SCHEMA[key];
  if(!can(key, id?'u':'c')){ toast('Không có quyền'); return; }
  const r = id?(DB.data[key]||[]).find(x=>x.id===id):{};
  if(!r) return;
  let html = '';
  (mod.f||[]).forEach(f=>{
    const val = r[f.k]??'';
    html += `<div class="form-group ${f.full?'full':''}"><label>${esc(f.l)}${f.r?' *':''}</label>`;
    if(f.t==='select'){
      const opts = (f.o||[]).slice(); if(val!=='' && !opts.includes(val)) opts.push(val);   // giữ giá trị cũ ngoài danh mục
      html += `<select data-k="${esc(f.k)}" ${f.r?'required':''}><option value="">— chọn —</option>${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }
    else if(f.t==='textarea') html += `<textarea data-k="${esc(f.k)}" rows="3" ${f.r?'required':''}>${esc(val)}</textarea>`;
    else if(f.t==='date') html += `<input type="date" data-k="${esc(f.k)}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='datetime-local') html += `<input type="datetime-local" data-k="${esc(f.k)}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='num') html += `<input type="number" step="any" data-k="${esc(f.k)}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='bool') html += `<input type="checkbox" data-k="${esc(f.k)}" ${val?'checked':''} style="width:auto;align-self:flex-start">`;
    else html += `<input type="text" data-k="${esc(f.k)}" value="${esc(val)}" ${f.r?'required':''}>`;
    html += '</div>';
  });
  $('#dlg-title').textContent = (id?'Sửa':'Thêm')+': '+mod.n;
  $('#dlg-body').innerHTML = html;
  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" onclick="saveForm('${key}','${id||''}')">💾 Lưu</button>`;
  $('#dlg').showModal();
}
function saveForm(key,id){
  const mod = SCHEMA[key];
  if(!can(key, id?'u':'c')){ toast('Không có quyền'); return; }
  const data = {}, body = $('#dlg-body');
  for(const f of (mod.f||[])){
    const el = $(`[data-k="${f.k}"]`, body); if(!el) continue;
    if(f.t==='bool') data[f.k] = el.checked;
    else if(f.t==='num'){
      if(el.value!=='' && isNaN(Number(el.value))){ toast('Giá trị số không hợp lệ: '+f.l); return; }
      data[f.k] = el.value===''?'':Number(el.value);
    }
    else data[f.k] = el.value.trim();
  }
  for(const f of (mod.f||[])){
    if(f.r && (data[f.k]===''||data[f.k]==null)){ toast('Vui lòng nhập: '+f.l); return; }
  }
  const uk = UNIQUE_KEY[key];
  if(uk && data[uk]!=='' && (DB.data[key]||[]).some(x=>!x._deleted && x.id!==id && String(x[uk])===String(data[uk]))){
    toast(`Đã tồn tại bản ghi có ${(mod.f.find(f=>f.k===uk)||{}).l||uk} = ${data[uk]}`); return;
  }
  const first = data[(mod.f||[])[0]?.k]||'';
  if(id){
    const i = DB.data[key].findIndex(x=>x.id===id);
    if(i>=0){ DB.data[key][i] = {...DB.data[key][i], ...data, updatedAt: Date.now()}; audit('update', key, id, first); }
  } else {
    const nid = uid();
    DB.data[key].push({id:nid, ...data, createdAt:Date.now(), updatedAt:Date.now(), createdBy:CURRENT.username});
    audit('create', key, nid, first);
  }
  saveDB(); closeDlg(); paintOrRender(key); renderNav(); toast('Đã lưu');
}
function delRecord(key,id){
  if(!can(key,'d')){ toast('Không có quyền xóa'); return; }
  if(!confirm('Xóa bản ghi này?')) return;
  const i = DB.data[key].findIndex(x=>x.id===id);
  if(i<0) return;
  DB.data[key][i]._deleted = true; DB.data[key][i]._deletedAt = Date.now(); DB.data[key][i].updatedAt = Date.now();
  audit('delete', key, id, ''); saveDB(); paintOrRender(key); renderNav(); toast('Đã xóa');
}

function handleCaseImage(e){
  const f = e.target.files[0]; if(!f) return;
  if(!/^image\/(png|jpeg|gif|webp)$/.test(f.type)){ toast('Chỉ nhận ảnh PNG, JPG, GIF hoặc WebP'); e.target.value = ''; return; }

  const r = new FileReader();
  r.onload = ev=>{ TEMP_CASE_IMAGES.push({url:ev.target.result, caption:''}); renderCaseImagesEditor(); $('#img-count').textContent = TEMP_CASE_IMAGES.length+' ảnh'; };
  r.readAsDataURL(f); e.target.value = '';

function buildTemplateOutput(id){
  const t = (DB.data.report_templates||[]).find(x=>x.id===id); if(!t) return;
  const vars = [...new Set((t.body.match(/\{\{(\w+)\}\}/g)||[]).map(v=>v.replace(/[{}]/g,'').trim()))];
  let out = t.body;
  vars.forEach(v=>{ const val = (document.getElementById('tv-'+v)?.value) || `[${v}]`; out = out.replace(new RegExp(`\\{\\{\\s*${v}\\s*\\}\\}`,'g'), val); });

function renderRiskMatrix(){
  const risks = (DB.data.risks||[]).filter(x=>!x._deleted);
  const matrix = Array(5).fill(0).map(()=>Array(5).fill(0));
  const cells = Array(5).fill(0).map(()=>Array(5).fill(null).map(()=>[]));
  risks.forEach(r=>{
    const p = Math.max(1,Math.min(5,Number(r.probability)||1));
    const i = Math.max(1,Math.min(5,Number(r.impact)||1));
    matrix[5-p][i-1]++; cells[5-p][i-1].push(r);
  });
  const getColor = (p,i)=>{ const s = p*i; if(s>=15) return '#dc2626'; if(s>=8) return '#f59e0b'; if(s>=4) return '#fbbf24'; return '#22c55e'; };
  let h = `<div class="page-head"><div><h1>🎲 Ma trận rủi ro</h1><div class="subtitle">${risks.length} rủi ro</div></div></div>
  <div class="card">
    <div class="risk-legend" style="margin-bottom:16px"><span><i style="background:#22c55e"></i>Thấp (1-3)</span><span><i style="background:#fbbf24"></i>T.Bình (4-7)</span><span><i style="background:#f59e0b"></i>Cao (8-14)</span><span><i style="background:#dc2626"></i>N.Cao (15-25)</span></div>
    <div style="display:flex;gap:4px">
      <div style="writing-mode:vertical-rl;transform:rotate(180deg);padding:8px;background:var(--pnl2);border-radius:6px;font-weight:700;font-size:12px">Khả năng →</div>
      <div style="flex:1"><table style="width:100%;border-collapse:separate;border-spacing:4px">
        ${[5,4,3,2,1].map(p=>`<tr><td style="text-align:right;font-weight:700;font-size:12px;padding:6px;width:40px">${p}</td>${[1,2,3,4,5].map(i=>`<td style="height:70px;text-align:center;background:${getColor(p,i)};color:white;border-radius:6px;font-weight:800;font-size:20px;cursor:${cells[5-p][i-1].length?'help':'default'}" title="${esc(cells[5-p][i-1].map(r=>r.title).join('\n'))}">${matrix[5-p][i-1]||''}</td>`).join('')}</tr>`).join('')}
        <tr><td></td>${[1,2,3,4,5].map(i=>`<td style="text-align:center;font-weight:700;font-size:12px;padding:6px">${i}</td>`).join('')}</tr>
      </table></div></div>
  </div>
  <div class="card"><h3>Danh sách rủi ro</h3>
    ${risks.length?risks.sort((a,b)=>((Number(b.probability)||0)*(Number(b.impact)||0))-((Number(a.probability)||0)*(Number(a.impact)||0))).map(r=>{
      const score = (Number(r.probability)||0)*(Number(r.impact)||0);
      const level = score>=15?'N.Cao':score>=8?'Cao':score>=4?'T.Bình':'Thấp';
      const color = score>=15?'bad':score>=8?'warn':score>=4?'warn':'good';
      return `<div style="padding:10px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between"><div><b>${esc(r.title||'')}</b><br><small style="color:var(--mut)">P=${esc(r.probability)} · I=${esc(r.impact)} · ${esc(r.owner||'—')}</small></div><span class="badge ${color}">${level} (${score})</span></div>`;
    }).join(''):'<div class="empty">Chưa có rủi ro</div>'}
  </div>`;
  $('#view').innerHTML = h;
}

function saveSyncConfig(){
  const url = $('#sync-url').value.trim(), before = apiUrl();
  if(url && !/^https:\/\//i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)/i.test(url)){ toast('URL phải bắt đầu bằng https://'); return; }
  if(url) localStorage.setItem('nd2_sync', JSON.stringify({url})); else localStorage.removeItem('nd2_sync');
  if(apiUrl() !== before){
    clearSession();
    Object.keys(localStorage).filter(k=>k.startsWith('nd2_55_cursor_')).forEach(k=>localStorage.removeItem(k));
    audit('update','sync_center','','Đổi địa chỉ máy chủ');
    toast('Đã lưu. Hãy đăng xuất rồi đăng nhập lại để kết nối máy chủ.', 5000);
  } else toast('Đã lưu');
  renderSyncCenter(); paintSyncBadge();
}
// Nhãn dễ đọc của một bản ghi (dùng ở màn hình xung đột / từ chối)
function recLabel(key, r){
  if(!r) return '';
  const f = (SCHEMA[key]?.f||[])[0];
  return String((f && r[f.k]) || r.title || r.name || r.empCode || r.weekStart || r.month || r.id || '').slice(0,80);
}

  INVALID_NAME:'Thiếu họ tên', INVALID_ROLE:'Vai trò không hợp lệ', INVALID_HASH:'Tài khoản mới trên máy chủ cần mật khẩu', USERNAME_IMMUTABLE:'Không đổi được tên đăng nhập',
  CANNOT_DEMOTE_SELF:'Không tự hạ quyền hoặc tự khóa chính mình', LAST_ADMIN:'Phải còn ít nhất một Quản trị đang hoạt động'
};

function openUserForm(id){
  if(!isAdmin()) return;
  const u = id?DB.data.users.find(x=>x.id===id):{username:'',name:'',role:'tech',status:'active'};
  if(!u) return;
  $('#dlg-title').textContent = (id?'Sửa':'Thêm')+' người dùng';
  $('#dlg-body').innerHTML = `<div class="form-group"><label>Username *</label><input type="text" id="u-username" value="${esc(u.username)}" ${id?'readonly':''} autocapitalize="none" spellcheck="false"></div>

    <div class="form-group"><label>Vai trò</label><select id="u-role">${Object.keys(ROLES).map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLES[r].n}</option>`).join('')}</select></div>
    <div class="form-group"><label>${id?`Mật khẩu mới (bỏ trống = không đổi)`:`Mật khẩu * (≥ ${MIN_PW} ký tự)`}</label><input type="password" id="u-pass" autocomplete="new-password"></div>
    ${id?'<div class="full hint">Đặt lại mật khẩu hoặc đổi vai trò sẽ đăng xuất người này khỏi mọi thiết bị.</div>':''}`;
  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" id="u-save" onclick="saveUser('${id||''}')">💾 Lưu</button>`;
  $('#dlg').showModal();

async function upsertUserOnServer(user, pass){
  if(!sessionToken()){ toast('Cần kết nối máy chủ để quản lý tài khoản'); return false; }
  try{
    const out = await api('admin_upsertUser', Object.assign({user}, pass ? {hash: await sha256(pass)} : {}));
    if(out.error){ toast(USER_ERR[out.error] || out.detail || out.error, 4500); return false; }
    mergeUsers([out.user]);
    return true;
  }catch(e){ toast('Lỗi: ' + e.message); return false; }
}
async function saveUser(id){
  if(!isAdmin()) return;
  const username = $('#u-username').value.trim(), name = $('#u-name').value.trim(), role = $('#u-role').value, pass = $('#u-pass').value;
  if(!username||!name){ toast('Nhập đủ username và họ tên'); return; }
  if(!/^[A-Za-z0-9][A-Za-z0-9_.\-]{1,39}$/.test(username)){ toast(USER_ERR.INVALID_USERNAME); return; }
  if(!ROLES[role]){ toast(USER_ERR.INVALID_ROLE); return; }
  if((!id || pass) && pass.length < MIN_PW){ toast(`Mật khẩu phải ≥ ${MIN_PW} ký tự`); return; }
  const u = id ? DB.data.users.find(x=>x.id===id) : null;
  if(!id && DB.data.users.find(x=>x.username===username)){ toast('Username đã tồn tại'); return; }
  if(u && u.id===CURRENT.id && role!=='admin'){ toast(USER_ERR.CANNOT_DEMOTE_SELF); return; }
  const btn = $('#u-save'); btn.disabled = true;
  try{
    if(isCloud()){
      const ok = await upsertUserOnServer({id: u ? u.id : undefined, username, name, role, status: u ? u.status : 'active'}, pass);
      if(!ok) return;
    } else if(!u){
      DB.data.users.push({id:uid(), username, name, role, passwordHash:await sha256(pass), status:'active', createdAt:Date.now()});
    } else {
      u.name = name; u.role = role;
      if(pass) u.passwordHash = await sha256(pass);
    }
    audit(id?'update':'create','users',id||'',username);
    saveDB(true); closeDlg(); renderUsers(); toast('Đã lưu');
  }finally{ btn.disabled = false; }
}
async function toggleUser(id){
  if(!isAdmin()) return;
  const u = DB.data.users.find(x=>x.id===id); if(!u || u.id===CURRENT.id) return;
  const next = u.status==='active'?'inactive':'active';
  if(next==='inactive' && !confirm(`Khóa tài khoản "${u.username}"? Người này sẽ bị đăng xuất.`)) return;
  if(isCloud() && u.onServer){
    if(!await upsertUserOnServer({id:u.id, username:u.username, name:u.name, role:u.role, status:next})) return;
  } else u.status = next;
  audit('update','users',id,next); saveDB(true); renderUsers(); toast('Đã cập nhật');
}
function removeLocalUser(id){
  if(!isAdmin()) return;
  const u = DB.data.users.find(x=>x.id===id); if(!u || u.onServer || u.id===CURRENT.id) return;
  if(!confirm(`Xóa tài khoản "${u.username}" khỏi máy này? (Tài khoản này không có trên máy chủ.)`)) return;
  DB.data.users = DB.data.users.filter(x=>x.id!==id);
  audit('delete','users',id,u.username); saveDB(true); renderUsers(); toast('Đã xóa khỏi máy này');
}

function renderConflicts(){
  const list = DB.data._conflicts || [];
  let h = `<div class="page-head"><div><h1>⚠️ Xung đột đồng bộ</h1><div class="subtitle">${list.length} bản ghi được sửa ở cả máy này và máy chủ</div></div></div>`;
  if(!list.length){ h += '<div class="card"><div class="empty">Không có xung đột. Dữ liệu đang đồng bộ tốt.</div></div>'; }
  list.forEach((c,i)=>{
    const local = (DB.data[c.key]||[]).find(x=>x.id===c.id) || {};
    const a = contentOf(c.key, local), b = contentOf(c.key, c.server||{});
    const label = k=>((SCHEMA[c.key]?.f||[]).find(f=>f.k===k)||{}).l || ({_deleted:'Đã xóa',state:'Trạng thái',cells:'Phân công',notes:'Ghi chú',value:'Cấu hình'})[k] || k;
    const show = v=>{ if(v===undefined) return '<span style="color:#94a3b8">—</span>'; const s = typeof v==='object'?JSON.stringify(v):String(v); return esc(s.length>300?s.slice(0,300)+'…':s); };
    const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k=>k!=='id' && JSON.stringify(sortDeep(a[k]))!==JSON.stringify(sortDeep(b[k])));
    h += `<div class="card" style="border-left:4px solid var(--bad)"><h3>${esc(SCHEMA[c.key]?.n||c.key)} · ${esc(recLabel(c.key, local)||recLabel(c.key, c.server))}</h3>
      <div class="hint" style="margin:0 0 10px">Bản máy chủ: phiên bản ${esc(c.server?.version||'?')}, sửa bởi <b>${esc(c.server?.updatedBy||'?')}</b> lúc ${esc(fmtDateTime(c.server?.updatedAt))}</div>
      <div class="table-wrap"><table class="diff-table"><thead><tr><th style="width:22%">Trường khác nhau</th><th>Trên máy này</th><th>Trên máy chủ</th></tr></thead><tbody>
        ${keys.map(k=>`<tr><td><b>${esc(label(k))}</b></td><td class="chg">${show(a[k])}</td><td class="chg">${show(b[k])}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nội dung giống nhau</td></tr>'}
      </tbody></table></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn-soft" onclick="resolveConflict(${i},'server')">⬇ Lấy bản máy chủ</button>
        <button class="btn-soft" onclick="resolveConflict(${i},'local')">⬆ Giữ bản trên máy này (ghi đè máy chủ)</button>
      </div></div>`;
  });
  $('#view').innerHTML = h;
}

let AUDIT_SRC = 'local', AUDIT_SERVER = null;
function renderAuditLog(){
  if(!adminOnly()) return;
  const cloudOk = isCloud() && sessionToken();
  const tabs = `<div class="cal-modes" style="margin-bottom:12px;display:inline-flex"><button class="${AUDIT_SRC==='local'?'on':''}" onclick="AUDIT_SRC='local';renderAuditLog()">💻 Trên máy này</button><button class="${AUDIT_SRC==='server'?'on':''}" onclick="AUDIT_SRC='server';loadServerAudit()">☁️ Máy chủ</button></div>`;
  if(AUDIT_SRC === 'server'){
    const A = AUDIT_SERVER;
    $('#view').innerHTML = `<div class="page-head"><div><h1>📜 Audit Log</h1><div class="subtitle">Nhật ký máy chủ · chuỗi băm HMAC · ${A?esc(A.total)+' dòng':'…'}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-soft" onclick="loadServerAudit()">↻ Tải lại</button><button class="btn-soft" onclick="verifyServerAudit()">🔒 Kiểm tra chuỗi băm</button></div></div>${tabs}
      <div id="audit-verify"></div>
      ${!cloudOk?'<div class="card"><div class="empty">Cần kết nối máy chủ bằng phiên Quản trị</div></div>':!A?'<div class="card"><div class="empty">Đang tải…</div></div>':`<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>User</th><th>Vai trò</th><th>Hành động</th><th>Module</th><th>Bản ghi</th><th>Chi tiết</th></tr></thead><tbody>
      ${A.rows.map(r=>`<tr><td style="font-size:11px;white-space:nowrap">${esc(fmtDateTime(Number(r[1])))}</td><td><b>${esc(r[3])}</b></td><td>${esc(r[4])}</td><td><span class="badge ${/fail|blocked|error/.test(r[5])?'bad':/create|push|login$/.test(r[5])?'good':'info'}">${esc(r[5])}</span></td><td>${esc(r[6])}</td><td style="font-size:11px">${esc(r[7])}</td><td style="font-size:12px;color:var(--mut);max-width:320px;word-break:break-word">${esc(r[8])}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có dòng nào</td></tr>'}
      </tbody></table></div><p class="hint">Hiển thị ${A.rows.length} dòng mới nhất. Toàn bộ nằm ở sheet <code>audit_log</code>.</p>`}`;
    return;
  }
  const logs = DB.auditLog || [];
  const users = [...new Set(logs.map(l=>l.user))];
  let filtered = logs;

async function loadServerAudit(){
  AUDIT_SERVER = null; renderAuditLog();
  if(!(isCloud() && sessionToken())) return;
  try{
    const out = await api('audit_query', {limit:200});
    if(out.error) throw new Error(out.error);
    AUDIT_SERVER = {rows: out.rows||[], total: out.total||0};
  }catch(e){ toast('Không tải được audit máy chủ: ' + e.message); AUDIT_SERVER = {rows:[], total:0}; }
  if(CUR_ROUTE==='audit_log' && AUDIT_SRC==='server') renderAuditLog();
}
async function verifyServerAudit(){
  const box = $('#audit-verify'); if(!box) return;

    box.innerHTML = out.ok ? `<div class="banner info">✅ Chuỗi băm hợp lệ trên ${esc(out.rows)} dòng — không phát hiện sửa/xóa.</div>`

function exportAudit(){

function renderNotifications(){
  const now = new Date();
  let alerts = [];
  (DB.data.licenses||[]).forEach(l=>{
    if(!l.expiryDate||l._deleted) return;
    const d = new Date(l.expiryDate); const days = Math.round((d-now)/86400000);
    if(days<=90 && days>=-30) alerts.push({type:days<0?'bad':'warn', mod:'Giấy phép', msg:`${l.empCode} - ${l.licenseType} ${days<0?'quá '+(-days)+' ngày':'còn '+days+' ngày'}`, route:'licenses'});
  });
  (DB.data.calibration||[]).forEach(c=>{
    if(!c.validUntil||c._deleted) return;
    const d = new Date(c.validUntil); const days = Math.round((d-now)/86400000);
    if(days<=60 && days>=-30) alerts.push({type:days<0?'bad':'warn', mod:'Kiểm định', msg:`${c.assetCode} hết hiệu lực ${days<0?'quá '+(-days):'còn '+days} ngày`, route:'calibration'});
  });
  (DB.data.personal_dosimeters||[]).forEach(p=>{
    if(!p._deleted && p.dose && p.limit && Number(p.dose) > Number(p.limit)) alerts.push({type:'bad', mod:'Liều kế', msg:`${p.empCode} vượt ngưỡng`, route:'personal_dosimeters'});
  });
  (DB.data.supplies||[]).forEach(s=>{
    if(!s._deleted && (s.status==='Sắp hết'||s.status==='Hết')) alerts.push({type:'warn', mod:'Vật tư', msg:`${s.name} - ${s.status}`, route:'supplies'});
  });
  (DB.data.task_tracking||[]).forEach(t=>{
    if(!t._deleted && t.deadline && t.deadline<localDate() && !['done','verified','cancelled'].includes(t.state))
      alerts.push({type:'warn', mod:'Task', msg:`${t.title} - quá hạn`, route:'task_tracking'});
  });
  (DB.data.leave_requests||[]).forEach(l=>{
    if(!l._deleted && l.state==='submitted') alerts.push({type:'info', mod:'Nghỉ phép', msg:`${l.empCode} - chờ duyệt`, route:'leave_requests'});

  alerts = alerts.filter(a=>canOpen(a.route));        // chỉ hiện cảnh báo của module người dùng được xem

}

let AI_HISTORY = [];
function renderAI(){
  const ready = isCloud() && sessionToken();
  $('#view').innerHTML = `<div class="page-head"><div><h1>🤖 Trợ lý AI (DeepSeek)</h1><div class="subtitle">${ready?'Gọi qua máy chủ của khoa — khóa API không nằm trên trình duyệt':'Cần kết nối máy chủ để dùng trợ lý'}</div></div><button class="btn-soft btn-sm" onclick="AI_HISTORY=[];renderAI()">🗑 Xóa hội thoại</button></div>
    <div class="warn-box"><b>⚠️ PII Gate đang bật:</b> Nội dung có họ tên, ngày sinh, ngày tháng đầy đủ, số định danh/điện thoại, mã hồ sơ, địa chỉ, email hoặc thẻ DICOM sẽ bị chặn <b>trước khi gửi</b> (kiểm tra ở cả trình duyệt và máy chủ). Không dán báo cáo hay hồ sơ bệnh nhân vào đây. AI chỉ hỗ trợ tra cứu — không thay thế chẩn đoán của bác sĩ.</div>
    <div class="card" id="ai-log" style="min-height:240px;max-height:55vh;overflow:auto" aria-live="polite"></div>
    <div class="card"><textarea id="ai-in" rows="3" maxlength="4000" placeholder="Nhập câu hỏi (đã ẩn danh)… Ctrl+Enter để gửi" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))aiSend()"></textarea>
      <div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn" id="ai-send" onclick="aiSend()">Gửi</button></div>
    </div>`;
  paintAI();
}
function paintAI(){
  const log = $('#ai-log'); if(!log) return;
  log.innerHTML = AI_HISTORY.length ? AI_HISTORY.map(m=>`<div style="margin-bottom:12px"><b style="font-size:12px;color:${m.role==='user'?'var(--acc)':'var(--good)'}">${m.role==='user'?'Bạn':'AI'}</b><div style="white-space:pre-wrap;word-break:break-word">${esc(m.content)}</div></div>`).join('') : '<div class="empty">Đặt câu hỏi để bắt đầu</div>';
  log.scrollTop = log.scrollHeight;
}
async function aiSend(){
  const input = $('#ai-in'); const text = input.value.trim(); if(!text) return;
  // PII GATE — fail closed, chạy TRƯỚC mọi lời gọi mạng. Tin nhắn bị chặn không bao giờ được gửi kèm ở các lượt sau.
  const scan = piiScan(text);
  if(!scan.ok){
    AI_HISTORY.push({role:'user', content:text, blocked:true});
    AI_HISTORY.push({role:'assistant', content:`⛔ Đã chặn: phát hiện ${scan.reason}. Vui lòng ẩn danh trước khi gửi.`, local:true});
    input.value = ''; paintAI(); return;
  }
  if(!isCloud() || !sessionToken()){ toast('Trợ lý AI cần kết nối máy chủ (đăng nhập qua máy chủ)'); return; }
  const mine = {role:'user', content:text};
  AI_HISTORY.push(mine); input.value = ''; paintAI();
  const btn = $('#ai-send'); if(btn){ btn.disabled = true; btn.textContent = 'Đang trả lời…'; }
  try{
    const messages = AI_HISTORY.filter(m=>!m.blocked && !m.local).slice(-10).map(m=>({role:m.role, content:m.content}));
    const out = await api('chat', {messages});
    if(out.error){
      if(out.code==='BLOCKED_PII' || out.error==='BLOCKED_PII'){ mine.blocked = true; AI_HISTORY.push({role:'assistant', content:'⛔ Đã chặn (máy chủ): ' + (out.detail||'phát hiện thông tin định danh'), local:true}); }
      else { mine.blocked = true; AI_HISTORY.push({role:'assistant', content:'Lỗi: ' + (out.error==='forbidden'?'Vai trò của bạn không được dùng trợ lý AI':out.error), local:true}); }
    } else AI_HISTORY.push({role:'assistant', content:out.reply||'(không có nội dung)'});
  }catch(e){
    mine.blocked = true;
    AI_HISTORY.push({role:'assistant', content:'Lỗi: '+e.message, local:true});
  }finally{
    const b = $('#ai-send'); if(b){ b.disabled = false; b.textContent = 'Gửi'; }
    paintAI();
  }
}

function downloadTemplate(key){
  const mod = SCHEMA[key], cols = mod.f||[];
  downloadCSV([cols.map(c=>c.l), cols.map(c=>c.t==='date'?'2026-01-31':c.t==='num'?'0':c.t==='bool'?'x':c.t==='select'?(c.o||[''])[0]:`[${c.l}]`)], `template_${key}.csv`);
  toast('Đã tải template');
}
function parseCSVText(text){
  const lines = []; let row = [''], inQ = false;
  text = String(text||'').replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(c==='"'){ if(inQ && n==='"'){ row[row.length-1]+='"'; i++; } else inQ = !inQ; }
    else if(c===','&&!inQ) row.push('');
    else if((c==='\n'||c==='\r')&&!inQ){ if(c==='\r'&&n==='\n') i++; if(row.length>1||row[0]!=='') lines.push(row); row = ['']; }
    else row[row.length-1] += c;
  }
  if(row.length>1||row[0]!=='') lines.push(row);
  return lines;
}
function normDate(v){
  const s = String(v||'').trim(); let m;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if((m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
// Chuyển ô CSV về đúng kiểu của trường; trả {v, err}
function coerceCell(col, raw){
  const v = String(raw??'').trim().replace(/^'(?=[=+\-@])/,'');
  if(col.t==='num'){
    if(v==='') return {v:''};
    const n = Number(v.replace(/\s/g,''));
    return isNaN(n) ? {v:'', err:'Không phải số: '+col.l} : {v:n};
  }
  if(col.t==='bool') return {v:/^(1|true|x|có|co|yes|y|✔)$/i.test(v)};
  if(col.t==='date'){
    const d = normDate(v);
    return d && !/^\d{4}-\d{2}-\d{2}$/.test(d) ? {v:'', err:'Sai ngày (dùng YYYY-MM-DD hoặc DD/MM/YYYY): '+col.l} : {v:d};
  }
  return {v};
}
function handleImportFile(e, key){
  const file = e.target.files[0]; if(!file) return;
  if(!can(key,'c')){ toast('Không có quyền import'); return; }
  const reader = new FileReader();
  reader.onload = evt => {
    const rows = parseCSVText(evt.target.result);
    if(rows.length < 2){ toast('File rỗng'); return; }
    if(rows.length > 5001){ toast('File quá lớn (tối đa 5.000 dòng mỗi lần)'); return; }
    const headers = rows[0].map(h=>String(h).trim()), mod = SCHEMA[key], cols = mod.f||[];
    const map = headers.map(h=>cols.find(c=>c.l===h||c.k===h)||null);
    if(!map.some(Boolean)){ toast('Không cột nào khớp tên trường — hãy dùng file Template'); return; }
    const uk = UNIQUE_KEY[key], canU = can(key,'u'), seen = new Set();
    const parsed = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map((row,idx)=>{
      const obj = {_row:idx+2, _status:'new', _errors:[]};
      map.forEach((col,i)=>{ if(!col) return; const r = coerceCell(col, row[i]); obj[col.k] = r.v; if(r.err) obj._errors.push(r.err); });
      cols.filter(c=>c.r).forEach(c=>{ if(obj[c.k]===''||obj[c.k]==null) obj._errors.push('Thiếu '+c.l); });
      if(uk && obj[uk]!=='' && obj[uk]!=null){
        const k = String(obj[uk]);
        if(seen.has(k)) obj._errors.push('Trùng mã trong file'); else seen.add(k);
        const existing = (DB.data[key]||[]).find(x=>!x._deleted && String(x[uk])===k);
        if(existing){ if(canU){ obj._status = 'update'; obj.id = existing.id; } else obj._errors.push('Đã tồn tại (không có quyền sửa)'); }
      }
      if(obj._errors.length) obj._status = 'error';
      return obj;
    });
    showImportPreview(key, parsed);
  };
  reader.readAsText(file, 'UTF-8'); e.target.value = '';
}
function showImportPreview(key, data){
  const mod = SCHEMA[key];
  const newC = data.filter(r=>r._status==='new').length, updC = data.filter(r=>r._status==='update').length, errC = data.filter(r=>r._status==='error').length;
  const cols = mod.f||[];
  $('#dlg-title').textContent = 'Preview Import: ' + mod.n;
  $('#dlg-body').innerHTML = `<div style="display:flex;gap:16px;margin-bottom:20px;grid-column:1/-1;flex-wrap:wrap">
    <div style="flex:1;padding:12px;background:var(--pnl2);border-radius:8px;text-align:center"><b style="font-size:20px">${data.length}</b><br><small>Tổng</small></div>
    <div style="flex:1;padding:12px;background:var(--goodbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--good)">${newC}</b><br><small>Thêm</small></div>
    <div style="flex:1;padding:12px;background:var(--warnbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--warn)">${updC}</b><br><small>Sửa</small></div>
    <div style="flex:1;padding:12px;background:var(--badbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--bad)">${errC}</b><br><small>Lỗi (bỏ qua)</small></div>
  </div>
  <div style="grid-column:1/-1;max-height:300px;overflow:auto;border:1px solid var(--ln);border-radius:8px">
    <table><thead><tr><th>Dòng</th><th>Trạng thái</th><th>Lỗi</th>${cols.slice(0,4).map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead>
    <tbody>${data.slice(0,50).map(r=>`<tr style="background:${r._status==='new'?'#f0fdf4':r._status==='update'?'#fefce8':'#fef2f2'}">
      <td>${r._row}</td>
      <td><b style="font-size:11px;color:${r._status==='new'?'var(--good)':r._status==='update'?'var(--warn)':'var(--bad)'}">${r._status==='new'?'THÊM':r._status==='update'?'SỬA':'LỖI'}</b></td>
      <td style="font-size:11px;color:var(--bad)">${esc(r._errors.join('; '))}</td>
      ${cols.slice(0,4).map(c=>`<td>${esc(r[c.k]??'')}</td>`).join('')}
    </tr>`).join('')}</tbody></table>
  </div>${data.length>50?`<div class="hint" style="grid-column:1/-1">Xem trước 50/${data.length} dòng.</div>`:''}`;
  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" onclick="commitImport('${key}')" ${newC+updC===0?'disabled':''}>✅ Ghi ${newC+updC} bản ghi</button>`;
  window._importData = data;
}
function commitImport(key){
  const data = window._importData||[];
  if(!can(key,'c')){ toast('Không có quyền import'); return; }
  let add = 0, upd = 0;
  data.forEach(r=>{
    if(r._status==='error') return;
    const {_row,_status,_errors,...clean} = r;
    if(_status==='update'&&clean.id){
      const i = DB.data[key].findIndex(x=>x.id===clean.id);
      if(i>=0){ DB.data[key][i] = {...DB.data[key][i], ...clean, updatedAt:Date.now()}; upd++; }
    } else {
      delete clean.id;
      DB.data[key].push({id:uid(), ...clean, createdAt:Date.now(), updatedAt:Date.now(), createdBy:CURRENT.username}); add++;
    }
  });
  window._importData = null;
  saveDB(); audit('import',key,'',`Thêm ${add}, Sửa ${upd}`);
  closeDlg(); toast(`Import: ${add} thêm, ${upd} sửa`);
  if(CUR_ROUTE===key) renderGeneric(key); else route(CUR_ROUTE);
  renderNav();
}

const OPEN_TO_ALL = new Set(['conflicts']);     // ai cũng xử lý được xung đột của chính mình
function canOpen(k){
  if(!SCHEMA[k] || !CURRENT) return false;
  if(isAdmin() || OPEN_TO_ALL.has(k)) return true;
  return can(k,'r');
}
function firstRoute(){ return Object.keys(SCHEMA).find(canOpen) || 'dash_executive'; }
let NAV_Q = '';
function renderNav(){
  const nav = $('#nav');
  if(!$('#nav-list')){
    // Ô tìm nằm ngoài vùng vẽ lại → không mất con trỏ khi danh mục cập nhật
    nav.innerHTML = `<div class="nav-search"><input type="search" id="nav-q" placeholder="🔍 Tìm chức năng…" aria-label="Tìm chức năng" autocomplete="off"></div><div id="nav-list"></div>`;
    $('#nav-q').oninput = e=>{ NAV_Q = e.target.value; renderNav(); };
  }
  const q = rsNorm(NAV_Q), conf = (DB.data._conflicts||[]).length;
  const groups = {};
  Object.keys(SCHEMA).forEach(k=>{ const g = SCHEMA[k].g; (groups[g] = groups[g]||[]).push(k); });
  let html = '';
  Object.keys(groups).sort().forEach(g=>{
    const items = groups[g].filter(k=>{
      if(!canOpen(k)) return false;
      if(k==='conflicts' && !isAdmin() && !conf) return false;
      return !q || rsNorm(SCHEMA[k].n).includes(q);
    });
    if(!items.length) return;
    const isClosed = !q && localStorage.getItem('nav_closed_'+g) === '1';
    html += `<div class="group-title ${isClosed?'closed':''}" onclick="toggleNavGroup('${g}')"><span>${esc(GROUP_NAMES[g]||g)}</span><span class="toggle-icon">▼</span></div>`;
    html += `<div class="group-items ${isClosed?'hidden':''}" id="nav-group-${g}">`;
    items.forEach(k=>{
      const m = SCHEMA[k];
      const count = k==='conflicts' ? conf : m.f ? live(k).length : '';
      html += `<button class="nav-item ${CUR_ROUTE===k?'on':''}" data-route="${k}" onclick="route('${k}')"><span class="nav-icon">${m.icon||'•'}</span><span>${esc(m.n)}</span>${count?`<span class="nav-count" ${k==='conflicts'?'style="color:var(--bad)"':''}>${count}</span>`:''}</button>`;
    });
    html += '</div>';
  });
  $('#nav-list').innerHTML = html || '<div class="nav-empty">Không tìm thấy chức năng phù hợp</div>';
}
function toggleNavGroup(g){
  const el = document.getElementById('nav-group-'+g);
  const title = el.previousElementSibling;
  el.classList.toggle('hidden');
  title.classList.toggle('closed');
  localStorage.setItem('nav_closed_'+g, el.classList.contains('hidden')?'1':'0');
}
function toggleNav(force){
  const open = document.body.classList.toggle('nav-open', force);
  const b = $('#menu-btn'); if(b) b.setAttribute('aria-expanded', open?'true':'false');
}
const VIEWS = {
  dashboard:k=>renderDashboard(k), calendar:()=>renderCalendar(), meetings:()=>renderCalendar(),
  roster:k=>rsRenderWeek(SCHEMA[k].rs), duty:()=>rsRenderDuty(), cases:()=>renderCases(), template:()=>renderTemplateLibrary(),
  equipment_360:()=>renderEquipment360(), risk_matrix:()=>renderRiskMatrix(), sync_center:()=>renderSyncCenter(),
  users:()=>renderUsers(), roles:()=>renderRoles(), audit_log:()=>renderAuditLog(), backup_restore:()=>renderBackup(),
  api_connectors:()=>renderApiConnectors(), reports_center:()=>renderReportsCenter(), data_dictionary:()=>renderDataDictionary(),
  notifications:()=>renderNotifications(), settings:()=>renderSettings(), data_center:()=>renderDataCenter(),
  field_builder:()=>renderFieldBuilder(), master_data:()=>renderMasterData(), conflicts:()=>renderConflicts(),
  version_history:()=>renderVersionHistory(), monthly_report:()=>renderMonthlyReportView(), ai:()=>renderAI(),
  leave_workflow:()=>renderLeaveWorkflow(), task_workflow:()=>renderTaskWorkflow()
};
function route(k){
  const m = SCHEMA[k];
  if(!m || !CURRENT) return;
  if(!canOpen(k)){ toast('Bạn không có quyền truy cập mục này'); return; }
  CUR_ROUTE = k;
  toggleNav(false);
  $$('.nav-item').forEach(b=>b.classList.toggle('on', b.dataset.route===k));
  try{ (VIEWS[m.view] || (()=>renderGeneric(k)))(k); }
  catch(e){
    console.error(e);
    $('#view').innerHTML = `<div class="card"><div class="empty">Không hiển thị được màn hình này (${esc(e.message)}). Dữ liệu của bạn không bị ảnh hưởng — hãy Backup và báo Quản trị.</div></div>`;
  }
  window.scrollTo(0,0);
}

/* ---------- 21. DIALOG ---------- */
function closeDlg(){ const d = $('#dlg'); if(d.open) d.close(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleNav(false); });

/* ---------- 22. BOOT ---------- */
(async function boot(){
  await initDB();
  paintLoginMeta();
  const s = sessionStorage.getItem('nd2_55_user');
  if(s){
    try{
      const u = JSON.parse(s);
      if(u && ROLES[u.role] && u.username){ CURRENT = u; await enterApp(); return; }
    }catch(e){ console.error(e); }
    sessionStorage.removeItem('nd2_55_user'); CURRENT = null;
    $('#app').style.display = 'none'; $('#login').style.display = 'flex';
  }
  const lu = $('#login-u'); if(lu) lu.focus();
})();
</script>
