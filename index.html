<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ND2 Radiology OS V5.5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--pnl:#fff;--pnl2:#f8fafc;--ink:#0f172a;--mut:#64748b;--ln:#e2e8f0;--acc:#2563eb;--acc2:#1e40af;--soft:#f1f5f9;--good:#16a34a;--goodbg:#dcfce7;--warn:#d97706;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--sh:0 1px 3px rgba(15,23,42,.06);--shlg:0 20px 40px rgba(15,23,42,.15)}
html,body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--ln);border-radius:7px;background:var(--pnl);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--acc2)}
.btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--ln);border-radius:7px;padding:7px 12px;font-weight:600}
.btn-soft:hover{background:#e2e8f0}
.btn-danger{background:var(--bad);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-weight:600}
.btn-sm{padding:5px 9px;font-size:12px}
.icon-btn{background:transparent;border:0;padding:4px 6px;font-size:15px;border-radius:5px}
.icon-btn:hover{background:var(--soft)}
#login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1220,#1e3a8a)}
.login-card{background:#fff;padding:36px 32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h1{font-size:20px;margin-bottom:6px;color:#1e40af}
.login-card p{color:#64748b;font-size:13px;margin-bottom:24px}
.login-card input{margin-bottom:14px;padding:11px 14px;font-size:15px}
.login-card button{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:15px}
.login-card button:hover{background:#1e40af}
.login-err{color:#dc2626;font-size:12px;margin-top:10px;min-height:18px}
#app{display:none;min-height:100vh}
header.top{background:linear-gradient(135deg,#0b1220,#1e3a8a 70%,#2563eb);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.top h1{font-size:16px;font-weight:800}
header.top .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top .user-badge{font-size:12px;padding:5px 12px;background:rgba(255,255,255,.15);border-radius:20px}
header.top .role-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;margin-left:6px}
.role-admin{background:#fbbf24;color:#78350f}.role-doctor{background:#34d399;color:#064e3b}.role-tech{background:#60a5fa;color:#1e3a8a}.role-viewer{background:#94a3b8;color:#1e293b}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
nav{background:#fff;border-right:1px solid var(--ln);padding:14px 8px;height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:0}
nav .group-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:750;padding:12px 10px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
nav .group-items.hidden{display:none}
nav .group-title .toggle-icon{font-size:10px;transition:transform .2s}
nav .group-title.closed .toggle-icon{transform:rotate(-90deg)}
nav .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink);font-size:13px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;margin-bottom:1px}
nav .nav-item:hover{background:var(--soft)}
nav .nav-item.on{background:#eff6ff;color:var(--acc);font-weight:700}
nav .nav-icon{width:22px;text-align:center;font-size:14px}
nav .nav-count{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
main{padding:20px;min-width:0;overflow-x:hidden}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{height:auto;position:relative}}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:800}
.page-head .subtitle{color:var(--mut);font-size:12px;margin-top:2px}
.filter-bar{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar select,.filter-bar input{width:auto;min-width:130px;font-size:13px;padding:6px 9px}
.filter-bar .search{flex:1;min-width:200px}
.table-wrap{background:#fff;border-radius:10px;border:1px solid var(--ln);overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{background:var(--pnl2);font-size:10.5px;text-transform:uppercase;color:var(--mut);font-weight:750;white-space:nowrap;position:sticky;top:0;z-index:1}
tr:hover td{background:var(--pnl2)}
tr:last-child td{border-bottom:0}
.empty{padding:40px;text-align:center;color:var(--mut)}
.empty::before{content:"📭";display:block;font-size:32px;margin-bottom:8px;opacity:.4}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}
.badge.good{background:var(--goodbg);color:var(--good)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:#eff6ff;color:var(--acc)}
.badge.mut{background:var(--soft);color:var(--mut)}
dialog{border:0;border-radius:14px;padding:0;background:var(--pnl);color:var(--ink);width:min(900px,96vw);max-height:92vh;box-shadow:var(--shlg);display:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(5,10,20,.55);backdrop-filter:blur(4px)}
.dialog-head{padding:14px 20px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.dialog-head h3{font-size:16px}
.dialog-body{padding:20px;max-height:70vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-body .full{grid-column:1/-1}
.dialog-foot{padding:12px 20px;background:var(--pnl2);border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 14px 14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.3px}
.form-group.full{grid-column:1/-1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--ln);box-shadow:var(--sh)}
.tile small{font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.tile strong{display:block;font-size:26px;font-weight:800;margin-top:4px;color:var(--acc)}
.tile .sub{font-size:11px;color:var(--mut);margin-top:2px}
.card{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--ln);box-shadow:var(--sh);margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:750;margin-bottom:12px}
.cal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.cal-modes{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:8px}
.cal-modes button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:650;color:var(--mut)}
.cal-modes button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;padding:8px 0;font-size:11px;text-transform:uppercase;font-weight:750;color:var(--mut);background:var(--pnl2);border-radius:5px}
.cal-cell{min-height:100px;padding:6px;background:#fff;border:1px solid var(--ln);border-radius:7px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:hover{border-color:var(--acc);box-shadow:var(--sh)}
.cal-cell.empty{background:var(--pnl2);cursor:default;opacity:.4}
.cal-cell.today{border:2px solid var(--acc);background:#eff6ff}
.cal-day{font-weight:800;font-size:13px;margin-bottom:3px}
.cal-cell.today .cal-day{color:var(--acc)}
.cal-ev{display:block;font-size:10.5px;padding:2px 5px;margin-bottom:2px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid}
.sync-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:650;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer}
.sync-badge.ok{background:rgba(52,211,153,.25);border-color:#34d399}
.sync-badge.err{background:rgba(248,113,113,.25);border-color:#f87171}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--ink);color:#fff;border-radius:10px;box-shadow:var(--shlg);z-index:9999;font-weight:650;font-size:13px}
.state-chip{display:inline-block;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.state-chip.draft{background:#e2e8f0;color:#475569}
.state-chip.submitted,.state-chip.open{background:#dbeafe;color:#1e40af}
.state-chip.approved,.state-chip.verified,.state-chip.taken{background:#dcfce7;color:#15803d}
.state-chip.rejected,.state-chip.cancelled{background:#fee2e2;color:#991b1b}
.state-chip.in_progress,.state-chip.blocked{background:#fef3c7;color:#92400e}
.state-chip.assigned{background:#ede9fe;color:#5b21b6}
.state-chip.done{background:#d1fae5;color:#065f46}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.warn-box{background:var(--warnbg);border:1px solid #fcd34d;padding:12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.risk-legend span{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px}
.risk-legend span i{width:14px;height:14px;border-radius:3px;display:inline-block}
@media(max-width:600px){.dialog-body{grid-template-columns:1fr}.page-head h1{font-size:17px}header.top{padding:10px 14px}main{padding:12px}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>ND2 Radiology OS V5.5</h1>
    <p>Hệ điều hành Khoa CĐHA Nhi · BV Nhi Đồng 2</p>
    <input type="text" id="login-u" placeholder="Tên đăng nhập" autocomplete="username">
    <input type="password" id="login-p" placeholder="Mật khẩu" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="login-err"></div>
    <div class="hint" style="margin-top:12px;font-size:11px;text-align:center">
      Mặc định: <b>admin / 123456</b> · <b>bacsi / 123456</b> · <b>ktv / 123456</b><br>
      <span style="opacity:.7">V5.5 · PII-safe · Local-first</span>
    </div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>🩻 ND2 RADIOLOGY OS V5.5</h1>
    <div class="actions">
      <span class="user-badge" id="user-info"></span>
      <span class="sync-badge" id="sync-badge" onclick="route('sync_center')">☁️ Sync</span>
      <button class="btn-soft btn-sm" onclick="backup()">💾 Backup</button>
      <button class="btn-soft btn-sm" onclick="logout()">Đăng xuất</button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form" onsubmit="event.preventDefault()">
    <div class="dialog-head"><h3 id="dlg-title"></h3><button type="button" class="icon-btn" onclick="closeDlg()">✕</button></div>
    <div class="dialog-body" id="dlg-body"></div>
    <div class="dialog-foot" id="dlg-foot"></div>
  </form>
</dialog>

<script>
'use strict';

/* ============================================================
   ND2 RADIOLOGY OS V5.5 — SINGLE FILE
   Consolidated from V5 + rs-v4 + cloud-login patches.
   Security fixes applied client-side. See ADR-001..004.
   ============================================================ */

/* ---------- 1. UTILS ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate = v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('vi-VN')};
const fmtNum = v=>v===''||v==null?'—':Number(v).toLocaleString('vi-VN');
const localDate = (d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toast = m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- 2. PII GATE (ADR-004) ---------- */
const PII_PATTERNS = [
  {r:/(họ\s*tên|bệnh\s*nhân|patient|bn)\s*[:=]\s*\S+/i, l:'Tên bệnh nhân'},
  {r:/(sinh\s*ngày|dob|date\s*of\s*birth|ngày\s*sinh)\s*[:=]\s*\d/i, l:'Ngày sinh'},
  {r:/\b\d{8,12}\b/, l:'Số định danh (8-12 chữ số)'},
  {r:/(đường|phường|quận|tỉnh|p\.|q\.)\s+\S+/i, l:'Địa chỉ'},
  {r:/0008,\d{4}/, l:'Mã DICOM'},
  {r:/\b\d{1,3}\s*(tuổi|y\.?o\.?)\b.*\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/i, l:'Tuổi + ngày'},
];
function piiScan(text){
  const s = String(text||'');
  for(const p of PII_PATTERNS){
    if(p.r.test(s)) return {ok:false, reason:p.l};
  }
  return {ok:true};
}

/* ---------- 3. CONSTANTS ---------- */
const ROLES = {admin:{n:'Quản trị'},doctor:{n:'Bác sĩ'},tech:{n:'KTV'},viewer:{n:'Chỉ xem'}};
const PERM = {
  admin: {'*':['c','r','u','d']},
  doctor: {
    dashboard:['r'],calendar:['r','c'],
    staff:['r'],daily_volumes:['r'],modality_production:['r'],staff_production:['r'],
    inpatient_activity:['r'],outpatient_activity:['r'],emergency_activity:['r'],after_hours_activity:['r'],
    tat_tracking:['r'],backlog:['r'],image_quality:['r'],errors_redos:['r'],
    cases:['r','c','u'],diseases:['r'],imaging_signs:['r'],protocols:['r'],
    references:['r'],docs:['r'],report_templates:['r','c'],
    roster_doctor:['r'],roster_tech:['r'],roster_after:['r'],duty_month:['r'],
    leave_requests:['r','c'],task_tracking:['r','c','u'],
    assets:['r'],maintenance:['r'],indicators:['r'],
    quality_events:['r','c'],capa:['r'],risks:['r'],
    radiation_workers:['r'],personal_dosimeters:['r'],
    notifications:['r'],ai_assistant:['r'],
  },
  tech: {
    dashboard:['r'],calendar:['r'],staff:['r'],
    daily_volumes:['c','r','u'],modality_production:['c','r','u'],
    inpatient_activity:['c','r','u'],outpatient_activity:['c','r','u'],
    emergency_activity:['c','r','u'],after_hours_activity:['c','r','u'],
    tat_tracking:['c','r','u'],backlog:['c','r','u'],image_quality:['c','r','u'],errors_redos:['c','r','u'],
    cases:['r'],protocols:['r'],report_templates:['r'],
    roster_doctor:['r'],roster_tech:['r','u'],roster_after:['r'],duty_month:['r'],
    leave_requests:['r','c'],task_tracking:['r','c','u'],
    assets:['r'],maintenance:['r','c','u'],calibration:['r','c','u'],
    indicators:['r'],quality_events:['r','c'],
    radiation_workers:['r'],personal_dosimeters:['r'],area_surveys:['r','c'],
    notifications:['r'],
  },
  viewer: {
    dashboard:['r'],calendar:['r'],staff:['r'],
    roster_doctor:['r'],roster_tech:['r'],roster_after:['r'],duty_month:['r'],
    indicators:['r'],notifications:['r'],
  }
};
function can(mod, action){
  if(!CURRENT) return false;
  const p = PERM[CURRENT.role]||{};
  const a = p[mod] || p['*'] || [];
  return a.includes(action) || a.includes('*');
}

/* ---------- 4. SCHEMA (consolidated) ---------- */
const SCHEMA = {
  // A. Dashboards
  dash_executive:{g:'A',n:'Dashboard Lãnh đạo',icon:'📊',view:'dashboard'},
  dash_clinical:{g:'A',n:'Dashboard Chuyên môn',icon:'🩺',view:'dashboard'},
  dash_hr:{g:'A',n:'Dashboard Nhân sự',icon:'👥',view:'dashboard'},
  dash_equipment:{g:'A',n:'Dashboard Thiết bị',icon:'🩻',view:'dashboard'},
  dash_quality:{g:'A',n:'Dashboard Chất lượng',icon:'🎯',view:'dashboard'},
  // B. Workforce
  staff:{g:'B',n:'Nhân sự',icon:'👤',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'fullName',l:'Họ tên',t:'text',r:1},
    {k:'short',l:'Tên trên lịch',t:'text'},
    {k:'title',l:'Chức danh',t:'select',o:['BS','BSPK','KTV','ĐD','NV']},
    {k:'role',l:'Vai trò',t:'select',o:['Bác sĩ CĐHA','KTV CĐHA','Điều dưỡng','Hành chính']},
    {k:'group',l:'Nhóm CM',t:'select',o:['XQ','CT','MRI','SA','Can thiệp','Đa PT']},
    {k:'contract',l:'Hợp đồng',t:'select',o:['Biên chế','HĐ dài hạn','HĐ ngắn hạn','Thỉnh giảng']},
    {k:'fte',l:'FTE',t:'num'},{k:'joinDate',l:'Ngày vào',t:'date'},
    {k:'status',l:'Trạng thái',t:'select',o:['Đang làm','Nghỉ phép','Thai sản','Đã nghỉ'],r:1}
  ]},
  positions:{g:'B',n:'Chức danh',icon:'🏷️',f:[
    {k:'code',l:'Mã',t:'text',r:1},{k:'name',l:'Tên chức danh',t:'text',r:1},
    {k:'level',l:'Cấp',t:'num'},{k:'description',l:'Mô tả',t:'textarea',full:1}
  ]},
  leave_requests:{g:'B',n:'Đơn nghỉ phép',icon:'🌴',view:'leave_workflow'},
  overtime:{g:'B',n:'Làm thêm ngoài giờ',icon:'⏰',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'date',l:'Ngày',t:'date',r:1},
    {k:'slot',l:'Ca',t:'select',o:['Ca 0 (05:30-07:00)','Ca 1 (07:00-11:00)','Ca 2 (11:00-13:00)','Ca 3 (13:00-16:00)','Ca 4 (16:00-19:30)','Ca 5 (19:30-21:00)']},
    {k:'hours',l:'Số giờ',t:'num'},{k:'amount',l:'Thù lao',t:'num'},
    {k:'status',l:'Trạng thái',t:'select',o:['Chưa duyệt','Đã duyệt','Đã thanh toán']}
  ]},
  timesheet:{g:'B',n:'Chấm công',icon:'✍️',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},{k:'year',l:'Năm',t:'num',r:1},{k:'month',l:'Tháng',t:'num',r:1},
    {k:'workDays',l:'Ngày công',t:'num'},{k:'leaveDays',l:'Ngày phép',t:'num'},
    {k:'sickDays',l:'Ngày ốm',t:'num'},{k:'overtime',l:'Giờ OT',t:'num'},
    {k:'status',l:'Trạng thái',t:'select',o:['Nháp','Đã duyệt']}
  ]},
  competency_assessment:{g:'B',n:'Đánh giá năng lực',icon:'⭐',f:[
    {k:'empCode',l:'Mã NV',t:'text',r:1},
    {k:'skill',l:'Kỹ năng',t:'select',o:['X-quang','CT','MRI','Siêu âm','Can thiệp']},
    {k:'level',l:'Mức độ',t:'select',o:['0 - Chưa làm','1 - Hỗ trợ','2 - Độc lập','3 - Hướng dẫn','4 - Chuyên sâu']},
    {k:'assessedBy',l:'Người đánh giá',t:'text'},{k:'date',l:'Ngày',t:'date'}
  ]},

/* ---------- 7. AUDIT (ADR-002 partial: local with hash chain) ---------- */
function audit(action, module, rid, detail){
  const prev = DB.auditLog[0];
  const entry = {
    id: uid(), ts: Date.now(),
    user: CURRENT?.username||'sys', name: CURRENT?.name||'', role: CURRENT?.role||'',
    action, module, recordId: rid||'', detail: detail||'',
    prevHash: prev?.hash || ''
  };
  entry.hash = btoa(unescape(encodeURIComponent([entry.ts,entry.user,action,module,rid,entry.prevHash].join('|')))).slice(0,16);
  DB.auditLog.unshift(entry);
  if(DB.auditLog.length > 5000) DB.auditLog.length = 5000;
  saveDB();
}

async function initDB(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{ DB = JSON.parse(saved); }catch(e){}
  } else {
    // Migrate from V5
    const v5 = localStorage.getItem('nd2_v5');
    if(v5){
      try{
        const old = JSON.parse(v5);
        DB.data = old.data||{};
        DB.auditLog = old.auditLog||[];
      }catch(e){}
    }
    if(!DB.data.users?.length){
      const h = await sha256('123456');
      DB.data.users = [
        {id:'u1',username:'admin',passwordHash:h,name:'Trưởng khoa',role:'admin',status:'active'},
        {id:'u2',username:'bacsi',passwordHash:h,name:'Bác sĩ CĐHA',role:'doctor',status:'active'},
        {id:'u3',username:'ktv',passwordHash:h,name:'KTV CĐHA',role:'tech',status:'active'}
      ];
    }
    if(!DB.data.staff?.length){
      DB.data.staff = [
        {id:uid(),empCode:'HUT05',short:'Hưng',fullName:'Trần Nam Hưng',title:'BSPK',role:'Bác sĩ CĐHA',status:'Đang làm'},
        {id:uid(),empCode:'DAT02',short:'Đạt',fullName:'Trần Quốc Đạt',title:'BS',role:'Bác sĩ CĐHA',status:'Đang làm'},
        {id:uid(),empCode:'LIV03',short:'Linh',fullName:'Võ Thùy Linh',title:'BS',role:'Bác sĩ CĐHA',status:'Đang làm'}
      ];
    }
    saveDB();
  }
  Object.keys(SCHEMA).forEach(k=>{ if(!DB.data[k]) DB.data[k]=[]; });
  if(!DB.data.users) DB.data.users=[];
  if(!DB.data.events) DB.data.events=[];
  if(!DB.data.meetings) DB.data.meetings=[];
  if(!DB.auditLog) DB.auditLog=[];
  // Apply custom fields
  Object.entries(DB.data._customFields||{}).forEach(([mod,fs])=>{
    if(!SCHEMA[mod]?.f) return;
    fs.forEach(f=>{ if(!SCHEMA[mod].f.some(x=>x.k===f.k)) SCHEMA[mod].f.push(f); });
  });
}

let LOGIN_ATTEMPTS = {};
async function doLogin(){
  const u = $('#login-u').value.trim();
  const p = $('#login-p').value;
  const err = $('#login-err');
  err.textContent = '';
  // Rate limit login
  const now = Date.now();
  LOGIN_ATTEMPTS[u] = (LOGIN_ATTEMPTS[u]||[]).filter(t=>now-t<60000);
  if(LOGIN_ATTEMPTS[u].length >= 5){
    err.textContent = 'Quá nhiều lần thử. Vui lòng đợi 1 phút.';
    return;
  }
  await initDB();
  const h = await sha256(p);
  const cfg = getSyncCfg();
  let who = null;

  if(cfg.url && cfg.token){
    try{
      const res = await fetch(cfg.url, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'login', token:cfg.token, username:u, hash:h})
      });
      const out = await res.json();
      if(out.error){ LOGIN_ATTEMPTS[u].push(now); err.textContent = out.error; return; }
      who = out.user;
      let local = DB.data.users.find(x=>x.username===who.username);
      if(!local){ local = {id:who.id, username:who.username, status:'active'}; DB.data.users.push(local); }
      Object.assign(local, {name:who.name, role:who.role, status:'active', passwordHash:h});
      saveDB();
    }catch(e){ who = null; }
  }
  if(!who){
    const user = DB.data.users.find(x=>x.username===u);
    if(!user){ LOGIN_ATTEMPTS[u].push(now); err.textContent = 'Tài khoản không tồn tại'; return; }
    if(user.status !== 'active'){ err.textContent = 'Tài khoản đã bị khóa'; return; }
    if(h !== user.passwordHash){
      LOGIN_ATTEMPTS[u].push(now);
      audit('login_fail','system',user.id,'Sai mật khẩu');
      err.textContent = 'Sai mật khẩu';
      return;
    }
    who = user;
  }
  CURRENT = {id:who.id, username:who.username, name:who.name, role:who.role};
  sessionStorage.setItem('nd2_55_user', JSON.stringify(CURRENT));
  const lu = DB.data.users.find(x=>x.username===who.username);
  if(lu) lu.lastLogin = Date.now();
  saveDB();
  audit('login','system',who.id,'Đăng nhập');
  await enterApp();
}
function logout(){
  audit('logout','system',CURRENT?.id||'','');
  sessionStorage.removeItem('nd2_55_user');
  CURRENT = null;
  location.reload();
}

async function enterApp(){
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  $('#user-info').innerHTML = `${esc(CURRENT.name)}<span class="role-badge role-${CURRENT.role}">${ROLES[CURRENT.role].n}</span>`;
  renderNav();
  const cfg = getSyncCfg();
  if(cfg.url && cfg.token){
    setSyncBadge('','Đang đồng bộ…');
    await syncPull();
  } else {
    setSyncBadge('err','Local only');
  }
  renderNav();
  route(CUR_ROUTE);
}

function getSyncCfg(){ try{ return JSON.parse(localStorage.getItem('nd2_sync')||'{}'); }catch(e){ return {}; } }
function setSyncBadge(state, text){
  const b = $('#sync-badge'); if(!b) return;
  b.className = 'sync-badge ' + (state||'');
  b.textContent = '☁️ ' + text;
}
function mergeRows(local, cloud){
  const m = new Map(local.map(r=>[r.id, r]));
  let added = 0, updated = 0;
  for(const c of cloud){
    const l = m.get(c.id);
    if(!l){ m.set(c.id, c); added++; }
    else if((c.updatedAt||0) > (l.updatedAt||0)){ m.set(c.id, c); updated++; }
  }
  return {rows: [...m.values()], added, updated};
}

async function syncPush(){
  const cfg = getSyncCfg();
  if(!cfg.url){ toast('Chưa cấu hình URL'); return; }
  toast('Đang đẩy dữ liệu...');
  try{
    const payload = {token: cfg.token, action: 'batchUpsert', data: {}};
    for(const k of SYNC_ALLOW_PUSH){
      const rows = (DB.data[k]||[]).filter(r=>!r._deleted && !r.synthetic);
      if(!rows.length) continue;
      // Strip any sensitive field defensively
      payload.data[k] = rows.map(r=>{
        const c = {...r};
        delete c.passwordHash;
        delete c.token;
        delete c.session;
        return c;
      });
    }
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    if(!(res.headers.get('content-type')||'').includes('json')){
      throw new Error('Chưa cấp quyền Apps Script. Mở URL trong tab mới, đăng nhập và cho phép.');
    }
    const out = await res.json();
    if(out.error) throw new Error(out.error);
    addSyncLog('push', `Đã đẩy ${out.stats?.added||0} thêm, ${out.stats?.updated||0} sửa`, true);
    toast('Push OK');
    renderSyncCenter();
  }catch(e){
    addSyncLog('push', 'Lỗi: '+e.message, false);
    toast('Lỗi: '+e.message);
  }
}

async function syncPull(){
  const cfg = getSyncCfg();
  if(!cfg.url) return false;
  setSyncBadge('','Đang tải…');
  try{
    // POST instead of GET (S-07 fix)
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'pull', token:cfg.token, since:0})
    });
    const out = await res.json();
    if(out.error) throw new Error(out.error);
    let added = 0, updated = 0;
    for(const [mod, rows] of Object.entries(out.data||{})){
      if(!Array.isArray(rows)) continue;
      if(SYNC_BLOCK_PULL.has(mod)) continue;        // A-05 fix
      if(!SCHEMA[mod]) continue;                    // R-15 fix
      // Strip passwordHash defensively (R-03)
      const cleaned = rows.map(r=>{ const c = {...r}; delete c.passwordHash; return c; });
      const r = mergeRows(DB.data[mod]||[], cleaned);
      DB.data[mod] = r.rows;
      added += r.added; updated += r.updated;
    }
    saveDB();
    addSyncLog('pull', `Thêm ${added}, cập nhật ${updated}`, true);
    setSyncBadge('ok','Đã đồng bộ');
    return true;
  }catch(e){
    addSyncLog('pull', 'Lỗi: '+e.message, false);
    setSyncBadge('err','Lỗi sync');
    return false;
  }
}
function addSyncLog(action, detail, ok){
  if(!DB.data._syncLog) DB.data._syncLog=[];
  DB.data._syncLog.unshift({ts:Date.now(), action, detail, ok});
  if(DB.data._syncLog.length > 100) DB.data._syncLog.length = 100;
  localStorage.setItem('nd2_last_sync', new Date().toLocaleString('vi-VN'));
  saveDB();
}

  const b = new Blob([JSON.stringify(safe, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'ND2_V55_BACKUP_' + localDate() + '.json';
  a.click();
  audit('export','backup','','');
  toast('Đã backup (đã loại bỏ hash mật khẩu)');
}

function doRestore(){
  const f = $('#restore-file').files[0];
  if(!f){ toast('Chọn file backup'); return; }
  if(!confirm('Ghi đè toàn bộ dữ liệu hiện tại? Không thể hoàn tác!')) return;
  const r = new FileReader();
  r.onload = evt => {
    try{
      const data = JSON.parse(evt.target.result);
      // A-02 fix
      if(!data.v || !data.data){ toast('File không hợp lệ (thiếu v/data)'); return; }
      if(data.v !== 5.5 && data.v !== 5){
        if(!confirm(`File có version ${data.v}, không khớp 5.5. Tiếp tục?`)) return;
      }
      // Re-hash password for users that lack it (restore from safe backup)
      if(data.data.users){
        data.data.users.forEach(u=>{
          if(!u.passwordHash){
            // Set default 123456 hash for anyone missing
            sha256('123456').then(h=>{ u.passwordHash = h; saveDB(); });
          }
        });
      }
      DB = data;
      saveDB();
      renderNav();
      route('dash_executive');
      toast('Đã restore thành công');
    }catch(e){ toast('Lỗi: '+e.message); }
  };
  r.readAsText(f);
}

function rsNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');}
function rsWeekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return localDate(x);}
function rsDays(ws){const d0=new Date(ws+'T00:00:00');return Array.from({length:7},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return d;});}
function rsFmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function rsISOWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);}
function rsShort(code){const s=(DB.data.staff||[]).find(x=>x.empCode===code&&!x._deleted);return s?(s.short||s.fullName||code):code;}
function rsChipText(e){return e.startsWith('~')?e.slice(1):rsShort(e);}
function rsLeaveHit(code,ds){return (DB.data.leave_requests||[]).some(l=>!l._deleted&&l.state==='approved'&&l.empCode===code&&l.startDate<=ds&&ds<=l.endDate);}
function rsLayout(kind){

function rsRows(kind){

    sec.rows.forEach((row,j)=>out.push({rid:row.id,label:row.label,sec:sec.label,color:c.color,bar:c.bar,first:j===0,size:sec.rows.length}));

}
function rsFindRow(label,kind){

function rsConflicts(kind,r){
  const bad = {}, rows = rsRows(kind).filter(x=>!RS_KINDS[kind].noConflict.includes(x.label));
  for(let day=0;day<7;day++){
    const seen = {};
    rows.forEach(row=>{
      const key = row.rid+'|'+day;
      (r.cells[key]||[]).filter(e=>!e.startsWith('~')).forEach(code=>{
        if(seen[code]){ bad[key]=true; bad[seen[code]]=true; } else seen[code]=key;
      });
    });
  }
  return bad;
}

        const key = row.rid+'|'+d, list = rec.cells[key]||[], dow = (new Date(y,m-1,d).getDay()+6)%7;
        const chips = list.map(e=>{
          if(e.startsWith('~')) return `<span class="badge warn" style="margin:1px">${esc(e.slice(1))}</span>`;
          const p = byP[e]||{days:{}};
          const dup = p.days[d]>1, near = p.days[d-1]||p.days[d+1];
          return `<span class="badge ${dup?'bad':near?'warn':'info'}" style="margin:1px">${esc(rsShort(e))}</span>`;
        }).join('');
        h += `<td ${canE?`onclick="rsDutyEdit('${row.rid}',${d})" style="cursor:pointer;`:'style="'}min-width:80px;${dow>=5?'background:#fffaf3;':''}">${chips||(canE?'<span style="color:#cbd5e1">+</span>':'')}</td>`;
      }
      h += '</tr>';
    });
    h += `</tbody></table></div>
    <div class="card" style="margin-top:14px"><h3>Số ca trực trong tháng</h3>
      ${Object.keys(byP).length?`<table style="font-size:12px"><thead><tr><th>Nhân viên</th><th>Số ca</th><th>Số ngày</th></tr></thead><tbody>${
        Object.keys(byP).sort((a,b)=>byP[b].count-byP[a].count).map(c=>`<tr><td>${esc(rsShort(c))}</td><td><b>${byP[c].count}</b></td><td>${Object.keys(byP[c].days).length}</td></tr>`).join('')
      }</tbody></table>`:'<div class="empty">Chưa có ca trực</div>'}
    </div>`;
  }
  $('#view').innerHTML = h;
}
function rsMonthShift(n){
  if(n===0) RS_MONTH = localDate().slice(0,7);
  else{const [y,m] = RS_MONTH.split('-').map(Number); const d = new Date(y,m-1+n,1); RS_MONTH = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  rsRenderDuty();
}
function rsDutyEdit(rid,d){
  const row = rsDutyRows().find(x=>x.rid===rid); if(!row) return;
  const cur = (rsDutyRec()||{cells:{}}).cells[rid+'|'+d]||[];
  rsPick(`${row.label} · ngày ${d}/${RS_MONTH.split('-')[1]}`, cur, list=>{
    const r = rsDutyEnsure(), key = rid+'|'+d;
    if(list.length) r.cells[key] = list; else delete r.cells[key];
    r.updatedAt = Date.now(); saveDB(); audit('update','duty_month',r.id,key);
    closeDlg(); rsRenderDuty(); toast('Đã lưu');
  });
}
function rsDutyFromWeeks(){
  const [y,m] = RS_MONTH.split('-').map(Number), dim = new Date(y,m,0).getDate();
  if(!confirm('Điền lịch trực từ lịch BS các tuần?')) return;
  const r = rsDutyEnsure(), rows = rsDutyRows(); let n = 0;
  for(let d=1;d<=dim;d++){
    const dt = new Date(y,m-1,d), wk = rsRec('doctor',rsWeekStart(dt)); if(!wk) continue;
    const di = (dt.getDay()+6)%7;
    rows.forEach(row=>{
      const list = wk.cells[row.rid+'|'+di], key = row.rid+'|'+d;
      if(list&&list.length){ r.cells[key] = [...list]; n++; } else delete r.cells[key];
    });
  }
  r.updatedAt = Date.now(); saveDB(); rsRenderDuty(); toast(`Đã điền ${n} ô`);
}
function rsDutyExport(){
  const [y,m] = RS_MONTH.split('-').map(Number), dim = new Date(y,m,0).getDate(), rec = rsDutyRec()||{cells:{}};
  const head = ['Vị trí',...Array.from({length:dim},(_,i)=>String(i+1))];
  const lines = rsDutyRows().map(row=>[row.label,...Array.from({length:dim},(_,i)=>(rec.cells[row.rid+'|'+(i+1)]||[]).map(rsChipText).join(' / '))]);
  rsCSV([head,...lines], `lich_truc_${RS_MONTH}.csv`);
}
function rsCSV(rows,name){
  const csv = '\ufeff' + rows.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = name; a.click();
}

/* ---------- 13. MEETINGS / CALENDAR ---------- */
const MT_TYPES = {'Giao ban':'#2563eb','Hội chẩn':'#d97706','Hội nghị/Chuyên đề':'#7c3aed','Đào tạo':'#16a34a','Họp khoa':'#0891b2','Khác':'#64748b'};
const MT_FORMATS = ['Trực tiếp','Trực tuyến','Hỗn hợp'];
const MT_REPEAT = ['Không lặp','Hàng tuần','Hàng tháng'];
let MT = {view:'week', date:localDate()};

function mtMigrate(){
  if(!DB.meta) DB.meta = {};
  if(DB.meta.mtMigrated55) return;
  if(!DB.data.meetings) DB.data.meetings = [];
  const T = {Truc:'Khác',HoiChan:'Hội chẩn',DaoTao:'Đào tạo',Khac:'Khác'};
  (DB.data.events||[]).filter(e=>!e._deleted&&e.date).forEach(e=>{
    const st = e.time||'08:00', [h,mi] = st.split(':').map(Number);
    const en = String((h+1)%24).padStart(2,'0')+':'+String(mi||0).padStart(2,'0');
    DB.data.meetings.push({id:uid(),title:e.title||'(không tiêu đề)',date:e.date,start:st,end:en,
      type:T[e.type]||'Khác',format:'Trực tiếp',location:'',link:'',organizer:'',
      attendees:e.empCode?[e.empCode]:[],agenda:e.note||'',repeat:'Không lặp',repeatUntil:'',
      createdBy:'',createdAt:Date.now(),updatedAt:Date.now()});
  });
  DB.meta.mtMigrated55 = true; saveDB();
}
function mtAll(){ if(!DB.data.meetings) DB.data.meetings = []; return DB.data.meetings.filter(m=>!m._deleted); }
function mtDateAdd(s,n){const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return localDate(d);}
function mtOccs(from,to){
  const out = [];
  mtAll().forEach(m=>{
    const until = m.repeatUntil||'9999-12-31';
    if(m.repeat==='Hàng tuần'){
      let n = 0;
      for(let s = m.date; s<=to && s<=until && n<400; s = mtDateAdd(s,7), n++) if(s>=from) out.push({m,date:s});
    } else if(m.repeat==='Hàng tháng'){
      const base = new Date(m.date+'T00:00:00'), bd = base.getDate();
      for(let k=0;k<400;k++){
        const d = new Date(base.getFullYear(),base.getMonth()+k,bd), s = localDate(d);
        if(s>to||s>until) break;
        if(d.getDate()===bd && s>=from) out.push({m,date:s});
      }
    } else if(m.date>=from && m.date<=to) out.push({m,date:m.date});
  });
  return out.sort((a,b)=>(a.date+a.m.start).localeCompare(b.date+b.m.start));
}
function mtClash(occs){
  const bad = new Set();
  for(let i=0;i<occs.length;i++) for(let j=i+1;j<occs.length;j++){
    const a = occs[i], b = occs[j];
    if(a.date!==b.date) continue;
    if(!(a.m.start<b.m.end && b.m.start<a.m.end)) continue;
    const shared = a.m.attendees.some(x=>!x.startsWith('~')&&b.m.attendees.includes(x));
    const room = a.m.location && a.m.location===b.m.location;
    if(shared||room){ bad.add(a.m.id+'|'+a.date); bad.add(b.m.id+'|'+b.date); }
  }
  return bad;
}
function mtRange(){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return [MT.date,MT.date];
  if(MT.view==='week'){const s = rsWeekStart(d); return [s, mtDateAdd(s,6)];}
  if(MT.view==='month'){
    const f = new Date(d.getFullYear(),d.getMonth(),1), l = new Date(d.getFullYear(),d.getMonth()+1,0);
    return [rsWeekStart(f), mtDateAdd(rsWeekStart(l),6)];
  }
  return [MT.date, mtDateAdd(MT.date,30)];
}
function mtTitle(){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return `${RS_DOW[(d.getDay()+6)%7]}, ${rsFmt(d)}/${d.getFullYear()}`;
  if(MT.view==='month') return `Tháng ${d.getMonth()+1} / ${d.getFullYear()}`;
  const [f,t] = mtRange();
  if(MT.view==='week') return `${rsFmt(new Date(f+'T00:00:00'))} – ${rsFmt(new Date(t+'T00:00:00'))} / ${d.getFullYear()}`;
  return `31 ngày từ ${rsFmt(d)}`;
}
function mtShift(n){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='month') d.setMonth(d.getMonth()+n);
  else if(MT.view==='day') d.setDate(d.getDate()+n);
  else if(MT.view==='week') d.setDate(d.getDate()+7*n);
  else d.setDate(d.getDate()+31*n);
  MT.date = localDate(d); renderCalendar();
}
function mtNames(m){return (m.attendees||[]).map(e=>e.startsWith('~')?e.slice(1):rsShort(e)).join(', ');}
function mtChip(o,clash){
  const m = o.m, c = MT_TYPES[m.type]||'#64748b';
  return `<div title="${esc(m.title)}" onclick="event.stopPropagation();mtEdit('${m.id}','${o.date}')"
    style="border-left:3px solid ${c};background:${c}22;padding:3px 6px;border-radius:5px;margin-bottom:3px;font-size:11px;cursor:pointer;${clash?'box-shadow:inset 0 0 0 1px var(--bad);':''}">
    <b>${esc(m.start)}</b> ${clash?'⚠ ':''}${esc(m.title)}</div>`;
}
function mtRow(o,clash){
  const m = o.m, c = MT_TYPES[m.type]||'#64748b';
  return `<div onclick="mtEdit('${m.id}','${o.date}')" style="display:flex;gap:12px;padding:10px;border-bottom:1px solid var(--ln);cursor:pointer;border-left:4px solid ${c}">
    <div style="min-width:110px;font-weight:700;color:${c}">${esc(m.start)} – ${esc(m.end)}</div>
    <div style="flex:1"><b>${clash?'⚠ ':''}${esc(m.title)}</b>
      <div style="font-size:12px;color:var(--mut)">${esc(m.type)} · ${esc(m.format)}${m.location?' · 📍 '+esc(m.location):''}${mtNames(m)?' · 👥 '+esc(mtNames(m)):''}</div>
      ${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener" style="font-size:12px" onclick="event.stopPropagation()">🔗 Tham gia</a>`:''}</div>
    ${m.repeat!=='Không lặp'?'<span class="badge info">↻ '+esc(m.repeat)+'</span>':''}
  </div>`;
}
function renderCalendar(){
  mtMigrate();
  const [from,to] = mtRange(), occs = mtOccs(from,to), clash = mtClash(occs), canC = can('calendar','c');
  const byDay = {}; occs.forEach(o=>{(byDay[o.date] = byDay[o.date]||[]).push(o);});
  const days = []; for(let s = from; s<=to; s = mtDateAdd(s,1)) days.push(s);
  let body = '';
  if(MT.view==='agenda'){
    body = days.filter(s=>byDay[s]).map(s=>`<div class="card"><h3>${RS_DOW[(new Date(s+'T00:00:00').getDay()+6)%7]} ${rsFmt(new Date(s+'T00:00:00'))}</h3>${byDay[s].map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')}</div>`).join('')
      || '<div class="card"><div class="empty">Không có cuộc họp trong 31 ngày tới</div></div>';
  } else if(MT.view==='day'){
    body = `<div class="card">${(byDay[from]||[]).map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')||'<div class="empty">Không có cuộc họp</div>'}</div>`;
  } else if(MT.view==='week'){
    body = `<div class="table-wrap"><table style="min-width:900px;table-layout:fixed"><thead><tr>${days.map((s,i)=>`<th style="text-align:center;${i>=5?'background:#fff7ed;':''}">${RS_DOW[i]}<br><small>${rsFmt(new Date(s+'T00:00:00'))}</small></th>`).join('')}</tr></thead>
      <tbody><tr>${days.map(s=>`<td style="vertical-align:top;height:280px;padding:4px;${canC?'cursor:pointer;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>${(byDay[s]||[]).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}</td>`).join('')}</tr></tbody></table></div>`;
  } else {
    const dow = ['T2','T3','T4','T5','T6','T7','CN'];
    body = `<div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${days.map(s=>{
      const list = byDay[s]||[], other = s.slice(0,7)!==MT.date.slice(0,7);
      return `<div class="cal-cell ${s===localDate()?'today':''}" style="min-height:110px;${other?'opacity:.45;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>
        <div class="cal-day">${Number(s.slice(8))}</div>
        ${list.slice(0,3).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}
        ${list.length>3?`<div style="font-size:10px;color:var(--mut)">+${list.length-3} lượt</div>`:''}
      </div>`;}).join('')}</div>`;
  }
  $('#view').innerHTML = `<div class="page-head">
    <div><h1>🤝 Lịch họp & hội chẩn</h1><div class="subtitle">${esc(mtTitle())} · ${occs.length} lượt</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn-soft btn-sm" onclick="mtShift(-1)">◀</button>
      <button class="btn-soft btn-sm" onclick="MT.date=localDate();renderCalendar()">Hôm nay</button>
      <button class="btn-soft btn-sm" onclick="mtShift(1)">▶</button>
      <div class="cal-modes">${[['day','Ngày'],['week','Tuần'],['month','Tháng'],['agenda','Lịch biểu']].map(([k,l])=>`<button class="${MT.view===k?'on':''}" onclick="MT.view='${k}';renderCalendar()">${l}</button>`).join('')}</div>
      ${canC?'<button class="btn btn-sm" onclick="mtNew(null)">+ Tạo cuộc họp</button>':''}
      <button class="btn-soft btn-sm" onclick="mtICS()">📅 .ics</button>
      <button class="btn-soft btn-sm" onclick="mtCSV()">📤 CSV</button>
    </div></div>${body}`;
}
function mtNew(date){mtForm(null, date||MT.date);}
function mtEdit(id,occDate){const m = mtAll().find(x=>x.id===id); if(m) mtForm(m, occDate||m.date);}
function mtForm(m,date){

      || '<div class="empty">Chưa có nhân sự</div>'}</div></div>

  else foot += `<button type="button" class="btn" onclick="mtSave('')">💾 Lưu</button>`;

function mtSave(id){
  const title = $('#mt-title').value.trim(), date = $('#mt-date').value, start = $('#mt-start').value, end = $('#mt-end').value;
  if(!title||!date){ toast('Nhập tiêu đề và ngày'); return; }
  if(!start||!end||start>=end){ toast('Giờ kết thúc phải sau giờ bắt đầu'); return; }
  const picked = $$('[data-mt-emp]:checked',$('#dlg-body')).map(x=>x.dataset.mtEmp);
  const free = ($('#mt-free').value||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean).map(s=>'~'+s);
  const data = {title,type:$('#mt-type').value,format:$('#mt-format').value,date,start,end,
    repeat:$('#mt-repeat').value,repeatUntil:$('#mt-until').value||'',location:$('#mt-loc').value.trim(),
    link:$('#mt-link').value.trim(),organizer:$('#mt-org').value.trim(),attendees:[...picked,...free],
    agenda:$('#mt-agenda').value.trim(),updatedAt:Date.now()};
  const clash = mtOccs(date,date).some(o=>o.m.id!==id && start<o.m.end && o.m.start<end &&
    (o.m.attendees.some(x=>!x.startsWith('~')&&data.attendees.includes(x)) || (data.location && o.m.location===data.location)));
  if(clash && !confirm('Trùng giờ với cuộc họp khác. Vẫn lưu?')) return;
  if(id){ const m = DB.data.meetings.find(x=>x.id===id); Object.assign(m, data); audit('update','calendar',id,title); }
  else { const nid = uid(); DB.data.meetings.push({id:nid, ...data, createdBy:CURRENT.username, createdAt:Date.now()}); audit('create','calendar',nid,title); }
  saveDB(); closeDlg(); MT.date = date; renderCalendar(); toast('Đã lưu');
}
function mtDel(id){
  if(!confirm('Xóa cuộc họp này?')) return;
  const m = DB.data.meetings.find(x=>x.id===id);
  if(m){ m._deleted = true; m.updatedAt = Date.now(); }
  audit('delete','calendar',id,''); saveDB(); closeDlg(); renderCalendar(); toast('Đã xóa');
}
function mtICS(){
  const e2 = s=>String(s??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,x=>'\\'+x);
  const dt = (d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ND2 V5.5//VN','CALSCALE:GREGORIAN'];
  mtAll().forEach(m=>{
    L.push('BEGIN:VEVENT','UID:'+m.id+'@nd2','DTSTAMP:'+dt(localDate(),'00:00'),
      'DTSTART:'+dt(m.date,m.start),'DTEND:'+dt(m.date,m.end),'SUMMARY:'+e2(m.title),'LOCATION:'+e2(m.location||''));
    const desc = [m.type,m.format,m.link,m.agenda,'Thành phần: '+mtNames(m)].filter(Boolean).join('\n');
    L.push('DESCRIPTION:'+e2(desc));
    if(m.repeat==='Hàng tuần'||m.repeat==='Hàng tháng')
      L.push('RRULE:FREQ='+(m.repeat==='Hàng tuần'?'WEEKLY':'MONTHLY')+(m.repeatUntil?';UNTIL='+m.repeatUntil.replace(/-/g,'')+'T235959':''));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download = 'lich_hop_'+localDate()+'.ics'; a.click();
}
function mtCSV(){
  const [from,to] = mtRange(), occs = mtOccs(from,to);
  rsCSV([['Ngày','Bắt đầu','Kết thúc','Tiêu đề','Loại','Hình thức','Địa điểm','Link','Thành phần','Chủ trì'],
    ...occs.map(o=>[o.date,o.m.start,o.m.end,o.m.title,o.m.type,o.m.format,o.m.location,o.m.link,mtNames(o.m),o.m.organizer])],
    `lich_hop_${from}_${to}.csv`);
}

function renderLeaveWorkflow(){
  const rows = (DB.data.leave_requests||[]).filter(r=>!r._deleted);
  const canC = can('leave_requests','c'), canA = CURRENT.role==='admin'||CURRENT.role==='doctor';
  let h = `<div class="page-head"><div><h1>🌴 Đơn nghỉ phép</h1><div class="subtitle">${rows.length} đơn · State machine: draft → submitted → approved/rejected → taken</div></div>
    ${canC?'<button class="btn" onclick="openLeaveForm(null)">+ Tạo đơn</button>':''}</div>`;
  if(!rows.length){ h += '<div class="card"><div class="empty">Chưa có đơn</div></div>'; }
  else {
    h += '<div class="table-wrap"><table><thead><tr><th>Mã NV</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Lý do</th><th>Trạng thái</th><th>Duyệt bởi</th><th></th></tr></thead><tbody>';
    rows.sort((a,b)=>b.createdAt-a.createdAt).forEach(r=>{
      const state = r.state||'draft';
      h += `<tr><td><b>${esc(r.empCode)}</b></td><td>${esc(r.type)}</td><td>${fmtDate(r.startDate)}</td><td>${fmtDate(r.endDate)}</td>

        <td><span class="state-chip ${state}">${LEAVE_STATE_LABEL[state]||state}</span></td>
        <td>${esc(r.approvedBy||'—')}</td>
        <td style="white-space:nowrap">
          ${canA && LEAVE_TRANSITIONS[state]?.includes('approved')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','approved')">✓ Duyệt</button>`:''}
          ${canA && LEAVE_TRANSITIONS[state]?.includes('rejected')?`<button class="btn-danger btn-sm" onclick="leaveTransition('${r.id}','rejected')">✗ Từ chối</button>`:''}
          ${canC && LEAVE_TRANSITIONS[state]?.includes('submitted')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','submitted')">Gửi duyệt</button>`:''}
          ${canC && LEAVE_TRANSITIONS[state]?.includes('taken')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','taken')">Đã nghỉ</button>`:''}
          ${canC && LEAVE_TRANSITIONS[state]?.includes('cancelled')?`<button class="btn-soft btn-sm" onclick="leaveTransition('${r.id}','cancelled')">Hủy</button>`:''}
          <button class="icon-btn" onclick="openLeaveForm('${r.id}')">✏️</button>
        </td></tr>`;
    });
    h += '</tbody></table></div>';
    // Coverage check
    h += '<div class="card"><h3>Kiểm tra phủ lịch (đơn đã duyệt)</h3>';
    const approved = rows.filter(r=>r.state==='approved'&&r.startDate);
    if(!approved.length) h += '<div class="empty">Không có đơn đã duyệt</div>';
    else {
      h += '<table style="font-size:12px"><thead><tr><th>Mã NV</th><th>Từ</th><th>Đến</th><th>Cảnh báo</th></tr></thead><tbody>';
      approved.forEach(r=>{
        const dutyWeek = (DB.data.roster||[]).filter(wk=>!wk._deleted&&wk.kind==='doctor').find(wk=>{
          const days = rsDays(wk.weekStart).map(localDate);
          return days.some(d=>d>=r.startDate && d<=r.endDate);
        });
        const hasDuty = dutyWeek && Object.values(dutyWeek.cells||{}).some(list=>(list||[]).includes(r.empCode));
        h += `<tr><td>${esc(r.empCode)}</td><td>${fmtDate(r.startDate)}</td><td>${fmtDate(r.endDate)}</td>
          <td>${hasDuty?'<span class="badge warn">⚠ Có lịch trực trùng</span>':'<span class="badge good">OK</span>'}</td></tr>`;
      });
      h += '</tbody></table>';
    }
    h += '</div>';
  }
  $('#view').innerHTML = h;
}
function leaveTransition(id, newState){
  const r = (DB.data.leave_requests||[]).find(x=>x.id===id); if(!r) return;
  const cur = r.state||'draft';
  if(!LEAVE_TRANSITIONS[cur]?.includes(newState)){ toast(`Không thể ${cur} → ${newState}`); return; }
  r.state = newState;
  r.updatedAt = Date.now();
  if(newState==='approved' || newState==='rejected'){ r.approvedBy = CURRENT.name; r.approvedAt = Date.now(); }
  if(newState==='taken') r.takenAt = Date.now();
  audit(newState==='approved'?'approve':newState==='rejected'?'reject':'transition','leave_requests',id,`${cur}→${newState}`);
  saveDB(); renderLeaveWorkflow(); toast(`Đã ${LEAVE_STATE_LABEL[newState]}`);
}

/* ---------- 15. GENERIC RENDER ---------- */
function renderGeneric(key){
  const mod = SCHEMA[key];
  const canC = can(key,'c'), canU = can(key,'u'), canD = can(key,'d');
  const rows = (DB.data[key]||[]).filter(r=>!r._deleted).filter(r=>{
    const f = FILTERS[key]||{};
    for(const fk in f){ if(f[fk] && String(r[fk]||'')!==f[fk]) return false; }
    const s = SEARCHS[key];
    if(s){ const txt = (mod.f||[]).map(x=>String(r[x.k]||'')).join(' ').toLowerCase(); if(!txt.includes(s.toLowerCase())) return false; }
    return true;
  });
  let fb = '<div class="filter-bar">';
  (mod.f||[]).filter(f=>f.t==='select'&&f.o).forEach(f=>{
    const cur = (FILTERS[key]||{})[f.k]||'';
    fb += `<select data-fk="${f.k}"><option value="">${esc(f.l)}</option>${f.o.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  });
  fb += `<input type="text" class="search" data-search placeholder="🔍 Tìm…" value="${esc(SEARCHS[key]||'')}">`;
  if(canC) fb += `<button class="btn-soft" data-add>+ Thêm</button>`;
  fb += `<button class="btn-soft" data-csv>📥 CSV</button></div>`;
  const cols = mod.f||[];
  let tb = '<table><thead><tr><th style="width:40px">#</th>';
  cols.forEach(c=>tb += `<th>${esc(c.l)}</th>`);
  tb += '<th style="width:90px"></th></tr></thead><tbody>';
  if(!rows.length) tb += `<tr><td colspan="${cols.length+2}" class="empty">Chưa có dữ liệu</td></tr>`;
  rows.forEach((r,i)=>{
    tb += '<tr>';
    tb += `<td>${i+1}</td>`;
    cols.forEach(c=>tb += `<td>${renderCell(c,r[c.k])}</td>`);
    tb += '<td style="white-space:nowrap">';
    if(canU) tb += `<button class="icon-btn" data-edit="${r.id}">✏️</button>`;
    if(canD) tb += `<button class="icon-btn" data-del="${r.id}">🗑️</button>`;
    tb += '</td></tr>';
  });
  tb += '</tbody></table>';
  $('#view').innerHTML = `
    <div class="page-head"><div><h1>${mod.icon||'📄'} ${esc(mod.n)}</h1><div class="subtitle">${GROUP_NAMES[mod.g]||''} · ${rows.length} bản ghi</div></div></div>
    ${fb}<div class="table-wrap">${tb}</div>`;
  $$('[data-add]').forEach(b=>b.onclick = ()=>openForm(key,null));
  $$('[data-edit]').forEach(b=>b.onclick = ()=>openForm(key,b.dataset.edit));
  $$('[data-del]').forEach(b=>b.onclick = ()=>delRecord(key,b.dataset.del));
  $$('[data-fk]').forEach(s=>s.onchange = ()=>{
    if(!FILTERS[key]) FILTERS[key] = {};
    FILTERS[key][s.dataset.fk] = s.value; renderGeneric(key);
  });
  const srch = $('[data-search]'); if(srch) srch.oninput = e=>{ SEARCHS[key] = e.target.value; renderGeneric(key); };
  const csvBtn = $('[data-csv]'); if(csvBtn) csvBtn.onclick = ()=>showCSVMenu(key);
}
function renderCell(f,v){
  if(v===''||v==null) return '<span style="color:#94a3b8">—</span>';
  if(f.t==='date') return fmtDate(v);
  if(f.t==='num') return fmtNum(v);
  if(f.t==='bool') return v?'<span class="badge good">✔</span>':'<span class="badge">—</span>';
  if(f.k==='status'){ const s = String(v); const c = /Hoàn thành|Đã duyệt|Đang làm|Hiệu lực|Đạt|Xong/.test(s)?'good':/Chờ|Đề xuất|Sắp hết|Đang/.test(s)?'warn':/Hết hạn|Từ chối|Không|Đã nghỉ/.test(s)?'bad':'info'; return `<span class="badge ${c}">${esc(s)}</span>`; }
  return esc(v);
}
function openForm(key,id){
  const mod = SCHEMA[key];
  const r = id?DB.data[key].find(x=>x.id===id):{};
  let html = '';
  (mod.f||[]).forEach(f=>{
    const val = r[f.k]??'';
    html += `<div class="form-group ${f.full?'full':''}"><label>${esc(f.l)}${f.r?' *':''}</label>`;
    if(f.t==='select') html += `<select data-k="${f.k}" ${f.r?'required':''}><option value="">— chọn —</option>${(f.o||[]).map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.t==='textarea') html += `<textarea data-k="${f.k}" rows="3" ${f.r?'required':''}>${esc(val)}</textarea>`;
    else if(f.t==='date') html += `<input type="date" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='datetime-local') html += `<input type="datetime-local" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='num') html += `<input type="number" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    else if(f.t==='bool') html += `<input type="checkbox" data-k="${f.k}" ${val?'checked':''}>`;
    else html += `<input type="text" data-k="${f.k}" value="${esc(val)}" ${f.r?'required':''}>`;
    html += '</div>';
  });
  $('#dlg-title').textContent = (id?'Sửa':'Thêm')+': '+mod.n;
  $('#dlg-body').innerHTML = html;
  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" onclick="saveForm('${key}','${id||''}')">💾 Lưu</button>`;
  $('#dlg').showModal();
}
function saveForm(key,id){
  const mod = SCHEMA[key];
  const data = {};
  for(const f of (mod.f||[])){
    const el = $(`[data-k="${f.k}"]`); if(!el) continue;
    if(f.t==='bool') data[f.k] = el.checked;
    else if(f.t==='num') data[f.k] = el.value===''?'':Number(el.value);
    else data[f.k] = el.value;
  }
  for(const f of (mod.f||[])){
    if(f.r && (data[f.k]===''||data[f.k]==null)){ toast('Vui lòng nhập: '+f.l); return; }
  }
  if(id){
    const i = DB.data[key].findIndex(x=>x.id===id);
    if(i>=0){ DB.data[key][i] = {...DB.data[key][i], ...data, updatedAt: Date.now()}; audit('update', key, id, data[Object.keys(data)[0]]||''); }
  } else {
    const nid = uid();
    DB.data[key].push({id:nid, ...data, createdAt:Date.now(), updatedAt:Date.now()});
    audit('create', key, nid, data[Object.keys(data)[0]]||'');
  }
  saveDB(); closeDlg(); renderGeneric(key); renderNav(); toast('Đã lưu');
}
function delRecord(key,id){
  if(!confirm('Xóa bản ghi này?')) return;
  const i = DB.data[key].findIndex(x=>x.id===id);
  if(i<0) return;
  DB.data[key][i]._deleted = true; DB.data[key][i]._deletedAt = Date.now(); DB.data[key][i].updatedAt = Date.now();
  audit('delete', key, id, ''); saveDB(); renderGeneric(key); renderNav(); toast('Đã xóa');
}

function handleCaseImage(e){
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 500*1024){ toast('Ảnh quá lớn (>500KB)'); return; }
  const r = new FileReader();
  r.onload = ev=>{ TEMP_CASE_IMAGES.push({url:ev.target.result, caption:''}); renderCaseImagesEditor(); $('#img-count').textContent = TEMP_CASE_IMAGES.length+' ảnh'; };
  r.readAsDataURL(f); e.target.value = '';
}

function generateFromTemplate(id){

function buildTemplateOutput(id){
  const t = (DB.data.report_templates||[]).find(x=>x.id===id); if(!t) return;
  const vars = [...new Set((t.body.match(/\{\{(\w+)\}\}/g)||[]).map(v=>v.replace(/[{}]/g,'').trim()))];
  let out = t.body;
  vars.forEach(v=>{ const val = (document.getElementById('tv-'+v)?.value) || `[${v}]`; out = out.replace(new RegExp(`\\{\\{\\s*${v}\\s*\\}\\}`,'g'), val); });
  $('#tpl-out').value = out;
}
function copyTemplateOutput(){
  const ta = document.getElementById('tpl-out');
  if(!ta || !ta.value){ toast('Chưa có nội dung'); return; }
  navigator.clipboard.writeText(ta.value).then(()=>toast('Đã copy')).catch(()=>{ ta.select(); document.execCommand('copy'); toast('Đã copy'); });
}

function loadEquipment360(code){
  const asset = (DB.data.assets||[]).find(a=>a.assetCode===code);

  const opLog = (DB.data.operation_log||[]).filter(x=>x.assetCode===code);
  const down = (DB.data.downtime||[]).filter(x=>x.assetCode===code);
  const totalCost = maint.reduce((s,x)=>s+(Number(x.cost)||0),0) + repairs.reduce((s,x)=>s+(Number(x.cost)||0),0);
  let h = `<div class="card"><h3>Thông tin</h3>

      <div class="tile"><small>Sửa chữa</small><strong>${repairs.length}</strong></div>

      <div class="tile"><small>Tổng chi phí</small><strong style="font-size:18px">${fmtNum(totalCost)}đ</strong></div>

function renderRiskMatrix(){
  const risks = (DB.data.risks||[]).filter(x=>!x._deleted);
  const matrix = Array(5).fill(0).map(()=>Array(5).fill(0));
  const cells = Array(5).fill(0).map(()=>Array(5).fill(null).map(()=>[]));
  risks.forEach(r=>{
    const p = Math.max(1,Math.min(5,Number(r.probability)||1));
    const i = Math.max(1,Math.min(5,Number(r.impact)||1));
    matrix[5-p][i-1]++; cells[5-p][i-1].push(r);
  });
  const getColor = (p,i)=>{ const s = p*i; if(s>=15) return '#dc2626'; if(s>=8) return '#f59e0b'; if(s>=4) return '#fbbf24'; return '#22c55e'; };
  let h = `<div class="page-head"><div><h1>🎲 Ma trận rủi ro</h1><div class="subtitle">${risks.length} rủi ro</div></div></div>
  <div class="card">
    <div class="risk-legend" style="margin-bottom:16px"><span><i style="background:#22c55e"></i>Thấp (1-3)</span><span><i style="background:#fbbf24"></i>T.Bình (4-7)</span><span><i style="background:#f59e0b"></i>Cao (8-14)</span><span><i style="background:#dc2626"></i>N.Cao (15-25)</span></div>
    <div style="display:flex;gap:4px">
      <div style="writing-mode:vertical-rl;transform:rotate(180deg);padding:8px;background:var(--pnl2);border-radius:6px;font-weight:700;font-size:12px">Khả năng →</div>
      <div style="flex:1"><table style="width:100%;border-collapse:separate;border-spacing:4px">
        ${[5,4,3,2,1].map(p=>`<tr><td style="text-align:right;font-weight:700;font-size:12px;padding:6px;width:40px">${p}</td>${[1,2,3,4,5].map(i=>`<td style="height:70px;text-align:center;background:${getColor(p,i)};color:white;border-radius:6px;font-weight:800;font-size:20px;cursor:${cells[5-p][i-1].length?'pointer':'default'}" title="${cells[5-p][i-1].map(r=>r.title).join('\n')}">${matrix[5-p][i-1]||''}</td>`).join('')}</tr>`).join('')}
        <tr><td></td>${[1,2,3,4,5].map(i=>`<td style="text-align:center;font-weight:700;font-size:12px;padding:6px">${i}</td>`).join('')}</tr>
      </table></div></div>
  </div>
  <div class="card"><h3>Danh sách rủi ro</h3>
    ${risks.length?risks.sort((a,b)=>(b.probability*b.impact)-(a.probability*a.impact)).map(r=>{
      const score = (r.probability||0)*(r.impact||0);
      const level = score>=15?'N.Cao':score>=8?'Cao':score>=4?'T.Bình':'Thấp';
      const color = score>=15?'bad':score>=8?'warn':score>=4?'warn':'good';
      return `<div style="padding:10px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between"><div><b>${esc(r.title||'')}</b><br><small style="color:var(--mut)">P=${r.probability} · I=${r.impact} · ${esc(r.owner||'—')}</small></div><span class="badge ${color}">${level} (${score})</span></div>`;
    }).join(''):'<div class="empty">Chưa có rủi ro</div>'}
  </div>`;
  $('#view').innerHTML = h;
}

async function saveUser(id){
  const username = $('#u-username').value.trim(), name = $('#u-name').value.trim(), role = $('#u-role').value, pass = $('#u-pass').value;
  if(!username||!name){ toast('Nhập đủ'); return; }
  if(!id){
    if(DB.data.users.find(u=>u.username===username)){ toast('Username tồn tại'); return; }
    if(pass.length < 6){ toast('Mật khẩu ≥ 6 ký tự'); return; }
    const h = await sha256(pass);
    DB.data.users.push({id:uid(), username, name, role, passwordHash:h, status:'active', createdAt:Date.now()});
    audit('create','users','',username);
  } else {
    const u = DB.data.users.find(x=>x.id===id);
    u.name = name; u.role = role;
    if(pass){ if(pass.length < 6){ toast('Mật khẩu ≥ 6'); return; } u.passwordHash = await sha256(pass); }
    audit('update','users',id,username);
  }
  saveDB(); closeDlg(); renderUsers(); toast('Đã lưu');
}

/* ---------- 19. CSV ---------- */
function exportCSV(key){
  const mod = SCHEMA[key], rows = (DB.data[key]||[]).filter(r=>!r._deleted);
  if(!rows.length){ toast('Không có dữ liệu'); return; }
  const cols = mod.f||[];
  const headers = cols.map(c=>c.l);
  const lines = rows.map(r=>cols.map(c=>{
    let v = r[c.k]??'';
    if(typeof v==='string'&&/^[=+\-@]/.test(v)) v = "'"+v;
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  const csv = '\ufeff' + headers.join(',') + '\n' + lines.join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = `${key}_${localDate()}.csv`; a.click();
  audit('export',key,'',rows.length+' rows'); toast('Đã xuất CSV');
}
function showCSVMenu(key){
  const mod = SCHEMA[key];
  $('#dlg-title').textContent = 'CSV: ' + mod.n;
  $('#dlg-body').innerHTML = `<div style="grid-column:1/-1">

      <button class="btn-soft" onclick="document.getElementById('csv-imp').click()">📥 Import</button>
    </div>
    <input type="file" id="csv-imp" accept=".csv" style="display:none" onchange="handleImportFile(event,'${key}')">
  </div>`;
  $('#dlg-foot').innerHTML = `<button class="btn-soft" onclick="closeDlg()">Đóng</button>`;
  $('#dlg').showModal();
}
function downloadTemplate(key){
  const mod = SCHEMA[key], cols = mod.f||[];
  const header = cols.map(c=>c.l).join(',');
  const example = cols.map(c=>c.t==='date'?'2026-01-01':c.t==='num'?'0':`[${c.l}]`).join(',');
  const csv = '\ufeff' + header + '\n' + example;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = `template_${key}.csv`; a.click();
  toast('Đã tải template');
}
function parseCSVText(text){
  const lines = []; let row = [''], inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(c==='"'){ if(inQ && n==='"'){ row[row.length-1]+='"'; i++; } else inQ = !inQ; }
    else if(c===','&&!inQ) row.push('');
    else if((c==='\n'||c==='\r')&&!inQ){ if(c==='\r'&&n==='\n') i++; if(row.length>1||row[0]!=='') lines.push(row); row = ['']; }
    else row[row.length-1] += c;
  }
  if(row.length>1||row[0]!=='') lines.push(row);
  return lines;
}
function handleImportFile(e, key){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    const rows = parseCSVText(evt.target.result);
    if(rows.length < 2){ toast('File rỗng'); return; }
    const headers = rows[0], mod = SCHEMA[key];
    const cols = mod.f||[];
    const keyField = (cols.find(c=>c.k==='empCode'||c.k==='assetCode'||c.k==='code')||cols[0]).k;
    const parsed = rows.slice(1).filter(r=>r[0]!=='').map((row,idx)=>{
      const obj = {_row:idx+2, _status:'new', _errors:[]};
      headers.forEach((h,i)=>{ const col = cols.find(c=>c.l===h||c.k===h); if(col) obj[col.k] = row[i]||''; });
      cols.filter(c=>c.r).forEach(c=>{ if(!obj[c.k]) obj._errors.push('Thiếu '+c.l); });
      const existing = (DB.data[key]||[]).find(x=>String(x[keyField])===String(obj[keyField])&&!x._deleted);
      if(existing){ obj._status = 'update'; obj.id = existing.id; }
      if(obj._errors.length) obj._status = 'error';
      return obj;
    });
    showImportPreview(key, parsed);
  };
  reader.readAsText(file, 'UTF-8'); e.target.value = '';
}
function showImportPreview(key, data){
  const mod = SCHEMA[key];
  const newC = data.filter(r=>r._status==='new').length, updC = data.filter(r=>r._status==='update').length, errC = data.filter(r=>r._status==='error').length;
  const cols = mod.f||[];
  $('#dlg-title').textContent = 'Preview Import: ' + mod.n;
  $('#dlg-body').innerHTML = `<div style="display:flex;gap:16px;margin-bottom:20px;grid-column:1/-1">
    <div style="flex:1;padding:12px;background:var(--pnl2);border-radius:8px;text-align:center"><b style="font-size:20px">${data.length}</b><br><small>Tổng</small></div>
    <div style="flex:1;padding:12px;background:var(--goodbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--good)">${newC}</b><br><small>Thêm</small></div>
    <div style="flex:1;padding:12px;background:var(--warnbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--warn)">${updC}</b><br><small>Sửa</small></div>
    <div style="flex:1;padding:12px;background:var(--badbg);border-radius:8px;text-align:center"><b style="font-size:20px;color:var(--bad)">${errC}</b><br><small>Lỗi</small></div>
  </div>
  <div style="grid-column:1/-1;max-height:300px;overflow:auto;border:1px solid var(--ln);border-radius:8px">
    <table><thead><tr><th>Dòng</th><th>Trạng thái</th><th>Lỗi</th>${cols.slice(0,4).map(c=>`<th>${c.l}</th>`).join('')}</tr></thead>
    <tbody>${data.slice(0,30).map(r=>`<tr style="background:${r._status==='new'?'#f0fdf4':r._status==='update'?'#fefce8':'#fef2f2'}">
      <td>${r._row}</td>
      <td><b style="font-size:11px;color:${r._status==='new'?'var(--good)':r._status==='update'?'var(--warn)':'var(--bad)'}">${r._status.toUpperCase()}</b></td>
      <td style="font-size:11px;color:var(--bad)">${r._errors.join('; ')}</td>
      ${cols.slice(0,4).map(c=>`<td>${esc(r[c.k]||'')}</td>`).join('')}
    </tr>`).join('')}</tbody></table>
  </div>`;
  $('#dlg-foot').innerHTML = `<button class="btn-soft" onclick="closeDlg()">Hủy</button><button class="btn" onclick="commitImport('${key}')" ${errC===data.length?'disabled':''}>✅ Ghi ${newC+updC} bản ghi</button>`;
  window._importData = data;
}
function commitImport(key){
  const data = window._importData||[];
  let add = 0, upd = 0;
  data.forEach(r=>{
    if(r._status==='error') return;
    const {_row,_status,_errors,...clean} = r;
    if(_status==='update'&&clean.id){
      const i = DB.data[key].findIndex(x=>x.id===clean.id);
      if(i>=0){ DB.data[key][i] = {...DB.data[key][i], ...clean, updatedAt:Date.now()}; upd++; }
    } else {
      delete clean.id;
      DB.data[key].push({id:uid(), ...clean, createdAt:Date.now(), updatedAt:Date.now()}); add++;
    }
  });
  saveDB(); audit('import',key,'',`Thêm ${add}, Sửa ${upd}`);
  closeDlg(); toast(`Import: ${add} thêm, ${upd} sửa`);
  renderGeneric(key); renderNav();
}

/* ---------- 20. NAV & ROUTER ---------- */
function renderNav(){
  const groups = {};
  Object.keys(SCHEMA).forEach(k=>{ const g = SCHEMA[k].g; if(!groups[g]) groups[g] = []; groups[g].push(k); });
  let html = '';
  Object.keys(groups).sort().forEach(g=>{
    const isClosed = localStorage.getItem('nav_closed_'+g) === '1';
    html += `<div class="group-title ${isClosed?'closed':''}" onclick="toggleNavGroup('${g}')"><span>${GROUP_NAMES[g]||g}</span><span class="toggle-icon">▼</span></div>`;
    html += `<div class="group-items ${isClosed?'hidden':''}" id="nav-group-${g}">`;
    groups[g].forEach(k=>{
      const m = SCHEMA[k];
      if(!can(k,'r') && !can(k,'c') && !can(k,'u')) return;
      const count = m.f ? (DB.data[k]||[]).filter(x=>!x._deleted).length : '';
      html += `<button class="nav-item ${CUR_ROUTE===k?'on':''}" data-route="${k}" onclick="route('${k}')"><span class="nav-icon">${m.icon||'•'}</span><span>${esc(m.n)}</span>${count?`<span class="nav-count">${count}</span>`:''}</button>`;
    });
    html += '</div>';
  });
  $('#nav').innerHTML = html;
}
function toggleNavGroup(g){
  const el = document.getElementById('nav-group-'+g);
  const title = el.previousElementSibling;
  el.classList.toggle('hidden');
  title.classList.toggle('closed');
  localStorage.setItem('nav_closed_'+g, el.classList.contains('hidden')?'1':'0');
}
function route(k){
  CUR_ROUTE = k;
  const m = SCHEMA[k];
  if(!m) return;
  if(CURRENT.role !== 'admin' && m.g === 'L'){
    toast('Không có quyền truy cập cấu hình hệ thống');
    return;
  }
  $$('.nav-item').forEach(b=>b.classList.toggle('on', b.dataset.route===k));
  if(m.view==='dashboard') renderDashboard(k);
  else if(m.view==='calendar') renderCalendar();
  else if(m.view==='meetings') renderCalendar();
  else if(m.view==='roster') rsRenderWeek(m.rs);
  else if(m.view==='duty') rsRenderDuty();
  else if(m.view==='cases') renderCases();
  else if(m.view==='template') renderTemplateLibrary();
  else if(m.view==='equipment_360') renderEquipment360();
  else if(m.view==='risk_matrix') renderRiskMatrix();
  else if(m.view==='sync_center') renderSyncCenter();
  else if(m.view==='users') renderUsers();
  else if(m.view==='roles') renderRoles();
  else if(m.view==='audit_log') renderAuditLog();
  else if(m.view==='backup_restore') renderBackup();
  else if(m.view==='api_connectors') renderApiConnectors();
  else if(m.view==='reports_center') renderReportsCenter();
  else if(m.view==='data_dictionary') renderDataDictionary();
  else if(m.view==='notifications') renderNotifications();
  else if(m.view==='settings') renderSettings();
  else if(m.view==='data_center') renderDataCenter();
  else if(m.view==='field_builder') renderFieldBuilder();
  else if(m.view==='master_data') renderMasterData();
  else if(m.view==='conflicts') renderConflicts();
  else if(m.view==='version_history') renderVersionHistory();
  else if(m.view==='monthly_report') renderMonthlyReportView();
  else if(m.view==='ai') renderAI();
  else if(m.view==='leave_workflow') renderLeaveWorkflow();
  else if(m.view==='task_workflow') renderTaskWorkflow();
  else renderGeneric(k);
  window.scrollTo(0,0);
}

  const s = sessionStorage.getItem('nd2_55_user');
  if(s){
    try{

      await enterApp();
    }catch(e){ console.error(e); sessionStorage.removeItem('nd2_55_user'); }
  }
})();
