function renderCalendar(){
  mtMigrate();
  const [from,to]=mtRange(), occs=mtOccs(from,to), clash=mtClash(occs), canC=can('calendar','c');
  const byDay={}; occs.forEach(o=>{(byDay[o.date]=byDay[o.date]||[]).push(o);});
  const days=[]; for(let s=from;s<=to;s=mtDateAdd(s,1)) days.push(s);
  let body='';
  if(MT.view==='agenda'){
    body=days.filter(s=>byDay[s]).map(s=>`<div class="card"><h3>${RS_DOW[(new Date(s+'T00:00:00').getDay()+6)%7]} ${rsFmt(new Date(s+'T00:00:00'))}</h3>${byDay[s].map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')}</div>`).join('')
      || '<div class="card"><div class="empty">Không có cuộc họp trong 31 ngày tới</div></div>';
  } else if(MT.view==='day'){
    body=`<div class="card">${(byDay[from]||[]).map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')||'<div class="empty">Không có cuộc họp trong ngày này</div>'}</div>`;
  } else if(MT.view==='week'){
    body=`<div class="table-wrap"><table style="min-width:900px;table-layout:fixed"><thead><tr>${days.map((s,i)=>`<th style="text-align:center;${i>=5?'background:#fff7ed;':''}">${RS_DOW[i]}<br><small>${rsFmt(new Date(s+'T00:00:00'))}</small></th>`).join('')}</tr></thead>
      <tbody><tr>${days.map(s=>`<td style="vertical-align:top;height:280px;padding:4px;${canC?'cursor:pointer;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>${(byDay[s]||[]).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}</td>`).join('')}</tr></tbody></table></div>`;
  } else {
    const dow=['T2','T3','T4','T5','T6','T7','CN'];
    body=`<div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${days.map(s=>{
      const list=byDay[s]||[], other=s.slice(0,7)!==MT.date.slice(0,7);
      return `<div class="cal-cell ${s===localDate()?'today':''}" style="min-height:110px;${other?'opacity:.45;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>
        <div class="cal-day">${Number(s.slice(8))}</div>
        ${list.slice(0,3).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}
        ${list.length>3?`<div style="font-size:10px;color:var(--muted)">+${list.length-3} lượt</div>`:''}
      </div>`;}).join('')}</div>`;
  }
  $('#view').innerHTML=`<div class="page-head">
    <div><h1>🤝 Lịch họp & hội chẩn</h1><div class="subtitle">${esc(mtTitle())} · ${occs.length} lượt</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn-soft btn-sm" onclick="mtShift(-1)">◀</button>
      <button class="btn-soft btn-sm" onclick="MT.date=localDate();renderCalendar()">Hôm nay</button>
      <button class="btn-soft btn-sm" onclick="mtShift(1)">▶</button>
      <div class="cal-modes">${[['day','Ngày'],['week','Tuần'],['month','Tháng'],['agenda','Lịch biểu']].map(([k,l])=>`<button class="${MT.view===k?'on':''}" onclick="MT.view='${k}';renderCalendar()">${l}</button>`).join('')}</div>
      ${canC?'<button class="btn btn-sm" onclick="mtNew(null)">+ Tạo cuộc họp</button>':''}
      <button class="btn-soft btn-sm" onclick="mtICS()">📅 Xuất .ics</button>
      <button class="btn-soft btn-sm" onclick="mtCSV()">📤 CSV</button>
    </div></div>
    ${body}
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px">${Object.entries(MT_TYPES).map(([k,c])=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${c};vertical-align:middle"></span> ${esc(k)}</span>`).join('')}</div>`;
}

function mtSave(id){
  const title=$('#mt-title').value.trim(), date=$('#mt-date').value, start=$('#mt-start').value, end=$('#mt-end').value;
  if(!title||!date){toast('Nhập tiêu đề và ngày');return;}
  if(!start||!end||start>=end){toast('Giờ kết thúc phải sau giờ bắt đầu');return;}
  const picked=$$('[data-mt-emp]:checked',$('#dlg-body')).map(x=>x.dataset.mtEmp);
  const free=($('#mt-free').value||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean).map(s=>'~'+s);
  const data={title,type:$('#mt-type').value,format:$('#mt-format').value,date,start,end,
    repeat:$('#mt-repeat').value,repeatUntil:$('#mt-until').value||'',location:$('#mt-loc').value.trim(),
    link:$('#mt-link').value.trim(),organizer:$('#mt-org').value.trim(),attendees:[...picked,...free],
    agenda:$('#mt-agenda').value.trim(),updatedAt:Date.now()};
  if(!DB.data.meetings) DB.data.meetings=[];
  const clash=mtOccs(date,date).some(o=>o.m.id!==id && start<o.m.end && o.m.start<end &&
    (o.m.attendees.some(x=>!x.startsWith('~')&&data.attendees.includes(x)) || (data.location && o.m.location===data.location)));
  if(clash && !confirm('Trùng giờ với cuộc họp khác (cùng người hoặc cùng phòng). Vẫn lưu?')) return;
  if(id){const m=DB.data.meetings.find(x=>x.id===id); Object.assign(m,data); audit('update','calendar',id,title);}
  else{const nid=uid(); DB.data.meetings.push({id:nid,...data,createdBy:CURRENT.username,createdAt:Date.now()}); audit('create','calendar',nid,title);}
  saveDB(); closeDlg(); MT.date=date; renderCalendar(); toast('Đã lưu cuộc họp');
}
function mtDel(id){
  if(!confirm('Xóa cuộc họp này? (xóa cả chuỗi lặp nếu có)')) return;
  const m=DB.data.meetings.find(x=>x.id===id);
  if(m){m._deleted=true;m.updatedAt=Date.now();}
  audit('delete','calendar',id,''); saveDB(); closeDlg(); renderCalendar(); toast('Đã xóa');
}

// ----- Xuất .ics (nhập được vào Google Calendar) và CSV -----
function mtICS(){
  const e2=s=>String(s??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,x=>'\\'+x);
  const dt=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ND2 Radiology OS//VN','CALSCALE:GREGORIAN'];
  mtAll().forEach(m=>{
    L.push('BEGIN:VEVENT','UID:'+m.id+'@nd2','DTSTAMP:'+dt(localDate(),'00:00'),
      'DTSTART:'+dt(m.date,m.start),'DTEND:'+dt(m.date,m.end),'SUMMARY:'+e2(m.title),'LOCATION:'+e2(m.location||''));
    const desc=[m.type,m.format,m.link,m.agenda,'Thành phần: '+mtNames(m)].filter(Boolean).join('\n');
    L.push('DESCRIPTION:'+e2(desc));
    if(m.repeat==='Hàng tuần'||m.repeat==='Hàng tháng')
      L.push('RRULE:FREQ='+(m.repeat==='Hàng tuần'?'WEEKLY':'MONTHLY')+(m.repeatUntil?';UNTIL='+m.repeatUntil.replace(/-/g,'')+'T235959':''));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download='lich_hop_'+localDate()+'.ics'; a.click();
}
function mtCSV(){
  const [from,to]=mtRange(), occs=mtOccs(from,to);
  rsCSV([['Ngày','Bắt đầu','Kết thúc','Tiêu đề','Loại','Hình thức','Địa điểm','Link','Thành phần','Chủ trì'],
    ...occs.map(o=>[o.date,o.m.start,o.m.end,o.m.title,o.m.type,o.m.format,o.m.location,o.m.link,mtNames(o.m),o.m.organizer])],
    `lich_hop_${from}_${to}.csv`);
}

// Ghi đè hàm đăng nhập: thử server trước, không kết nối được thì dùng tài khoản trên máy
async function doLogin(){
  const u=$('#login-u').value.trim(), p=$('#login-p').value, err=$('#login-err');
  err.textContent=''; await initDB();
  const h=await sha256(p), cfg=getSyncCfg();
  let who=null;
  if(cfg.url && cfg.token){
    try{
      const res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'login',token:cfg.token,username:u,hash:h})});
      const out=await res.json();
      if(out.error){ err.textContent=out.error; return; }
      who=out.user;
      let local=DB.data.users.find(x=>x.username===who.username);
      if(!local){ local={id:who.id,username:who.username,status:'active'}; DB.data.users.push(local); }
      Object.assign(local,{name:who.name,role:who.role,status:'active',passwordHash:h});
      saveDB();
    }catch(e){ who=null; }   // mất mạng: dùng tài khoản trên máy
  }
  if(!who){
    const user=DB.data.users.find(x=>x.username===u);
    if(!user){ err.textContent='Tài khoản không tồn tại'; return; }
    if(user.status!=='active'){ err.textContent='Tài khoản đã bị khóa'; return; }
    if(h!==user.passwordHash){ audit('login_fail','system',user.id,'Sai mật khẩu'); err.textContent='Sai mật khẩu'; return; }
    who=user;
  }
  CURRENT={id:who.id,username:who.username,name:who.name,role:who.role};
  localStorage.setItem('nd2_user',JSON.stringify(CURRENT));
  const lu=DB.data.users.find(x=>x.username===who.username); if(lu) lu.lastLogin=Date.now();
  saveDB(); audit('login','system',who.id,'Đăng nhập');
  await enterApp();
}

<script>
  // Đợi hệ thống tải xong mới can thiệp
  setTimeout(() => {
    // Lưu lại hàm saveForm gốc của V5
    const originalSaveForm = window.saveForm;
    
    // Ghi đè hàm saveForm: Chỉ can thiệp khi lưu Đơn nghỉ phép
    window.saveForm = function(key, id) {
      if (key === 'leave_requests') {
        // Lấy dữ liệu từ form gốc của V5
        const empCode = document.querySelector('[data-k="empCode"]').value;
        const type = document.querySelector('[data-k="type"]').value;
        const start = document.querySelector('[data-k="startDate"]').value;
        const end = document.querySelector('[data-k="endDate"]').value;

        if (start && end) {
          const days = Math.ceil((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
          
          // Khởi tạo quỹ phép nếu chưa có
          if (!DB.data.leave_balances) DB.data.leave_balances = {};
          if (DB.data.leave_balances[empCode] === undefined) DB.data.leave_balances[empCode] = 12;

          if (type === 'Phép năm' && !id) { // Chỉ check khi tạo mới
            if (days > DB.data.leave_balances[empCode]) {
              alert("LỖI: Nhân viên " + empCode + " chỉ còn " + DB.data.leave_balances[empCode] + " ngày phép, không thể xin " + days + " ngày!");
              return; // Dừng lại, không lưu
            }
            // Nếu hợp lệ, trừ quỹ phép
            DB.data.leave_balances[empCode] -= days;
            toast("Đã trừ " + days + " ngày phép. Số dư còn: " + DB.data.leave_balances[empCode] + " ngày.");
          }
        }
      }
      // Gọi hàm lưu gốc của V5
      originalSaveForm(key, id);
    };
  }, 1000);
</script>

<script>
  function renderApprovalHub() {
    if(!can('dashboard', 'r')) return; // Chỉ Admin/Trưởng khoa mới được vào

    // 1. Quét tất cả các module để tìm những thứ đang "Chờ duyệt"
    const pendingLeaves = (DB.data.leave_requests || []).filter(x => !x._deleted && x.status === 'Chờ duyệt');
    // (Sau này có thể thêm: pendingOvertime, pendingRepairs...)

    const totalPending = pendingLeaves.length;

    let rows = pendingLeaves.map(l => `
      <tr>
        <td><span class="badge info">Nghỉ phép</span></td>
        <td><b>${esc(l.empName || l.empCode)}</b></td>
        <td>${esc(l.type)}</td>
        <td>${fmtDate(l.startDate)} ➔ ${fmtDate(l.endDate)}</td>
        <td>${esc(l.reason || '')}</td>
        <td>
          <button class="btn btn-sm" style="background:var(--good); color:white; border:0; padding:4px 10px; border-radius:4px; cursor:pointer; margin-right:5px;" 
                  onclick="quickApprove('leave_requests', '${l.id}')">✓ Duyệt</button>
          <button class="btn-soft btn-sm" style="color:var(--bad); border-color:var(--bad); padding:4px 10px; border-radius:4px; cursor:pointer;" 
                  onclick="quickReject('leave_requests', '${l.id}')">✕ Từ chối</button>
        </td>
      </tr>
    `).join('');

    let html = `
      <div class="page-head">
        <div>
          <h1>✅ Trung Tâm Phê Duyệt</h1>
          <div class="subtitle">Tổng hợp các yêu cầu đang chờ bạn xử lý</div>
        </div>
        <div class="tile" style="background:var(--soft); border-color:var(--accent); padding:10px 20px;">
          <small>Đang chờ duyệt</small>
          <strong style="color:var(--accent); font-size:24px;">${totalPending}</strong>
        </div>
      </div>
      
      <div class="card">
        <h3>Danh sách yêu cầu</h3>
        <div class="table-wrap" style="margin-top:10px;">
          <table>
            <thead>
              <tr>
                <th>Loại yêu cầu</th><th>Nhân viên</th><th>Chi tiết</th><th>Thời gian</th><th>Lý do</th><th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              ${totalPending > 0 ? rows : '<tr><td colspan="6" class="empty">Tuyệt vời! Không có yêu cầu nào đang chờ duyệt.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
    
    $('#view').innerHTML = html;
  }

  // Hàm xử lý Duyệt nhanh
  function quickApprove(module, id) {
    if(!confirm('Xác nhận DUYỆT yêu cầu này?')) return;
    const item = DB.data[module].find(x => x.id === id);
    if(item) {
      item.status = 'Đã duyệt';
      item.approvedBy = CURRENT.name; // Ghi nhận người duyệt
      item.updatedAt = Date.now();
      
      audit('update', module, id, 'Duyệt nhanh từ Trung Tâm');
      saveDB();
      renderApprovalHub(); // Load lại giao diện
      toast('Đã duyệt thành công!');
    }
  }

  // Hàm xử lý Từ chối
  function quickReject(module, id) {
    if(!confirm('Xác nhận TỪ CHỐI yêu cầu này?')) return;
    const item = DB.data[module].find(x => x.id === id);
    if(item) {
      item.status = 'Từ chối';
      item.approvedBy = CURRENT.name;
      item.updatedAt = Date.now();
      
      audit('update', module, id, 'Từ chối từ Trung Tâm');
      saveDB();
      renderApprovalHub();
      toast('Đã từ chối yêu cầu.');
    }
  }
</script>

        </div>
        <div class="tile" style="background:linear-gradient(135deg, #dcfce7, #bbf7d0); border:none;">
          <small style="color:#166534;">Tổng tiền phải trả</small>
          <strong style="color:#15803d; font-size:24px;">${fmtNum(totalAmount)} đ</strong>
        </div>
      </div>

      <div class="card">
        <h3>Chi tiết thanh toán</h3>
        <div class="table-wrap" style="margin-top: 10px;">
          <table>
            <thead>
              <tr><th>Ngày</th><th>Nhân viên</th><th>Loại ca</th><th style="text-align:center;">Số giờ</th><th style="text-align:right;">Đơn giá/giờ</th><th style="text-align:right;">Thành tiền</th><th></th></tr>
            </thead>
            <tbody>
              ${records.length > 0 ? rows : '<tr><td colspan="7" class="empty">Chưa có dữ liệu ca trực.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('#view').innerHTML = html;
  }

  function openPayrollForm() {
    const staffOptions = (DB.data.staff || []).map(s => `<option value="${esc(s.fullName)}">${esc(s.fullName)}</option>`).join('');
    
    $('#dlg-title').textContent = '💰 Thêm Ca Trực Tính Lương';
    $('#dlg-body').innerHTML = `
      <div class="form-group full">
        <label>Nhân viên *</label>
        <select id="pay-emp">${staffOptions}</select>
      </div>
      <div class="form-group">
        <label>Ngày trực *</label>
        <input type="date" id="pay-date" value="${localDate()}">
      </div>
      <div class="form-group">
        <label>Loại ca trực</label>
        <select id="pay-type" onchange="updatePayRate()">
          <option value="Trực ngày">Trực ngày (Hệ số x1.0)</option>
          <option value="Trực đêm (22h-6h)">Trực đêm (Hệ số x1.3)</option>
          <option value="Trực lễ/Chủ nhật">Trực lễ/Chủ nhật (Hệ số x2.0)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Số giờ trực *</label>
        <input type="number" id="pay-hours" value="8" min="1" oninput="updatePayRate()">
      </div>
      <div class="form-group full" style="background:var(--soft); padding:15px; border-radius:8px; text-align:center;">
        <label style="color:var(--accent); font-size:14px; margin-bottom:5px;">Thành tiền dự kiến</label>
        <div id="pay-preview" style="font-size:24px; font-weight:bold; color:var(--accent2);">0 đ</div>
      </div>
    `;
    $('#dlg-foot').innerHTML = `
      <button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button>
      <button type="button" class="btn" onclick="savePayroll()">💾 Lưu Ca Trực</button>
    `;
    $('#dlg').showModal();
    updatePayRate(); // Cập nhật giá tiền lần đầu
  }

  function updatePayRate() {
    const type = document.getElementById('pay-type').value;
    const hours = Number(document.getElementById('pay-hours').value) || 0;
    const multiplier = PAYROLL_CONFIG.multipliers[type] || 1;
    const total = PAYROLL_CONFIG.baseRate * multiplier * hours;
    
    document.getElementById('pay-preview').innerText = fmtNum(total) + ' đ';
  }

  function savePayroll() {
    const empName = document.getElementById('pay-emp').value;
    const date = document.getElementById('pay-date').value;
    const type = document.getElementById('pay-type').value;
    const hours = Number(document.getElementById('pay-hours').value);
    
    if(!empName || !date || hours <= 0) { toast('Vui lòng nhập đủ thông tin'); return; }

    const multiplier = PAYROLL_CONFIG.multipliers[type] || 1;
    const rate = PAYROLL_CONFIG.baseRate * multiplier;
    const totalAmount = rate * hours;

    DB.data.payroll_records.push({
      id: uid(), empName, date, shiftType: type, hours, rate, totalAmount, createdAt: Date.now()
    });
    
    saveDB(); closeDlg(); renderPayroll(); toast('Đã lưu ca trực');
  }

  function delPayroll(id) {
    if(!confirm('Xóa ca trực này?')) return;
    const r = DB.data.payroll_records.find(x => x.id === id);
    if(r) { r._deleted = true; r.updatedAt = Date.now(); }
    saveDB(); renderPayroll(); toast('Đã xóa');
  }
</script>

<script>
  // Tự động chèn nút Tìm kiếm lên thanh Header khi trang tải xong
  setTimeout(() => {
    const headerActions = document.querySelector('header.top .actions');
    if (headerActions && !document.getElementById('btn-global-search')) {
      const searchBtn = document.createElement('button');
      searchBtn.id = 'btn-global-search';
      searchBtn.className = 'btn-soft btn-sm';
      searchBtn.innerHTML = '🔍 Tìm kiếm';
      searchBtn.onclick = openGlobalSearch;
      // Chèn vào trước nút Backup
      headerActions.insertBefore(searchBtn, headerActions.querySelector('.btn-soft'));
    }
  }, 1000);

  function openGlobalSearch() {
    $('#dlg-title').textContent = '🔍 Tìm kiếm Toàn cầu';
    $('#dlg-body').innerHTML = `
      <div class="form-group full">
        <input type="text" id="global-search-input" placeholder="Gõ tên nhân viên, tên bệnh nhân, lý do nghỉ, công việc..." autocomplete="off">
      </div>
      <div class="full" id="global-search-results" style="max-height: 400px; overflow-y: auto; margin-top: 10px;">
        <div class="empty">Nhập ít nhất 2 ký tự để bắt đầu tìm kiếm trên toàn hệ thống...</div>
      </div>
    `;
    $('#dlg-foot').innerHTML = `<button class="btn-soft" onclick="closeDlg()">Đóng</button>`;
    $('#dlg').showModal();
    
    // Tự động focus vào ô nhập liệu
    setTimeout(() => { document.getElementById('global-search-input').focus(); }, 100);

    // Lắng nghe sự kiện gõ phím
    document.getElementById('global-search-input').oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (q.length < 2) {
        document.getElementById('global-search-results').innerHTML = '<div class="empty">Nhập ít nhất 2 ký tự...</div>';
        return;
      }
      executeGlobalSearch(q);
    };
  }

  function executeGlobalSearch(q) {
    let results = [];
    // Khai báo các module sẽ được quét
    const searchModules = {
      'staff': { name: 'Nhân sự', icon: '👤' },
      'leave_requests': { name: 'Nghỉ phép', icon: '🌴' },
      'appointments': { name: 'Lịch hẹn', icon: '📅' },
      'tasks': { name: 'Công việc', icon: '📋' }
    };
    
    // Quét dữ liệu
    for (const [mod, info] of Object.entries(searchModules)) {
      if(!DB.data[mod]) continue;
      
      DB.data[mod].filter(x => !x._deleted).forEach(item => {
        const str = JSON.stringify(item).toLowerCase();
        if(str.includes(q)) {
          let display = '';
          if(mod === 'staff') display = `<b>${esc(item.fullName)}</b> (Mã: ${esc(item.empCode)}) - ${esc(item.role)}`;
          else if(mod === 'leave_requests') display = `<b>${esc(item.empName || item.empCode)}</b> xin <span class="badge info">${esc(item.type)}</span> từ ${esc(item.startDate)} đến ${esc(item.endDate)}`;
          else if(mod === 'appointments') display = `<b>${esc(item.patient)}</b> - ${esc(item.service)} (${esc(item.date)} ${esc(item.time)})`;
          else if(mod === 'tasks') display = `<b>${esc(item.title)}</b> - PIC: ${esc(item.owner)}`;
          
          results.push({ mod, name: info.name, icon: info.icon, display });
        }
      });
    }

    const resDiv = document.getElementById('global-search-results');
    if(results.length === 0) {
      resDiv.innerHTML = '<div class="empty">Không tìm thấy kết quả nào phù hợp.</div>';
      return;
    }

    // Hiển thị kết quả
    resDiv.innerHTML = results.map(r => `
      <div style="padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 15px; align-items: center; transition: background 0.2s;" onmouseover="this.style.background='var(--soft)'" onmouseout="this.style.background='transparent'">
        <div style="font-size: 24px;">${r.icon}</div>
        <div style="flex: 1;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-bottom: 2px;">${r.name}</div>
          <div style="font-size: 14px;">${r.display}</div>
        </div>
      </div>
    `).join('');
  }
</script>

<script>
  // 1. Khởi tạo bộ nhớ thông báo
  if(!DB.data.notifications) DB.data.notifications = [];
  if(!DB.data.emergency_alerts) DB.data.emergency_alerts = [];

  // 2. Tự động chèn Chuông thông báo lên Header
  setTimeout(() => {
    const headerActions = document.querySelector('header.top .actions');
    if (headerActions && !document.getElementById('notif-bell')) {
      const bell = document.createElement('button');
      bell.id = 'notif-bell';
      bell.className = 'btn-soft btn-sm';
      bell.style.position = 'relative';
      bell.innerHTML = '🔔 <span id="notif-count" style="background:var(--bad);color:white;padding:2px 6px;border-radius:10px;font-size:10px;margin-left:5px;display:none;">0</span>';
      bell.onclick = openNotifications;
      headerActions.insertBefore(bell, headerActions.firstChild);
      updateBellIcon();
    }
  }, 1500);

  function updateBellIcon() {
    const unread = DB.data.notifications.filter(n => !n.read).length;
    const countEl = document.getElementById('notif-count');
    if(countEl) {
      countEl.innerText = unread;
      countEl.style.display = unread > 0 ? 'inline-block' : 'none';
    }
  }

  function openNotifications() {
    // Đánh dấu đã đọc
    DB.data.notifications.forEach(n => n.read = true);
    saveDB();
    updateBellIcon();

    $('#dlg-title').textContent = '🔔 Trung Tâm Thông Báo';
    let html = DB.data.notifications.slice(0, 20).map(n => `
      <div style="padding:12px; border-bottom:1px solid var(--line); display:flex; gap:10px;">
        <div style="font-size:24px;">${n.title.includes('BÁO ĐỘNG') ? '🚨' : '📌'}</div>
        <div style="flex:1;">
          <b style="font-size:13px; color:${n.title.includes('BÁO ĐỘNG') ? 'var(--bad)' : 'var(--ink)'};">${esc(n.title)}</b>
          <div style="font-size:13px; color:var(--ink); margin-top:2px;">${esc(n.msg)}</div>
          <div style="font-size:10px; color:var(--muted); margin-top:6px;">${new Date(n.ts).toLocaleString('vi-VN')}</div>
        </div>
      </div>
    `).join('');
    $('#dlg-body').innerHTML = `<div class="full" style="max-height:400px; overflow-y:auto;">${html || '<div class="empty">Không có thông báo nào.</div>'}</div>`;
    $('#dlg-foot').innerHTML = `<button class="btn-soft" onclick="closeDlg()">Đóng</button>`;
    $('#dlg').showModal();
  }

  // Hàm kích hoạt thông báo (sẽ dùng cho các module khác)
  window.addNotification = function(title, msg) {
    DB.data.notifications.unshift({ id: uid(), title, msg, ts: Date.now(), read: false });
    saveDB();
    updateBellIcon();
  }

  // 3. Giao diện Báo động đỏ & Trực cấp cứu
  function renderEmergencyDashboard() {
    const todayStr = localDate();
    
    // Tìm bác sĩ đang trực hôm nay (quét từ Lịch làm việc)
    let onCallDoc = 'Chưa phân công';
    try {
      const weekStart = typeof rsWeekStart !== 'undefined' ? rsWeekStart(new Date()) : todayStr;
      const roster = (DB.data.roster || []).find(r => r.weekStart === weekStart && r.kind === 'doctor');
      if(roster && roster.cells) {
         const dayIdx = (new Date().getDay() + 6) % 7;
         for(const key in roster.cells) {
           const parts = key.split('|');
           if(Number(parts[1]) === dayIdx && roster.cells[key].length > 0) {
             // Lấy tên
             const codes = roster.cells[key];
             const names = codes.map(c => {
                const s = (DB.data.staff||[]).find(x => x.empCode === c);
                return s ? s.fullName : c;
             });
             onCallDoc = names.join(', ');
             break;
           }
         }
      }
    } catch(e) { console.log(e); }

    let html = `
      <div class="page-head">
        <div><h1>🚨 Báo Động & Cấp Cứu</h1><div class="subtitle">Hệ thống điều phối khẩn cấp (STAT / Code Red)</div></div>
      </div>
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <!-- Cột Báo động -->
        <div class="card" style="background:linear-gradient(135deg, #fee2e2, #fecaca); border:2px solid #ef4444; text-align:center; padding:40px 20px; display:flex; flex-direction:column; justify-content:center;">
          <h2 style="color:#b91c1c; font-size:24px; margin-bottom:10px;">KÍCH HOẠT BÁO ĐỘNG ĐỎ</h2>
          <p style="color:#7f1d1d; margin-bottom:20px; font-size:13px;">Bấm nút dưới đây để phát tín hiệu khẩn cấp đến toàn bộ Ekip và gửi thông báo lên hệ thống.</p>
          <button class="btn" style="background:#dc2626; font-size:20px; padding:15px 40px; border-radius:50px; box-shadow:0 10px 20px rgba(220,38,38,0.4); width:100%;" onclick="triggerCodeRed()">
            🔴 BÁO ĐỘNG ĐỎ
          </button>
        </div>

        <!-- Cột Ekip trực -->
        <div class="card">
          <h3>Ekip trực hôm nay (${fmtDate(todayStr)})</h3>
          <div style="margin-top:15px; padding:15px; background:var(--soft); border-radius:10px; border-left:4px solid var(--accent);">
            <div style="font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:bold;">Bác sĩ CĐHA trực</div>
            <div style="font-size:20px; font-weight:bold; color:var(--accent); margin-top:4px;">${esc(onCallDoc)}</div>
          </div>
          <div style="margin-top:10px; padding:15px; background:var(--soft); border-radius:10px; border-left:4px solid var(--warn);">
            <div style="font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:bold;">KTV Trực</div>
            <div style="font-size:20px; font-weight:bold; color:var(--warn); margin-top:4px;">Đang cập nhật...</div>
          </div>
          <div style="margin-top:10px; padding:15px; background:var(--soft); border-radius:10px; border-left:4px solid var(--good);">
            <div style="font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:bold;">Ekip Gây mê (An thần)</div>
            <div style="font-size:20px; font-weight:bold; color:var(--good); margin-top:4px;">Đang cập nhật...</div>
          </div>
        </div>
      </div>
    `;
    $('#view').innerHTML = html;
  }

  function triggerCodeRed() {
    if(!confirm('XÁC NHẬN: Kích hoạt báo động đỏ toàn khoa CĐHA?')) return;
    
    // Tạo thông báo khẩn
    addNotification(
      '🚨 BÁO ĐỘNG ĐỎ', 
      `${CURRENT.name} vừa kích hoạt báo động đỏ! Yêu cầu toàn bộ ekip trực có mặt ngay lập tức.`
    );
    
    // Ghi log
    audit('create', 'emergency_alerts', '', 'Báo động đỏ bởi ' + CURRENT.name);
    
    toast('🔴 Đã phát lệnh Báo Động Đỏ đến toàn hệ thống!');
    openNotifications(); // Tự động mở bảng thông báo cho người bấm
  }
</script>

<script>
  function renderSedationTeam() {
    if(!DB.data.sedation_cases) DB.data.sedation_cases = [];
    
    const today = localDate();
    // Lấy danh sách ca an thần hôm nay
    const cases = DB.data.sedation_cases.filter(x => !x._deleted && x.date === today);
    
    const waiting = cases.filter(c => c.status === 'Chờ an thần').length;
    const done = cases.filter(c => c.status === 'Đã hoàn thành').length;

    let rows = cases.map(c => {
      const statusColor = c.status === 'Đã hoàn thành' ? 'good' : c.status === 'Đang thực hiện' ? 'warn' : 'bad';
      // Cảnh báo nếu nhịn ăn < 4 tiếng (nguy cơ sặc)
      const npoWarn = c.npo < 4 ? ' <span class="badge bad" title="Nguy cơ sặc!">⚠ NPO ngắn</span>' : '';
      
      return `
        <tr>
          <td><b>${esc(c.patient)}</b><br><small>${c.weight} kg</small></td>
          <td>${esc(c.procedure)}</td>
          <td>${c.npo} giờ ${npoWarn}</td>
          <td><span class="badge info">ASA ${esc(c.asa)}</span></td>
          <td>${esc(c.doctor)} / ${esc(c.nurse)}</td>
          <td><span class="badge ${statusColor}">${esc(c.status)}</span></td>
          <td>
            <button class="btn-soft btn-sm" onclick="updateSedationStatus('${c.id}')">Cập nhật</button>
          </td>
        </tr>
      `;
    }).join('');

    let html = `
      <div class="page-head">
        <div><h1>💤 Ekip Gây Mê & An Thần Nhi</h1><div class="subtitle">Quản lý ca chụp cần an thần (MRI/CT) - ${fmtDate(today)}</div></div>
        <button class="btn" onclick="openSedationForm()">+ Thêm Ca Mới</button>
      </div>

      <div class="tiles" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 20px;">
        <div class="tile"><small>Tổng ca hôm nay</small><strong>${cases.length}</strong></div>
        <div class="tile" style="border-left:4px solid var(--bad);"><small>Đang chờ</small><strong style="color:var(--bad)">${waiting}</strong></div>
        <div class="tile" style="border-left:4px solid var(--good);"><small>Đã hoàn thành</small><strong style="color:var(--good)">${done}</strong></div>
      </div>

      <div class="card">
        <h3>Danh sách ca an thần</h3>
        <div class="table-wrap" style="margin-top: 10px;">
          <table>
            <thead>
              <tr><th>Bệnh nhi (Cân nặng)</th><th>Thủ thuật</th><th>Nhịn ăn (NPO)</th><th>Phân loại</th><th>Ekip (BS/ĐD)</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
              ${cases.length > 0 ? rows : '<tr><td colspan="7" class="empty">Hôm nay chưa có ca an thần nào.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('#view').innerHTML = html;
  }

  function openSedationForm() {
    const staffOptions = (DB.data.staff || []).map(s => `<option value="${esc(s.fullName)}">${esc(s.fullName)}</option>`).join('');
    
    $('#dlg-title').textContent = '💤 Thêm Ca An Thần Mới';
    $('#dlg-body').innerHTML = `
      <div class="form-group full">
        <label>Tên bệnh nhi *</label>
        <input type="text" id="sed-patient" placeholder="VD: Bé Nguyễn Văn B">
      </div>
      <div class="form-group">
        <label>Cân nặng (kg) *</label>
        <input type="number" id="sed-weight" value="15">
      </div>
      <div class="form-group">
        <label>Thời gian nhịn ăn (giờ) *</label>
        <input type="number" id="sed-npo" value="6" title="Trẻ nhỏ thường cần nhịn ăn 4-6 tiếng">
      </div>
      <div class="form-group">
        <label>Phân loại sức khỏe (ASA)</label>
        <select id="sed-asa">
          <option value="I">ASA I (Khỏe mạnh)</option>
          <option value="II">ASA II (Bệnh nhẹ)</option>
          <option value="III">ASA III (Bệnh nặng)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Thủ thuật</label>
        <select id="sed-procedure">
          <option>Chụp MRI</option>
          <option>Chụp CT</option>
          <option>Khác</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bác sĩ Gây mê *</label>
        <select id="sed-doctor">${staffOptions}</select>
      </div>
      <div class="form-group">
        <label>Điều dưỡng phụ *</label>
        <select id="sed-nurse">${staffOptions}</select>
      </div>
    `;
    $('#dlg-foot').innerHTML = `
      <button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button>
      <button type="button" class="btn" onclick="saveSedationCase()">💾 Lưu Ca</button>
    `;
    $('#dlg').showModal();
  }

  function saveSedationCase() {
    const patient = $('#sed-patient').value.trim();
    if(!patient) { toast('Vui lòng nhập tên bệnh nhi'); return; }

    const npo = Number($('#sed-npo').value);
    if(npo < 4) {
      if(!confirm('CẢNH BÁO: Thời gian nhịn ăn dưới 4 giờ có nguy cơ sặc cao. Bạn vẫn muốn lưu?')) return;
    }

    DB.data.sedation_cases.push({
      id: uid(),
      date: localDate(),
      patient: patient,
      weight: $('#sed-weight').value,
      npo: npo,
      asa: $('#sed-asa').value,
      procedure: $('#sed-procedure').value,
      doctor: $('#sed-doctor').value,
      nurse: $('#sed-nurse').value,
      status: 'Chờ an thần',
      createdAt: Date.now()
    });
    
    saveDB(); closeDlg(); renderSedationTeam(); 
    toast('Đã thêm ca an thần');
  }

  function updateSedationStatus(id) {
    const c = DB.data.sedation_cases.find(x => x.id === id);
    if(!c) return;
    
    if(c.status === 'Chờ an thần') c.status = 'Đang thực hiện';
    else if(c.status === 'Đang thực hiện') c.status = 'Đã hoàn thành';
    else c.status = 'Chờ an thần';
    
    saveDB(); renderSedationTeam();
  }
</script>
<!-- ================================================== -->
<!-- MODULE: QUẢN LÝ THỦ THUẬT (PROCEDURE MANAGEMENT)   -->
<!-- ================================================== -->
<script>
  function renderProcedureMgmt() {
    if(!DB.data.procedures) DB.data.procedures = [];
    
    const procedures = DB.data.procedures.filter(x => !x._deleted).reverse();
    
    let rows = procedures.map(p => {
      const statusColor = p.status === 'Hoàn thành' ? 'good' : p.status === 'Đang thực hiện' ? 'warn' : 'info';
      const checklistPassed = p.checklistConsent && p.checklistBlood ? '<span class="badge good">Đã đủ</span>' : '<span class="badge bad">Chưa đủ</span>';

      return `
        <tr>
          <td>${fmtDate(p.date)}</td>
          <td><b>${esc(p.patient)}</b></td>
          <td><span class="badge info">${esc(p.type)}</span></td>
          <td>${esc(p.doctor)}</td>
          <td>${checklistPassed}</td>
          <td><span class="badge ${statusColor}">${esc(p.status)}</span></td>
          <td><button class="btn-soft btn-sm" onclick="updateProcedureStatus('${p.id}')">Cập nhật</button></td>
        </tr>
      `;
    }).join('');

    let html = `
      <div class="page-head">
        <div><h1>🔪 Quản Lý Thủ Thuật (Can thiệp)</h1><div class="subtitle">Sinh thiết, dẫn lưu, chọc dò...</div></div>
        <button class="btn" onclick="openProcedureForm()">+ Thêm Thủ Thuật</button>
      </div>

      <div class="card">
        <h3>Danh sách thủ thuật</h3>
        <div class="table-wrap" style="margin-top: 10px;">
          <table>
            <thead>
              <tr><th>Ngày</th><th>Bệnh nhân</th><th>Loại thủ thuật</th><th>Bác sĩ chính</th><th>Checklist an toàn</th><th>Trạng thái</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
              ${procedures.length > 0 ? rows : '<tr><td colspan="7" class="empty">Chưa có thủ thuật nào.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
    $('#view').innerHTML = html;
  }

  function openProcedureForm() {
    const staffOptions = (DB.data.staff || []).map(s => `<option value="${esc(s.fullName)}">${esc(s.fullName)}</option>`).join('');
    
    $('#dlg-title').textContent = '🔪 Tạo Ca Thủ Thuật Mới';
    $('#dlg-body').innerHTML = `
      <div class="form-group full">
        <label>Tên bệnh nhân *</label>
        <input type="text" id="proc-patient" placeholder="VD: Bé Trần Thị C">
      </div>
      <div class="form-group">
        <label>Ngày thực hiện *</label>
        <input type="date" id="proc-date" value="${localDate()}">
      </div>
      <div class="form-group">
        <label>Loại thủ thuật</label>
        <select id="proc-type">
          <option>Sinh thiết (Biopsy)</option>
          <option>Dẫn lưu ổ áp xe</option>
          <option>Chọc dò dịch màng phổi/ổ bụng</option>
          <option>Can thiệp mạch</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bác sĩ chính *</label>
        <select id="proc-doctor">${staffOptions}</select>
      </div>
      <div class="form-group">
        <label>Ekip hỗ trợ</label>
        <input type="text" id="proc-team" placeholder="VD: KTV Nam, ĐD Hoa...">
      </div>
      
      <div class="form-group full" style="background:var(--soft); padding:15px; border-radius:8px; margin-top:10px;">
        <label style="color:var(--bad); margin-bottom:10px;">🛑 Checklist An Toàn (JCI Time-out)</label>
        <label style="display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:8px;">
          <input type="checkbox" id="proc-chk1" style="width:auto;"> Đã có giấy cam kết (Consent) của phụ huynh
        </label>
        <label style="display:flex; align-items:center; gap:10px; font-size:13px;">
          <input type="checkbox" id="proc-chk2" style="width:auto;"> Đã có kết quả xét nghiệm đông máu
        </label>
      </div>
    `;
    $('#dlg-foot').innerHTML = `
      <button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button>
      <button type="button" class="btn" onclick="saveProcedure()">💾 Lưu Ca</button>
    `;
    $('#dlg').showModal();
  }

  function saveProcedure() {
    const patient = $('#proc-patient').value.trim();
    const chk1 = document.getElementById('proc-chk1').checked;
    const chk2 = document.getElementById('proc-chk2').checked;

    if(!patient) { toast('Vui lòng nhập tên bệnh nhân'); return; }
    if(!chk1 || !chk2) {
      if(!confirm('CẢNH BÁO: Chưa hoàn tất Checklist an toàn. Bạn vẫn muốn lưu nháp ca này?')) return;
    }

    DB.data.procedures.push({
      id: uid(),
      date: $('#proc-date').value,
      patient: patient,
      type: $('#proc-type').value,
      doctor: $('#proc-doctor').value,
      team: $('#proc-team').value,
      checklistConsent: chk1,
      checklistBlood: chk2,
      status: 'Chờ thực hiện',
      createdAt: Date.now()
    });
    
    saveDB(); closeDlg(); renderProcedureMgmt(); 
    toast('Đã lưu ca thủ thuật');
  }

  function updateProcedureStatus(id) {
    const p = DB.data.procedures.find(x => x.id === id);
    if(!p) return;
    
    if(p.status === 'Chờ thực hiện') {
      if(!p.checklistConsent || !p.checklistBlood) {
        if(!confirm('Checklist chưa đủ. Bạn có chắc chắn muốn bắt đầu thực hiện?')) return;
      }
      p.status = 'Đang thực hiện';
    }
    else if(p.status === 'Đang thực hiện') p.status = 'Hoàn thành';
    else p.status = 'Chờ thực hiện';
    
    saveDB(); renderProcedureMgmt();
  }
</script>
