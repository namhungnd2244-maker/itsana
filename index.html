<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ND2 Radiology OS V5.5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root {
  /* Màu nền & Bề mặt (Surface) - Tông xám xanh dịu mắt */
  --bg: #f4f7f9;
  --pnl: #ffffff;
  --pnl2: #f8fafc;
  
  /* Màu chữ (Ink) - Đen xanh đậm, dễ đọc */
  --ink: #0f172a;
  --mut: #64748b;
  
  /* Viền & Đường kẻ */
  --ln: #e2e8f0;
  
  /* Màu chủ đạo (Primary) - Teal Y khoa */
  --acc: #0d9488;
  --acc2: #0f766e;
  --soft: #f1f5f9;
  
  /* Trạng thái */
  --good: #10b981;
  --goodbg: #d1fae5;
  --warn: #f59e0b;
  --warnbg: #fef3c7;
  --bad: #ef4444;
  --badbg: #fee2e2;
  
  /* Đổ bóng (Shadows) mềm mại */
  --sh: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
  --shlg: 0 10px 25px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -2px rgba(15, 23, 42, 0.05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120;
    --pnl: #1e293b;
    --pnl2: #0f172a;
    --ink: #f8fafc;
    --mut: #94a3b8;
    --ln: #334155;
    --acc: #14b8a6;
    --acc2: #0d9488;
    --soft: #1e293b;
    --sh: 0 1px 3px rgba(0,0,0,0.3);
    --shlg: 0 10px 25px -3px rgba(0,0,0,0.5);
  }
}

html,body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--ln);border-radius:7px;background:var(--pnl);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--acc2)}
.btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--ln);border-radius:7px;padding:7px 12px;font-weight:600}
.btn-soft:hover{background:#e2e8f0}
.btn-danger{background:var(--bad);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-weight:600}
.btn-sm{padding:5px 9px;font-size:12px}
.icon-btn{background:transparent;border:0;padding:4px 6px;font-size:15px;border-radius:5px}
.icon-btn:hover{background:var(--soft)}
#login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1220,#1e3a8a)}
.login-card{background:#fff;padding:36px 32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h1{font-size:20px;margin-bottom:6px;color:#1e40af}
.login-card p{color:#64748b;font-size:13px;margin-bottom:24px}
.login-card input{margin-bottom:14px;padding:11px 14px;font-size:15px}
.login-card button{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:15px}
.login-card button:hover{background:#1e40af}
.login-err{color:#dc2626;font-size:12px;margin-top:10px;min-height:18px}
#app{display:none;min-height:100vh}
header.top{background:linear-gradient(135deg,#0b1220,#1e3a8a 70%,#2563eb);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.top h1{font-size:16px;font-weight:800}
header.top .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top .user-badge{font-size:12px;padding:5px 12px;background:rgba(255,255,255,.15);border-radius:20px}
header.top .role-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;margin-left:6px}
.role-admin{background:#fbbf24;color:#78350f}.role-doctor{background:#34d399;color:#064e3b}.role-tech{background:#60a5fa;color:#1e3a8a}.role-viewer{background:#94a3b8;color:#1e293b}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
nav{background:#fff;border-right:1px solid var(--ln);padding:14px 8px;height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:0}
nav .group-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:750;padding:12px 10px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
nav .group-items.hidden{display:none}
nav .group-title .toggle-icon{font-size:10px;transition:transform .2s}
nav .group-title.closed .toggle-icon{transform:rotate(-90deg)}
nav .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink);font-size:13px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;margin-bottom:1px}
nav .nav-item:hover{background:var(--soft)}
nav .nav-item.on{background:#eff6ff;color:var(--acc);font-weight:700}
nav .nav-icon{width:22px;text-align:center;font-size:14px}
nav .nav-count{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
main{padding:20px;min-width:0;overflow-x:hidden}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{height:auto;position:relative}}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:800}
.page-head .subtitle{color:var(--mut);font-size:12px;margin-top:2px}
.filter-bar{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar select,.filter-bar input{width:auto;min-width:130px;font-size:13px;padding:6px 9px}
.filter-bar .search{flex:1;min-width:200px}
.table-wrap{background:#fff;border-radius:10px;border:1px solid var(--ln);overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{background:var(--pnl2);font-size:10.5px;text-transform:uppercase;color:var(--mut);font-weight:750;white-space:nowrap;position:sticky;top:0;z-index:1}
tr:hover td{background:var(--pnl2)}
tr:last-child td{border-bottom:0}
.empty{padding:40px;text-align:center;color:var(--mut)}
.empty::before{content:"📭";display:block;font-size:32px;margin-bottom:8px;opacity:.4}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}
.badge.good{background:var(--goodbg);color:var(--good)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.info{background:#eff6ff;color:var(--acc)}
.badge.mut{background:var(--soft);color:var(--mut)}
dialog{border:0;border-radius:14px;padding:0;background:var(--pnl);color:var(--ink);width:min(900px,96vw);max-height:92vh;box-shadow:var(--shlg);display:none}
dialog[open]{display:block}
dialog::backdrop{background:rgba(5,10,20,.55);backdrop-filter:blur(4px)}
.dialog-head{padding:14px 20px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.dialog-head h3{font-size:16px}
.dialog-body{padding:20px;max-height:70vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-body .full{grid-column:1/-1}
.dialog-foot{padding:12px 20px;background:var(--pnl2);border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 14px 14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.3px}
.form-group.full{grid-column:1/-1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--ln);box-shadow:var(--sh)}
.tile small{font-size:11px;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.tile strong{display:block;font-size:26px;font-weight:800;margin-top:4px;color:var(--acc)}
.tile .sub{font-size:11px;color:var(--mut);margin-top:2px}
.card{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--ln);box-shadow:var(--sh);margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:750;margin-bottom:12px}
.cal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.cal-modes{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:8px}
.cal-modes button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:650;color:var(--mut)}
.cal-modes button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;padding:8px 0;font-size:11px;text-transform:uppercase;font-weight:750;color:var(--mut);background:var(--pnl2);border-radius:5px}
.cal-cell{min-height:100px;padding:6px;background:#fff;border:1px solid var(--ln);border-radius:7px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:hover{border-color:var(--acc);box-shadow:var(--sh)}
.cal-cell.empty{background:var(--pnl2);cursor:default;opacity:.4}
.cal-cell.today{border:2px solid var(--acc);background:#eff6ff}
.cal-day{font-weight:800;font-size:13px;margin-bottom:3px}
.cal-cell.today .cal-day{color:var(--acc)}
.cal-ev{display:block;font-size:10.5px;padding:2px 5px;margin-bottom:2px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid}
.sync-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:650;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer}
.sync-badge.ok{background:rgba(52,211,153,.25);border-color:#34d399}
.sync-badge.err{background:rgba(248,113,113,.25);border-color:#f87171}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;background:var(--ink);color:#fff;border-radius:10px;box-shadow:var(--shlg);z-index:9999;font-weight:650;font-size:13px}
.state-chip{display:inline-block;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.state-chip.draft{background:#e2e8f0;color:#475569}
.state-chip.submitted,.state-chip.open{background:#dbeafe;color:#1e40af}
.state-chip.approved,.state-chip.verified,.state-chip.taken{background:#dcfce7;color:#15803d}
.state-chip.rejected,.state-chip.cancelled{background:#fee2e2;color:#991b1b}
.state-chip.in_progress,.state-chip.blocked{background:#fef3c7;color:#92400e}
.state-chip.assigned{background:#ede9fe;color:#5b21b6}
.state-chip.done{background:#d1fae5;color:#065f46}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.warn-box{background:var(--warnbg);border:1px solid #fcd34d;padding:12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.risk-legend span{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px}
.risk-legend span i{width:14px;height:14px;border-radius:3px;display:inline-block}
@media(max-width:600px){.dialog-body{grid-template-columns:1fr}.page-head h1{font-size:17px}header.top{padding:10px 14px}main{padding:12px}}

/* ===== V5.5.3 — bổ sung giao diện ===== */
.state-chip{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
a{color:var(--acc)}
.login-card label{display:block;font-size:11px;font-weight:650;color:#64748b;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.login-meta{margin-top:14px;font-size:11px;color:#64748b;text-align:center;line-height:1.7}
.login-meta button{width:auto;padding:0;background:none;color:#2563eb;font-size:11px;font-weight:600;text-decoration:underline;border:0}
.login-meta button:hover{background:none;color:#1e40af}
.login-mode{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:650;background:#f1f5f9}
.login-mode.cloud{background:#dcfce7;color:#15803d}
header.top{position:sticky;top:0;z-index:50;min-height:56px}
header.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.env-badge{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:20px;background:#f59e0b;color:#451a03;text-transform:uppercase}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:5px 10px;font-size:16px;line-height:1}
header.top .user-badge{border:0;color:#fff;cursor:pointer}
header.top .user-badge:hover{background:rgba(255,255,255,.25)}
.sync-badge{font-family:inherit}
.sync-badge.warn{background:rgba(251,191,36,.3);border-color:#fbbf24}
nav{top:56px}
.nav-search{position:sticky;top:-14px;background:#fff;padding:0 2px 8px;margin-top:-4px;z-index:2}
.nav-search input{font-size:13px;padding:6px 9px}
.nav-empty{padding:16px 10px;color:var(--mut);font-size:12px;text-align:center}
.nav-backdrop{display:none}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warnbg);border-color:#fcd34d;color:#78350f}
.banner.bad{background:var(--badbg);border-color:#fca5a5;color:#7f1d1d}
.banner.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.scope-tag{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.scope-tag.cloud{background:#dcfce7;color:#15803d}
.scope-tag.local{background:#f1f5f9;color:#64748b}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--acc)}
th .sort-ind{font-size:9px;margin-left:3px;opacity:.8}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:12px;color:var(--mut);border-top:1px solid var(--ln);background:var(--pnl2);border-radius:0 0 10px 10px}
.row-actions{white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv b{color:var(--mut);font-weight:650}
.diff-table td,.diff-table th{font-size:12px;vertical-align:top;word-break:break-word}
.diff-table td.chg{background:#fffbeb}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:10000;pointer-events:none;max-width:92vw}
.toast{position:static;transform:none;max-width:100%}
.today-list{display:flex;flex-wrap:wrap;gap:6px}
dialog{max-width:96vw}
.dialog-body{overflow-x:hidden}
@media(max-width:900px){
  .menu-btn{display:inline-block}
  .layout{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:100vh;z-index:120;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shlg);padding-top:14px}
  body.nav-open nav{transform:none}
  body.nav-open .nav-backdrop{display:block;position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:110}
  .nav-search{top:-14px}
  .grid-2{grid-template-columns:1fr}
  header.top h1{font-size:14px}
  header.top .actions .btn-soft{padding:5px 8px}
  .kv{grid-template-columns:1fr}
}
@media(max-width:600px){
  .hide-sm{display:none}
  header.top{position:static;padding:8px 10px;gap:8px}
  header.top .actions{gap:6px}
  header.top .user-badge{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.top .user-badge .role-badge{display:none}
  .sync-badge{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .filter-bar select,.filter-bar input{min-width:0;flex:1 1 130px}
}
@media print{
  header.top,nav,.filter-bar,.pager,.toast-wrap,.page-head button,.page-head .cal-modes,.row-actions,.banner,.nav-backdrop{display:none!important}
  .layout{display:block}
  main{padding:0}
  html,body{background:#fff}
  .table-wrap,.card,.tile{box-shadow:none}
  .table-wrap{overflow:visible}
  table{min-width:0!important}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>ND2 Radiology OS V5.5</h1>
    <p>Hệ điều hành Khoa CĐHA Nhi · BV Nhi Đồng 2</p>
    <label for="login-u">Tên đăng nhập</label>
    <input type="text" id="login-u" placeholder="Tên đăng nhập" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('login-p').focus()">
    <label for="login-p">Mật khẩu</label>
    <input type="password" id="login-p" placeholder="Mật khẩu" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="login-btn" onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="login-err" role="alert"></div>
    <div class="login-meta">
      <span class="login-mode" id="login-mode"></span><br>
      <span id="login-hint"></span>
      <button type="button" onclick="openServerConfig()">⚙️ Cấu hình máy chủ</button>
      <br><span style="opacity:.7" id="login-ver"></span>
    </div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">
      <button class="menu-btn" id="menu-btn" onclick="toggleNav()" aria-label="Mở menu" aria-expanded="false">☰</button>
      <h1>🩻 ND2 <span class="hide-sm">RADIOLOGY </span>OS V5.5</h1>
      <span class="env-badge" id="env-badge" hidden></span>
    </div>
    <div class="actions">
      <button class="user-badge" id="user-info" onclick="openAccount()" title="Tài khoản / đổi mật khẩu"></button>
      <button class="sync-badge" id="sync-badge" onclick="syncBadgeClick()" title="Bấm để đồng bộ ngay">☁️ Sync</button>
      <button class="btn-soft btn-sm" onclick="backup()" title="Tải file sao lưu dữ liệu trên máy này">💾 <span class="hide-sm">Backup</span></button>
      <button class="btn-soft btn-sm" onclick="logout()" title="Đăng xuất">⏻ <span class="hide-sm">Đăng xuất</span></button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="Danh mục chức năng"></nav>
    <div class="nav-backdrop" onclick="toggleNav(false)"></div>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form" onsubmit="event.preventDefault()">
    <div class="dialog-head"><h3 id="dlg-title"></h3><button type="button" class="icon-btn" onclick="closeDlg()" aria-label="Đóng">✕</button></div>
    <div class="dialog-body" id="dlg-body"></div>
    <div class="dialog-foot" id="dlg-foot"></div>
  </form>
</dialog>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script>
'use strict';

/* ============================================================
   ND2 RADIOLOGY OS V5.5 — SINGLE FILE · v5.5.3
   Hợp nhất từ V5 + rs-v4 + cloud-login, đối chiếu backend Code.gs 5.5.3.
   Xem 08_DOCUMENTATION/CHANGELOG.md và ADR-001..004.
   Lưu ý bảo mật: phân quyền ở đây chỉ là giao diện — máy chủ mới là nơi thực thi.
   ============================================================ */
const APP_VERSION = '5.5.3';
const DEPLOY_CFG = (typeof window.ND2_CONFIG === 'object' && window.ND2_CONFIG) || {};

/* ---------- 1. UTILS ---------- */
const $ = (s,r=document)=>r.querySelector(s);

async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// Băm đồng bộ (cyrb53) — dùng nhận biết thay đổi và chuỗi audit cục bộ, KHÔNG dùng cho mật khẩu
function hashStr(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1^ch, 2654435761); h2 = Math.imul(h2^ch, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909);
  h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return (h2>>>0).toString(16).padStart(8,'0') + (h1>>>0).toString(16).padStart(8,'0');
}

// Ô CSV: chống chèn công thức khi mở bằng Excel
function csvCell(v){
  let s = String(v??'');
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return `"${s.replace(/"/g,'""')}"`;
}
function downloadBlob(content, type, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function downloadCSV(rows, name){
  downloadBlob('﻿' + rows.map(l=>l.map(csvCell).join(',')).join('\n'), 'text/csv;charset=utf-8', name);
}

/* ---------- 2. PII GATE (ADR-004) — giữ ĐỒNG BỘ với PII_PATTERNS ở Code.gs ---------- */
const PII_PATTERNS = [
  { r: /(họ\s*(và\s*)?tên|bệnh\s*nhân|bệnh\s*nhi|patient|\bbn)\s*[:=]\s*\S+/i, l: 'tên bệnh nhân' },
  { r: /(sinh\s*ngày|ngày\s*sinh|năm\s*sinh|\bdob\b|date\s*of\s*birth)\s*[:=]?\s*\d/i, l: 'ngày sinh' },
  { r: /\b\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*(19|20)\d{2}\b/, l: 'ngày tháng đầy đủ' },
  { r: /\b\d{8,12}\b/, l: 'số định danh 8-12 chữ số' },
  { r: /\b0\d{2,3}[\s.\-]\d{3}[\s.\-]\d{3,4}\b/, l: 'số điện thoại' },
  { r: /[\w.+\-]+@[\w\-]+\.[\w.\-]+/, l: 'địa chỉ email' },
  { r: /(mã\s*(bn|bệnh\s*nhân|hồ\s*sơ|y\s*tế|lưu\s*trữ)|số\s*(hồ\s*sơ|bệnh\s*án|vào\s*viện|lưu\s*trữ|bhyt|thẻ)|\bmrn\b|\bpid\b|\bcccd\b|\bcmnd\b)\s*[:=#]?\s*[A-Za-z]{0,4}\d{3,}/i, l: 'mã hồ sơ / số định danh' },
  { r: /(^|[^\p{L}])([Đđ]ường|[Pp]hố|[Pp]hường|[Qq]uận|[Hh]uyện|[Tt]ỉnh|[Tt]hị\s+trấn|[Tt]hành\s+phố|T[Pp]\.?)\s+(\d+|\p{Lu}[\p{L}\d]*)/u, l: 'địa chỉ' },
  { r: /(^|[^\p{L}])(Nguyễn|Trần|Lê|Phạm|Hoàng|Huỳnh|Phan|Vũ|Võ|Đặng|Bùi|Đỗ|Hồ|Ngô|Dương|Lý|Đinh|Trương|Đoàn|Trịnh|Đào|Tạ|Châu|Quách|Lương|Vương)\s+\p{Lu}[\p{L}]*/u, l: 'họ tên người' },
  { r: /\b(0008|0010|0020)\s*,\s*[0-9A-Fa-f]{4}\b/, l: 'thẻ DICOM' }
];
function piiScan(text){
  const s = String(text||'');
  for(const p of PII_PATTERNS){
    if(p.r.test(s)) return {ok:false, reason:p.l};
  }
  return {ok:true};
}

/* ---------- 8. AUDIT cục bộ (nhật ký trên máy; audit chính thức nằm ở máy chủ — ADR-002) ---------- */
function audit(action, module, rid, detail){
  const prev = DB.auditLog[0];
  const entry = {
    id: uid(), ts: Date.now(),
    user: CURRENT?.username||'sys', name: CURRENT?.name||'', role: CURRENT?.role||'',
    action, module, recordId: rid||'', detail: String(detail??'').slice(0,300),
    prevHash: prev?.hash || ''
  };
  entry.hash = hashStr([entry.ts,entry.user,entry.role,action,module,entry.recordId,entry.detail,entry.prevHash].join('|'));
  DB.auditLog.unshift(entry);
  if(DB.auditLog.length > 5000) DB.auditLog.length = 5000;
  saveDB(true);
}

// Cấu hình dùng chung (đồng bộ qua module app_config): cấu trúc vị trí lịch, trường tùy chỉnh, tên đơn vị
function cfgGet(id){ const r = (DB.data.app_config||[]).find(x=>x.id===id && !x._deleted); return r ? r.value : undefined; }
function cfgSet(id, value){
  if(!Array.isArray(DB.data.app_config)) DB.data.app_config = [];
  let r = DB.data.app_config.find(x=>x.id===id);
  if(!r){ r = {id, createdAt:Date.now()}; DB.data.app_config.push(r); }
  r.value = value; delete r._deleted; r.updatedAt = Date.now();
}
function normalizeDB(){
  if(!DB.meta || typeof DB.meta!=='object') DB.meta = {};
  if(!DB.data || typeof DB.data!=='object') DB.data = {};
  if(!Array.isArray(DB.auditLog)) DB.auditLog = [];
  DB.v = 5.5;
  Object.keys(SCHEMA).concat(EXTRA_DATA_KEYS).forEach(k=>{ if(!Array.isArray(DB.data[k])) DB.data[k] = []; });
  // Mã bản ghi được chèn vào thuộc tính onclick → chỉ giữ bản ghi có mã hợp lệ. Bản ghi mã lạ (file backup
  // bị sửa tay…) được cất riêng vào _quarantine, không hiển thị, không mất.
  Object.keys(DB.data).forEach(k=>{
    if(k[0]==='_' || !Array.isArray(DB.data[k])) return;
    const bad = [];
    DB.data[k] = DB.data[k].filter(r=>{
      if(r && typeof r==='object' && typeof r.id==='number') r.id = String(r.id);
      if(r && typeof r==='object' && validId(r.id)) return true;
      bad.push(r); return false;
    });
    if(bad.length){ DB.data._quarantine = (DB.data._quarantine||[]).concat(bad.map(r=>({key:k, rec:r}))).slice(-500); }
  });
}

function migrateData(){
  const m = DB.meta;
  if((Number(m.schemaV)||0) >= 1) return;
  // V5 dùng "status" dạng chữ; V5.5 dùng máy trạng thái "state"
  const LV = {'Chờ duyệt':'submitted','Đã duyệt':'approved','Từ chối':'rejected'};
  DB.data.leave_requests.forEach(r=>{ if(r && !r.state) r.state = LV[r.status] || 'draft'; });
  const TK = {'Chưa':'open','Đang':'in_progress','Xong':'done','Trễ':'in_progress'};
  DB.data.task_tracking.forEach(r=>{ if(r && !r.state) r.state = TK[r.status] || 'open'; });
  // V5 có 2 module "Buổi đào tạo" (training, training_sessions) → gộp về training
  const have = new Set(DB.data.training.map(r=>r.id));
  (Array.isArray(DB.data.training_sessions)?DB.data.training_sessions:[]).forEach(r=>{
    if(!r || have.has(r.id)) return;
    DB.data.training.push({...r, hours: r.hours ?? r.duration ?? '', participants: r.participants ?? r.attendees ?? ''});
  });
  delete DB.data.training_sessions;
  // V5 đã chuyển events → meetings thì không chuyển lần nữa
  if(m.mtMigrated) m.mtMigrated55 = true;
  // Cấu trúc vị trí lịch làm việc & trường tùy chỉnh: chuyển sang app_config để đồng bộ giữa các máy
  Object.entries(m.rsLayouts||{}).forEach(([kind, layout])=>{
    if(Array.isArray(layout) && cfgGet('rs_layout_'+kind)===undefined) cfgSet('rs_layout_'+kind, layout);
  });
  delete m.rsLayouts;
  if(DB.data._customFields && Object.keys(DB.data._customFields).length && cfgGet('custom_fields')===undefined){
    cfgSet('custom_fields', DB.data._customFields);
  }
  delete DB.data._customFields;
  m.schemaV = 1;
}
const CF_TYPES = ['text','num','date','textarea','bool'];
function applyCustomFields(){
  const cf = cfgGet('custom_fields') || {};
  Object.keys(SCHEMA).forEach(mod=>{
    if(!SCHEMA[mod].f) return;
    SCHEMA[mod].f = SCHEMA[mod].f.filter(f=>!f.custom);
    (Array.isArray(cf[mod])?cf[mod]:[]).forEach(f=>{
      if(!f || !/^custom_\w{1,40}$/.test(String(f.k)) || SCHEMA[mod].f.some(x=>x.k===f.k)) return;
      SCHEMA[mod].f.push({k:f.k, l:String(f.l||f.k).slice(0,80), t:CF_TYPES.includes(f.t)?f.t:'text', custom:1});
    });
  });
}
async function initDB(){
  let saved = null, loaded = false;
  try{ saved = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(saved){
    try{
      const d = JSON.parse(saved);
      if(!d || typeof d!=='object' || !d.data || typeof d.data!=='object') throw new Error('shape');
      DB = d; loaded = true;
    }catch(e){
      // Không ghi đè dữ liệu hỏng: cất sang khóa khác để còn cứu được
      try{ localStorage.setItem('nd2_v55_corrupt_'+Date.now(), saved); }catch(_){}
    }
  }
  if(!loaded){
    DB = newDB();
    try{
      const old = JSON.parse(localStorage.getItem('nd2_v5')||'null');   // nd2_v5 được GIỮ NGUYÊN để rollback
      if(old && old.data && typeof old.data==='object'){
        DB.data = old.data;
        DB.auditLog = Array.isArray(old.auditLog)?old.auditLog:[];
        DB.meta = Object.assign(DB.meta, old.meta||{}, {migratedFromV5: Date.now()});
      }
    }catch(e){}
  }
  normalizeDB();
  seedIfNeeded();
  migrateData();
  applyCustomFields();
  saveDB(true);
}

/* ---------- 10. AUTH (ADR-001) ---------- */
function loginAttempts(u){
  let all = {}; try{ all = JSON.parse(sessionStorage.getItem('nd2_55_attempts')||'{}')||{}; }catch(e){}
  const now = Date.now();
  return {all, now, list:(all[u]||[]).filter(t=>now-t<60000)};
}
function noteAttempt(u){
  const a = loginAttempts(u); a.list.push(a.now); a.all[u] = a.list;
  sessionStorage.setItem('nd2_55_attempts', JSON.stringify(a.all));
}
async function doLogin(){
  const u = $('#login-u').value.trim(), p = $('#login-p').value;
  const err = $('#login-err'), btn = $('#login-btn');
  err.textContent = '';
  if(!u || !p){ err.textContent = 'Nhập tên đăng nhập và mật khẩu'; return; }
  if(loginAttempts(u).list.length >= 5){ err.textContent = 'Quá nhiều lần thử. Vui lòng đợi 1 phút.'; return; }
  btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
  try{
    await initDB();
    const h = await sha256(p);
    let who = null, offline = false;
    if(isCloud()){
      try{
        // Chỉ gửi tên đăng nhập + băm; KHÔNG gửi shared token (R-04)
        const out = await api('login', {username:u, hash:h}, {auth:false});
        if(out.error || !out.ok || !out.user){ noteAttempt(u); err.textContent = out.error || 'Đăng nhập thất bại'; return; }
        who = out.user; setSession(out.token, out.expiresAt);
        let local = DB.data.users.find(x=>x.username===who.username);
        if(!local){ local = {username:who.username}; DB.data.users.push(local); }
        Object.assign(local, {id:who.id, name:who.name, role:who.role, status:'active', passwordHash:h, cloudVerified:true, onServer:true});
      }catch(e){
        if(e.code !== 'NETWORK'){ err.textContent = e.message; return; }
        offline = true;   // mất mạng: cho phép dùng tài khoản đã từng đăng nhập trên máy này
      }
    }
    if(!who){
      const user = DB.data.users.find(x=>x.username===u);
      if(!user || (isCloud() && !user.cloudVerified)){
        noteAttempt(u);
        err.textContent = isCloud() ? 'Không kết nối được máy chủ. Tài khoản này chưa từng đăng nhập trên máy này nên không dùng ngoại tuyến được.' : 'Tài khoản không tồn tại';
        return;
      }
      if(user.status !== 'active'){ err.textContent = 'Tài khoản đã bị khóa'; return; }
      if(!user.passwordHash || h !== user.passwordHash){
        noteAttempt(u);
        audit('login_fail','system',user.id,'Sai mật khẩu');
        err.textContent = 'Sai mật khẩu';
        return;
      }
      who = user; clearSession();
    }
    if(!ROLES[who.role]){ err.textContent = 'Vai trò tài khoản không hợp lệ'; clearSession(); return; }
    CURRENT = {id:who.id, username:who.username, name:who.name, role:who.role, offline, weak:h===DEFAULT_PW_HASH};
    sessionStorage.setItem('nd2_55_user', JSON.stringify(CURRENT));
    const lu = DB.data.users.find(x=>x.username===who.username);
    if(lu) lu.lastLogin = Date.now();
    saveDB(true);
    audit('login','system',who.id, offline?'Đăng nhập ngoại tuyến':'Đăng nhập');
    $('#login-p').value = '';
    await enterApp();
  }finally{
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}
async function logout(){
  const pend = isCloud() ? pendingSummary().total : 0;
  if(pend && sessionToken()){
    try{ await Promise.race([syncNow({pull:false, quiet:true}), new Promise(r=>setTimeout(r,6000))]); }catch(e){}
  }
  const left = isCloud() ? pendingSummary().total : 0;
  if(left && !confirm(`Còn ${left} thay đổi chưa đồng bộ lên máy chủ. Dữ liệu vẫn nằm trên máy này và sẽ được đẩy ở lần đăng nhập sau. Vẫn đăng xuất?`)) return;
  audit('logout','system',CURRENT?.id||'','');
  if(sessionToken() && isCloud()){
    try{ await Promise.race([api('logout'), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  }
  clearSession();
  sessionStorage.removeItem('nd2_55_user');
  CURRENT = null;
  location.reload();
}

async function changePassword(){
  const o = $('#pw-old').value, n = $('#pw-new').value, n2 = $('#pw-new2').value;
  if(!o || !n){ toast('Nhập mật khẩu hiện tại và mật khẩu mới'); return; }
  if(n.length < MIN_PW){ toast(`Mật khẩu mới phải ≥ ${MIN_PW} ký tự`); return; }
  if(n !== n2){ toast('Hai lần nhập mật khẩu mới không khớp'); return; }
  if(n === o){ toast('Mật khẩu mới phải khác mật khẩu cũ'); return; }
  const oh = await sha256(o), nh = await sha256(n);
  const local = DB.data.users.find(x=>x.username===CURRENT.username);
  if(isCloud()){
    if(!sessionToken()){ toast('Cần kết nối máy chủ để đổi mật khẩu'); return; }
    const btn = $('#pw-save'); btn.disabled = true;
    try{
      const out = await api('changePassword', {oldHash:oh, newHash:nh});
      if(out.error){ toast(out.detail || out.error); return; }
      setSession(out.token, out.expiresAt);
    }catch(e){ toast('Lỗi: '+e.message); return; }
    finally{ btn.disabled = false; }
  } else if(!local || local.passwordHash !== oh){ toast('Mật khẩu hiện tại không đúng'); return; }
  if(local) local.passwordHash = nh;
  CURRENT.weak = false; sessionStorage.setItem('nd2_55_user', JSON.stringify(CURRENT));
  saveDB(true); audit('password_change','system',CURRENT.id,'');
  closeDlg(); toast('Đã đổi mật khẩu'); route(CUR_ROUTE);
}

/* ---------- 11. API & ĐỒNG BỘ (ADR-003) ---------- */
class ApiError extends Error { constructor(code, msg){ super(msg||code); this.code = code; } }
async function api(action, payload, opts){
  const url = apiUrl();
  if(!url) throw new ApiError('NO_URL', 'Chưa cấu hình máy chủ');
  const body = Object.assign({action}, payload||{});
  if(!opts || opts.auth !== false){
    const t = sessionToken();
    if(!t) throw new ApiError('NO_SESSION', 'Chưa có phiên máy chủ — hãy đăng xuất và đăng nhập lại');
    body.sessionToken = t;                       // token nằm trong thân POST, không bao giờ trên URL (S-07)
  }
  let res, out;
  try{ res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)}); }
  catch(e){ throw new ApiError('NETWORK', 'Không kết nối được máy chủ'); }
  try{ out = await res.json(); }
  catch(e){ throw new ApiError('NOT_JSON', 'Máy chủ không trả JSON — kiểm tra URL Web App (…/exec) và quyền truy cập "Anyone"'); }
  if(out && out.error === 'unauthorized'){ onSessionLost(); throw new ApiError('UNAUTHORIZED', 'Phiên máy chủ đã hết hạn — hãy đăng nhập lại'); }
  if(out && out.error === 'INTERNAL_ERROR') throw new ApiError('SERVER', 'Máy chủ gặp lỗi nội bộ');
  if(out && out.error === 'BUSY') throw new ApiError('BUSY', 'Máy chủ đang bận, thử lại sau ít giây');
  return out;
}
function onSessionLost(){
  if(!sessionToken()) return;
  clearSession();
  setSyncBadge('err', 'Hết phiên');
  toast('Phiên máy chủ đã hết hạn. Dữ liệu vẫn lưu trên máy — đăng xuất rồi đăng nhập lại để đồng bộ.', 6000);
}

// Module đồng bộ với máy chủ = phần giao giữa form của V5.5 và allowlist của Code.gs.
// Mọi module khác chỉ lưu trên máy này (giao diện có ghi chú rõ).
const SYNC_KEYS = [
  'staff','cases','report_templates','diseases','imaging_signs','protocols','licenses','assets','maintenance',
  'indicators','risks','quality_events','training','research_projects','strategy_plan','annual_plans',
  'meeting_minutes','task_tracking','monthly_reports','budget','supplies','inventory_transactions','suppliers',
  'daily_volumes','modality_production','staff_production','tat_tracking',
  'roster','duty_month','meetings','leave_requests','capa','rca','equipment_incidents','calibration',
  'repairs','downtime','personal_dosimeters','app_config'
];
const SERVER_NAME = {training:'training_sessions'};
const CLIENT_NAME = {training_sessions:'training'};
const LOCAL_ONLY_FIELDS = {cases:['images']};     // ảnh ca lâm sàng chỉ lưu trên máy (quá lớn cho 1 ô Sheets, và để giảm rủi ro lộ thông tin)
const PERM_KEYS_OF = {meetings:['calendar'], roster:['roster_doctor','roster_tech','roster_after']};
const isSynced = key=>SYNC_KEYS.includes(key);
function canWriteData(key){
  if(isAdmin()) return true;
  if(key === 'app_config') return false;
  return (PERM_KEYS_OF[key]||[key]).some(k=>can(k,'c')||can(k,'u')||can(k,'d'));
}

// Nội dung chuẩn hóa của bản ghi — CÙNG quy tắc với _contentOf/_canon ở Code.gs
const META_KEYS = {updatedAt:1, updatedBy:1, createdAt:1, createdBy:1, version:1};
function sortDeep(v){
  if(Array.isArray(v)) return v.map(sortDeep);
  if(v && typeof v==='object'){ const o = {}; Object.keys(v).sort().forEach(k=>{ o[k] = sortDeep(v[k]); }); return o; }
  return v;
}
function contentOf(key, o){
  const skip = LOCAL_ONLY_FIELDS[key]||[], c = {};
  Object.keys(o||{}).forEach(k=>{
    if(META_KEYS[k] || skip.includes(k)) return;
    if(k[0]==='_' && k!=='_deleted') return;
    const v = o[k];
    if(v===undefined || v===null || v==='' || v===false) return;
    c[k] = v;
  });
  return c;
}
const recHash = (key, o)=>hashStr(JSON.stringify(sortDeep(contentOf(key, o))));
function isDirty(key, r){
  if(!r || r.synthetic || !validId(r.id)) return false;
  if(!r.version) return !r._deleted;            // chưa từng lên máy chủ; đã xóa trước khi đồng bộ thì bỏ qua
  return recHash(key, r) !== r._h;
}
function pendingRecords(){
  const out = {};
  if(!CURRENT) return out;
  SYNC_KEYS.forEach(key=>{
    if(!canWriteData(key)) return;
    const list = (DB.data[key]||[]).filter(r=>{
      if(!isDirty(key, r)) return false;
      if(r._rej && r._rej.h === recHash(key, r)) return false;    // máy chủ đã từ chối đúng nội dung này → không gửi lặp
      if(r._conflict) return false;                               // đang chờ người dùng xử lý xung đột
      return true;
    });
    if(list.length) out[key] = list;
  });
  return out;
}
function pendingSummary(){
  const p = pendingRecords(), byKey = {};
  let total = 0;
  Object.keys(p).forEach(k=>{ byKey[k] = p[k].length; total += p[k].length; });
  return {total, byKey};
}
function wireRecord(key, r){
  const skip = LOCAL_ONLY_FIELDS[key]||[], c = {};
  Object.keys(r).forEach(k=>{
    if(skip.includes(k) || k==='passwordHash' || k==='token' || k==='session') return;
    if(k[0]==='_' && k!=='_deleted' && k!=='_deletedAt') return;
    c[k] = r[k];
  });
  c.version = r.version||0;
  return c;
}

  approval_requires_admin:'Chỉ quản trị được duyệt/từ chối đơn', locked_after_submit:'Không sửa được ngày/loại sau khi đã gửi duyệt',
  invalid_transition:'Chuyển trạng thái không hợp lệ', invalid_state:'Trạng thái không hợp lệ', missing_fields:'Thiếu trường bắt buộc',
  invalid_dates:'Ngày kết thúc trước ngày bắt đầu', record_too_large:'Bản ghi quá lớn (> 45.000 ký tự)', invalid_id:'Mã bản ghi không hợp lệ',
  duplicate_in_batch:'Trùng mã trong cùng lô', invalid_record:'Bản ghi không hợp lệ',
  sheet_missing:'Máy chủ chưa tạo sheet (quản trị chạy setupV55_apply)', header_mismatch:'Sheet trên máy chủ sai tiêu đề cột',

async function syncPush(){
  const pend = pendingRecords();
  const sum = {sent:0, added:0, updated:0, noop:0, conflicts:0, rejected:0, modulesRejected:[]};
  // Chia lô: tối đa 200 bản ghi hoặc ~1,2 MB mỗi lần gửi (máy chủ giới hạn 500 / 2 MB)
  const chunks = []; let cur = {data:{}, n:0, bytes:0, hashes:{}};
  Object.keys(pend).forEach(key=>{
    pend[key].forEach(r=>{
      const w = wireRecord(key, r), size = JSON.stringify(w).length;
      if(cur.n && (cur.n >= 200 || cur.bytes + size > 1200000)){ chunks.push(cur); cur = {data:{}, n:0, bytes:0, hashes:{}}; }
      const mod = SERVER_NAME[key]||key;
      (cur.data[mod] = cur.data[mod]||[]).push(w);
      (cur.hashes[key] = cur.hashes[key]||{})[r.id] = recHash(key, r);
      cur.n++; cur.bytes += size;
    });
  });
  if(cur.n) chunks.push(cur);
  for(const ch of chunks){
    const out = await api('batchUpsert', {data: ch.data});
    if(!out || (!out.stats && out.error)) throw new ApiError(out?.error||'PUSH', 'Máy chủ từ chối lô dữ liệu: ' + (out?.error||'không rõ') + (out?.detail?' ('+out.detail+')':''));
    sum.sent += ch.n;
    const st = out.stats||{};
    sum.added += st.added||0; sum.updated += st.updated||0; sum.noop += st.noop||0;
    Object.entries(out.applied||{}).forEach(([mod, ids])=>{
      const key = CLIENT_NAME[mod]||mod, list = DB.data[key]||[];
      Object.entries(ids).forEach(([id, ver])=>{
        const r = list.find(x=>x.id===id); if(!r) return;
        r.version = ver; r._h = ch.hashes[key]?.[id]; delete r._rej;   // nếu người dùng sửa tiếp trong lúc gửi, băm sẽ khác → vẫn "chờ đẩy"
      });
    });
    (st.conflicts||[]).forEach(c=>{
      const key = CLIENT_NAME[c.module]||c.module, r = (DB.data[key]||[]).find(x=>x.id===c.id);
      if(r){ r._conflict = true; sum.conflicts++; }
    });
    (st.rejectedRecords||[]).forEach(x=>{
      const key = CLIENT_NAME[x.module]||x.module, r = (DB.data[key]||[]).find(y=>y.id===x.id);
      if(r){ r._rej = {reason:x.reason, h:ch.hashes[key]?.[x.id], ts:Date.now()}; sum.rejected++; }
    });
    (st.rejected||[]).forEach(x=>{
      const key = CLIENT_NAME[x.module]||x.module;
      sum.modulesRejected.push(`${SCHEMA[key]?.n||key}: ${REJECT_LABEL[x.reason]||x.reason}`);
      (ch.data[x.module]||[]).forEach(w=>{
        const r = (DB.data[key]||[]).find(y=>y.id===w.id);
        if(r){ r._rej = {reason:x.reason, h:ch.hashes[key]?.[w.id], ts:Date.now()}; sum.rejected++; }
      });
    });
    saveDB(true);
  }
  return sum;
}

function addConflict(key, id, server){
  if(!Array.isArray(DB.data._conflicts)) DB.data._conflicts = [];
  DB.data._conflicts = DB.data._conflicts.filter(c=>!(c.key===key && c.id===id));
  DB.data._conflicts.push({key, id, server, ts:Date.now()});
}
function mergeModule(key, rows){
  const list = Array.isArray(DB.data[key]) ? DB.data[key] : (DB.data[key] = []);
  const idx = new Map(list.map((r,i)=>[r.id, i]));
  const skip = LOCAL_ONLY_FIELDS[key]||[];
  let added = 0, updated = 0, conflicts = 0;
  rows.forEach(c=>{
    if(!c || typeof c!=='object' || !validId(c.id)) return;    // bỏ qua bản ghi có mã lạ (phòng chèn mã độc qua id)
    const h = recHash(key, c), i = idx.get(c.id);
    if(i === undefined){ c._h = h; idx.set(c.id, list.length); list.push(c); added++; return; }
    const l = list[i], lh = recHash(key, l);
    const keep = {}; skip.forEach(f=>{ if(l[f] !== undefined) keep[f] = l[f]; });
    if(l._discard || !isDirty(key, l) || lh === h){
      if(lh !== h) updated++;
      list[i] = Object.assign({}, c, keep, {_h:h});
      DB.data._conflicts = (DB.data._conflicts||[]).filter(x=>!(x.key===key && x.id===c.id));
      return;
    }
    // Trên máy đã sửa VÀ máy chủ cũng có bản mới hơn → xung đột, giữ bản trên máy cho tới khi người dùng chọn
    if((c.version||0) > (l.version||0)){ l._conflict = true; addConflict(key, c.id, c); conflicts++; }
  });
  return {added, updated, conflicts};
}
function mergeUsers(rows){
  rows.forEach(c=>{
    if(!c || !validId(String(c.id)) || !c.username) return;
    let l = DB.data.users.find(x=>x.id===c.id) || DB.data.users.find(x=>x.username===c.username);
    if(!l){ l = {}; DB.data.users.push(l); }
    Object.assign(l, {id:c.id, username:c.username, name:c.name, role:c.role, status:c.status, lastLogin:c.lastLogin||l.lastLogin||0, createdAt:c.createdAt||0, onServer:true, hasPassword:!!c.hasPassword});
  });
}
const cursorKey = ()=>'nd2_55_cursor_' + (CURRENT?.username||'');
async function syncPull(full){
  const since = full ? 0 : (Number(localStorage.getItem(cursorKey()))||0);
  const out = await api('pull', {since});
  if(!out || out.error) throw new ApiError(out?.error||'PULL', 'Không tải được dữ liệu: ' + (out?.error||'không rõ'));
  const sum = {added:0, updated:0, conflicts:0, full:!since};
  Object.entries(out.data||{}).forEach(([mod, rows])=>{
    if(!Array.isArray(rows)) return;
    const key = CLIENT_NAME[mod]||mod;
    if(key === 'users'){ if(isAdmin()) mergeUsers(rows); return; }
    if(!isSynced(key)) return;                               // R-15: chỉ nhận module trong danh sách đồng bộ
    const r = mergeModule(key, rows.map(x=>{ const c = Object.assign({}, x); delete c.passwordHash; delete c.serverHash; return c; }));
    sum.added += r.added; sum.updated += r.updated; sum.conflicts += r.conflicts;
  });
  if(out.ts) localStorage.setItem(cursorKey(), String(out.ts));
  applyCustomFields();
  saveDB(true);
  return sum;
}
async function syncNow(o){
  o = o||{};
  if(!CURRENT) return false;
  if(!isCloud()){ if(!o.quiet) toast('Chưa cấu hình máy chủ — dữ liệu chỉ lưu trên máy này'); return false; }
  if(!sessionToken()){ paintSyncBadge(); if(!o.quiet) toast('Chưa có phiên máy chủ — đăng xuất rồi đăng nhập lại để đồng bộ'); return false; }
  if(SYNC.busy){ SYNC.again = true; return false; }
  const pend = pendingSummary().total;
  if(!pend && !o.pull){ paintSyncBadge(); return true; }
  SYNC.busy = true; clearTimeout(SYNC.timer);
  setSyncBadge('', 'Đang đồng bộ…');
  let changed = false;
  try{
    const p = await syncPush();
    let q = null;
    if(o.pull || p.conflicts) q = await syncPull(!!o.full);
    SYNC.lastOk = Date.now();
    const parts = [];
    if(p.sent) parts.push(`đẩy ${p.added} thêm, ${p.updated} sửa` + (p.noop?`, ${p.noop} không đổi`:''));
    if(q) parts.push(`tải về ${q.added} thêm, ${q.updated} sửa` + (q.full?' (toàn bộ)':''));
    const conf = (DB.data._conflicts||[]).length;
    if(conf) parts.push(`${conf} xung đột`);
    if(p.rejected) parts.push(`${p.rejected} bị từ chối`);
    if(p.modulesRejected.length) parts.push(p.modulesRejected.join('; '));
    if(p.sent || (q && (q.added||q.updated)) || conf || p.rejected || !o.quiet){
      addSyncLog('sync', parts.join(' · ')||'Không có thay đổi', !(conf||p.rejected)); saveDB(true);
    }
    if(!o.quiet) toast(conf||p.rejected ? '⚠️ Đồng bộ xong, còn ' + [conf?conf+' xung đột':'', p.rejected?p.rejected+' bị từ chối':''].filter(Boolean).join(', ') : '✅ Đã đồng bộ');
    else if(p.rejected) toast(`⚠️ ${p.rejected} thay đổi bị máy chủ từ chối — xem Sync Center`, 5000);
    changed = !!(q && (q.added||q.updated||q.conflicts)) || !!p.conflicts || !!p.rejected;
  }catch(e){
    addSyncLog('sync', 'Lỗi: ' + e.message, false); saveDB(true);
    if(!o.quiet) toast('Lỗi đồng bộ: ' + e.message, 5000);
    SYNC.busy = false; paintSyncBadge();
    if(e.code !== 'UNAUTHORIZED' && sessionToken()) setSyncBadge('err', 'Lỗi đồng bộ');
    return false;
  }
  SYNC.busy = false;
  paintSyncBadge();
  if(changed) refreshView();
  if(SYNC.again){ SYNC.again = false; scheduleSync(600); }
  return true;
}
// Vẽ lại màn hình hiện tại sau khi có dữ liệu mới — không làm gián đoạn người đang nhập liệu
function refreshView(){
  if(!CURRENT) return;
  renderNav();
  const ae = document.activeElement;
  const typing = ae && $('#view').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if($('#dlg').open || typing) return;
  const y = window.scrollY;
  route(CUR_ROUTE);
  window.scrollTo(0, y);
}
function resolveConflict(i, choice){
  const c = (DB.data._conflicts||[])[i]; if(!c) return;
  const list = DB.data[c.key]||[], li = list.findIndex(x=>x.id===c.id);
  if(choice === 'server'){
    const keep = {}; (LOCAL_ONLY_FIELDS[c.key]||[]).forEach(f=>{ if(li>=0 && list[li][f]!==undefined) keep[f] = list[li][f]; });
    const rec = Object.assign({}, c.server, keep, {_h:recHash(c.key, c.server)});
    if(li>=0) list[li] = rec; else list.push(rec);
    audit('conflict_server', c.key, c.id, 'Lấy bản máy chủ');
  } else if(li>=0){
    list[li].version = c.server.version||0;     // ghi đè có chủ ý: lần đẩy sau sẽ thành bản mới nhất
    delete list[li]._conflict; delete list[li]._rej;
    audit('conflict_local', c.key, c.id, 'Giữ bản trên máy');
  }
  DB.data._conflicts.splice(i, 1);
  applyCustomFields(); saveDB(); renderNav(); renderConflicts(); toast('Đã xử lý xung đột');
}
function retryRejected(key, id){
  const r = (DB.data[key]||[]).find(x=>x.id===id); if(!r) return;
  delete r._rej; saveDB(); renderSyncCenter(); toast('Sẽ thử đẩy lại');
}
async function discardLocal(key, id){
  const list = DB.data[key]||[], i = list.findIndex(x=>x.id===id); if(i<0) return;
  if(!confirm('Bỏ thay đổi trên máy này của bản ghi và lấy lại bản trên máy chủ?')) return;
  if(!list[i].version) list.splice(i, 1);       // chưa từng lên máy chủ → xóa bản trên máy
  else { list[i]._discard = true; delete list[i]._rej; }
  audit('discard_local', key, id, '');
  saveDB(true);
  try{ await syncPull(true); }catch(e){ toast('Lỗi: '+e.message); }
  renderSyncCenter(); renderNav();
}

/* ---------- 12. BACKUP / RESTORE (A-01, A-02) ---------- */
function backupData(){
  const safe = JSON.parse(JSON.stringify(DB));
  (safe.data.users||[]).forEach(u=>{ delete u.passwordHash; });   // không bao giờ xuất băm mật khẩu
  return JSON.stringify(safe, null, 2);
}
function backup(){
  downloadBlob(backupData(), 'application/json', 'ND2_V55_BACKUP_' + localDate() + '.json');
  audit('export','backup','','');
  toast('Đã backup (đã loại bỏ hash mật khẩu)');
}
function doRestore(){
  const f = $('#restore-file').files[0];
  if(!f){ toast('Chọn file backup'); return; }
  if(!confirm('Ghi đè toàn bộ dữ liệu trên máy này bằng file backup? Một bản sao lưu hiện trạng sẽ được tải xuống trước.')) return;
  const r = new FileReader();
  r.onload = evt => {
    try{
      const data = JSON.parse(evt.target.result);
      // A-02: kiểm tra cấu trúc & phiên bản trước khi ghi đè
      if(!data || typeof data!=='object' || !data.v || !data.data || typeof data.data!=='object'){ toast('File không hợp lệ (thiếu v/data)'); return; }
      if(data.v !== 5.5 && data.v !== 5){
        if(!confirm(`File có version ${data.v}, không khớp 5.5. Tiếp tục?`)) return;
      }
      downloadBlob(backupData(), 'application/json', 'ND2_V55_TRUOC_RESTORE_' + localDate() + '.json');
      // Ưu tiên băm mật khẩu ĐANG CÓ trên máy theo username. KHÔNG gán mật khẩu mặc định cho ai cả.
      const oldUsers = DB.data.users||[];
      const users = Array.isArray(data.data.users) ? data.data.users : [];
      users.forEach(u=>{
        const o = oldUsers.find(x=>x.username===u.username);
        if(o && o.passwordHash){ u.passwordHash = o.passwordHash; u.cloudVerified = o.cloudVerified; }
        else if(!/^[0-9a-f]{64}$/.test(String(u.passwordHash||''))) delete u.passwordHash;   // backup V5 cũ có thể còn băm hợp lệ
      });
      oldUsers.forEach(o=>{ if(!users.some(u=>u.username===o.username)) users.push(o); });   // không tự khóa mình khỏi máy
      data.data.users = users;
      DB = data;
      normalizeDB(); migrateData(); applyCustomFields();
      Object.keys(localStorage).filter(k=>k.startsWith('nd2_55_cursor_')).forEach(k=>localStorage.removeItem(k));   // lần đồng bộ sau tải lại toàn bộ
      saveDB(true);
      audit('import','backup','','Restore từ ' + String(f.name).slice(0,80));
      renderNav(); route('dash_executive');
      toast('Đã restore. Tài khoản không có mật khẩu trên máy cần đăng nhập qua máy chủ hoặc được quản trị đặt lại.', 6000);
      if(isCloud() && sessionToken()) syncNow({pull:true, full:true, quiet:true});
    }catch(e){ toast('Lỗi: '+e.message); }
  };
  r.readAsText(f);
}

let RS_WEEK = {doctor:rsWeekStart(new Date()), tech:rsWeekStart(new Date()), after:rsWeekStart(new Date())};
let RS_MONTH = localDate().slice(0,7);

function rsNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');}
function rsWeekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return localDate(x);}
function rsDays(ws){const d0=new Date(ws+'T00:00:00');return Array.from({length:7},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return d;});}
function rsFmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function rsISOWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);}
function rsShort(code){const s=(DB.data.staff||[]).find(x=>x.empCode===code&&!x._deleted);return s?(s.short||s.fullName||code):code;}
function rsChipText(e){return e.startsWith('~')?e.slice(1):rsShort(e);}
function rsLeaveHit(code,ds){return (DB.data.leave_requests||[]).some(l=>!l._deleted&&l.state==='approved'&&l.empCode===code&&l.startDate<=ds&&ds<=l.endDate);}
// Cấu trúc mặc định dùng mã vị trí CỐ ĐỊNH (không ngẫu nhiên): mọi máy sinh ra cùng một cấu trúc nên
// phân công đồng bộ giữa các máy khớp nhau. Khi Quản trị sửa, cấu trúc được lưu vào app_config (đồng bộ).
function rsDefaultLayout(kind){
  return RS_DEFAULT[kind].map((s,si)=>({id:`${kind}_s${si}`, label:s.label, color:s.color,
    rows:s.rows.map((r,ri)=>({id:`${kind}_s${si}r${ri}`, label:r}))}));
}
function rsLayout(kind){
  const v = cfgGet('rs_layout_'+kind);
  if(!Array.isArray(v)) return rsDefaultLayout(kind);
  // Mã vị trí được chèn vào thuộc tính onclick → chỉ nhận mã hợp lệ
  return v.filter(s=>s && validId(s.id) && Array.isArray(s.rows)).map(s=>({id:s.id, label:String(s.label||''), color:s.color,
    rows:s.rows.filter(r=>r && validId(r.id)).map(r=>({id:r.id, label:String(r.label||'')}))}));
}
function rsRows(kind){
  const out = [];
  rsLayout(kind).forEach(sec=>{
    const c = RS_COLORS[sec.color]||RS_COLORS.gray;
    sec.rows.forEach((row,j)=>out.push({rid:row.id,label:row.label,sec:sec.label,color:c.color,bar:c.bar,first:j===0,size:sec.rows.length}));
  });
  return out;
}
function rsFindRow(label,kind){
  const k = rsNorm(label);
  for(const sec of rsLayout(kind)) for(const row of sec.rows) if(rsNorm(row.label)===k) return {sec,row};
  return null;
}
function rsRec(kind,ws){return (DB.data.roster||[]).find(r=>!r._deleted&&r.weekStart===ws&&(r.kind||'doctor')===kind);}
function rsEnsure(kind,ws){
  if(!DB.data.roster) DB.data.roster = [];
  let r = rsRec(kind,ws);
  // Mã cố định theo loại lịch + tuần: hai máy cùng tạo một tuần sẽ thành xung đột có thể xử lý, không thành 2 bản ghi trùng
  if(!r){ r = {id:`rw_${kind}_${ws}`,kind,weekStart:ws,cells:{},notes:'',createdAt:Date.now(),updatedAt:Date.now(),createdBy:CURRENT?.username}; DB.data.roster.push(r); }
  return r;
}
function rsConflicts(kind,r){
  const bad = {}, rows = rsRows(kind).filter(x=>!RS_KINDS[kind].noConflict.includes(x.label));
  for(let day=0;day<7;day++){
    const seen = {};
    rows.forEach(row=>{
      const key = row.rid+'|'+day;
      (r.cells[key]||[]).filter(e=>!e.startsWith('~')).forEach(code=>{
        if(seen[code]){ bad[key]=true; bad[seen[code]]=true; } else seen[code]=key;
      });
    });
  }
  return bad;
}
function rsRenderWeek(kind){

      <button class="btn-soft btn-sm" onclick="rsExportWeek('${kind}')">📤 CSV</button>

    </div></div>
  <div class="table-wrap"><table style="min-width:960px;font-size:12px"><thead><tr>
    <th colspan="2" style="min-width:170px">Vị trí</th>
    ${days.map((d,i)=>`<th style="text-align:center;${i>=5?'background:#fff7ed;':''}">${RS_DOW[i]}<br><small>${rsFmt(d)}</small></th>`).join('')}

    h += `<td style="font-weight:600;background:${row.color};white-space:nowrap">${esc(row.label)}</td>`;
    for(let day=0;day<7;day++){
      const key = row.rid+'|'+day, list = r.cells[key]||[], ds = localDate(days[day]);
      const chips = list.map(e=>{

        const lv = rsLeaveHit(e,ds);
        return `<span class="badge ${lv?'bad':'info'}" style="margin:1px">${lv?'⚠ ':''}${esc(rsShort(e))}</span>`;
      }).join('');
      const st = `min-width:96px;${conf[key]?'box-shadow:inset 0 0 0 2px var(--bad);':''}${day>=5?'background:#fffaf3;':''}${canE?'cursor:pointer;':''}`;
      h += `<td ${canE?`onclick="rsEditCell('${kind}','${row.rid}',${day})"`:''} style="${st}">${chips||(canE?'<span style="color:#cbd5e1">+</span>':'')}</td>`;
    }
    h += '</tr>';
  });
  h += `</tbody></table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
    <div class="card"><h3>Ghi chú</h3><textarea rows="5" ${canE?'':'disabled'} onchange="rsNotes('${kind}',this.value)">${esc(r.notes||'')}</textarea></div>
    <div class="card"><h3>Chú thích</h3><div style="font-size:12px;line-height:2">
      <span class="badge info">Tên</span> đã phân công &nbsp;
      <span class="badge warn">Tên</span> ngoài danh sách &nbsp;
      <span class="badge bad">⚠ Tên</span> có đơn nghỉ đã duyệt<br>
      <span style="box-shadow:inset 0 0 0 2px var(--bad);padding:0 6px">Ô viền đỏ</span> trùng người trong ngày
    </div></div>
  </div>`;
  $('#view').innerHTML = h;
}
function rsShift(kind,n){const d = new Date(RS_WEEK[kind]+'T00:00:00'); d.setDate(d.getDate()+n); RS_WEEK[kind] = localDate(d); rsRenderWeek(kind);}
function rsToday(kind){RS_WEEK[kind] = rsWeekStart(new Date()); rsRenderWeek(kind);}
function rsNotes(kind,v){const r = rsEnsure(kind,RS_WEEK[kind]); r.notes = v; r.updatedAt = Date.now(); saveDB(); toast('Đã lưu');}
function rsCopyPrev(kind){
  const prev = new Date(RS_WEEK[kind]+'T00:00:00'); prev.setDate(prev.getDate()-7);
  const src = rsRec(kind,localDate(prev));
  if(!src){ toast('Tuần trước chưa có lịch'); return; }
  if(rsRec(kind,RS_WEEK[kind]) && !confirm('Tuần này đã có lịch. Ghi đè?')) return;
  const r = rsEnsure(kind,RS_WEEK[kind]);
  r.cells = JSON.parse(JSON.stringify(src.cells)); r.updatedAt = Date.now(); saveDB();
  rsRenderWeek(kind); toast('Đã sao chép');
}
function rsExportWeek(kind){
  const ws = RS_WEEK[kind], days = rsDays(ws), r = rsRec(kind,ws)||{cells:{}};
  const head = ['Nhóm','Vị trí',...days.map((d,i)=>RS_DOW[i]+' '+rsFmt(d))];
  const lines = rsRows(kind).map(row=>[row.sec,row.label,...days.map((_,day)=>(r.cells[row.rid+'|'+day]||[]).map(rsChipText).join(' / '))]);
  rsCSV([head,...lines], `${RS_KINDS[kind].key}_${ws}.csv`);
}
function rsPick(title, cur, onSave){
  const staff = (DB.data.staff||[]).filter(s=>!s._deleted).sort((a,b)=>String(a.empCode).localeCompare(String(b.empCode)));
  const picked = cur.filter(e=>!e.startsWith('~')), free = cur.filter(e=>e.startsWith('~')).map(e=>e.slice(1)).join(', ');

    || '<div class="empty">Chưa có nhân sự</div>'}</div>

  $('#dlg-foot').innerHTML = `<button type="button" class="btn-soft" onclick="closeDlg()">Hủy</button><button type="button" class="btn" id="rs-save">💾 Lưu</button>`;

    h += `<div class="table-wrap"><table style="min-width:${150+dim*46}px;font-size:11px"><thead><tr><th style="min-width:130px">Vị trí</th>`;
    for(let d=1;d<=dim;d++){const dow = (new Date(y,m-1,d).getDay()+6)%7; h += `<th style="text-align:center;${dow>=5?'background:#fff7ed;':''}">${d}<br><small>${['T2','T3','T4','T5','T6','T7','CN'][dow]}</small></th>`;}
    h += `</tr></thead><tbody>`;
    rows.forEach(row=>{
      h += `<tr><td style="background:${row.color};font-weight:600;white-space:nowrap">${esc(row.label)}</td>`;

        const chips = list.map(e=>{
          if(e.startsWith('~')) return `<span class="badge warn" style="margin:1px">${esc(e.slice(1))}</span>`;
          const p = byP[e]||{days:{}};

          return `<span class="badge ${dup?'bad':near?'warn':'info'}" style="margin:1px">${esc(rsShort(e))}</span>`;
        }).join('');
        h += `<td ${canE?`onclick="rsDutyEdit('${row.rid}',${d})" style="cursor:pointer;`:'style="'}min-width:80px;${dow>=5?'background:#fffaf3;':''}">${chips||(canE?'<span style="color:#cbd5e1">+</span>':'')}</td>`;
      }
      h += '</tr>';
    });

      ${Object.keys(byP).length?`<table style="font-size:12px"><thead><tr><th>Nhân viên</th><th>Số ca</th><th>Số ngày</th></tr></thead><tbody>${
        Object.keys(byP).sort((a,b)=>byP[b].count-byP[a].count).map(c=>`<tr><td>${esc(rsShort(c))}</td><td><b>${byP[c].count}</b></td><td>${Object.keys(byP[c].days).length}</td></tr>`).join('')

function rsMonthShift(n){
  if(n===0) RS_MONTH = localDate().slice(0,7);
  else{const [y,m] = RS_MONTH.split('-').map(Number); const d = new Date(y,m-1+n,1); RS_MONTH = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

}
function rsDutyEdit(rid,d){

  const cur = (rsDutyRec()||{cells:{}}).cells[rid+'|'+d]||[];
  rsPick(`${row.label} · ngày ${d}/${RS_MONTH.split('-')[1]}`, cur, list=>{
    const r = rsDutyEnsure(), key = rid+'|'+d;

function rsDutyFromWeeks(){
  const [y,m] = RS_MONTH.split('-').map(Number), dim = new Date(y,m,0).getDate();
  if(!confirm('Điền lịch trực từ lịch BS các tuần?')) return;
  const r = rsDutyEnsure(), rows = rsDutyRows(); let n = 0;
  for(let d=1;d<=dim;d++){
    const dt = new Date(y,m-1,d), wk = rsRec('doctor',rsWeekStart(dt)); if(!wk) continue;
    const di = (dt.getDay()+6)%7;
    rows.forEach(row=>{
      const list = wk.cells[row.rid+'|'+di], key = row.rid+'|'+d;
      if(list&&list.length){ r.cells[key] = [...list]; n++; } else delete r.cells[key];

function rsDutyExport(){

  const head = ['Vị trí',...Array.from({length:dim},(_,i)=>String(i+1))];
  const lines = rsDutyRows().map(row=>[row.label,...Array.from({length:dim},(_,i)=>(rec.cells[row.rid+'|'+(i+1)]||[]).map(rsChipText).join(' / '))]);

}

let RS_IK = 'doctor', RS_IMP = null, RS_LK = 'doctor', RS_LEDIT = [];
// Nhân viên có được xếp vào vị trí làm việc (không tính dòng NGHỈ/HỌC) trong ngày ds không?
function rsAssignedOn(code, ds){
  const out = [], d = new Date(ds+'T00:00:00'), ws = rsWeekStart(d), di = (d.getDay()+6)%7;
  Object.keys(RS_KINDS).forEach(kind=>{
    const wk = rsRec(kind, ws); if(!wk) return;
    rsRows(kind).forEach(row=>{
      if(/^(PHÉP|HỌC)/i.test(row.label) || rsNorm(row.sec)==='nghi') return;
      if((wk.cells?.[row.rid+'|'+di]||[]).includes(code)) out.push(row.label);
    });
  });
  return out;
}
function rsTemplate(kind){
  downloadCSV([['Nhóm','Vị trí',...RS_DOW],...rsRows(kind).map(r=>[r.sec,r.label,'','','','','','',''])],`mau_${RS_KINDS[kind].key}.csv`);
}
function rsParseText(text){
  const t = String(text||'').replace(/^﻿/,'');
  if(!t.trim()) return [];
  const first = t.split(/\r?\n/)[0];
  if(first.includes('\t')&&!first.includes(',')) return t.split(/\r?\n/).filter(l=>l.trim()!=='').map(l=>l.split('\t').map(x=>x.trim()));
  return parseCSVText(t).map(r=>r.map(x=>String(x).trim().replace(/^'(?=[=+\-@])/,'')));
}
function rsStaffIndex(){
  const exact = new Map(), last = new Map();
  (DB.data.staff||[]).filter(s=>!s._deleted).forEach(s=>{
    [s.empCode,s.short,s.fullName].forEach(v=>{const k = rsNorm(v); if(!k) return;
      if(!exact.has(k)) exact.set(k,s.empCode); else if(exact.get(k)!==s.empCode) exact.set(k,'__AMBIG__');});
    const parts = String(s.fullName||'').trim().split(/\s+/), lk = rsNorm(parts[parts.length-1]);
    if(lk){ if(!last.has(lk)) last.set(lk,[]); last.get(lk).push(s.empCode); }
  });
  return {exact,last};
}
function rsResolve(text,idx){
  return String(text).split(/[\/,;\n]+/).map(s=>s.trim()).filter(s=>s&&!/^[.\-…]+$/.test(s)).map(s=>{
    const t = s.replace(/^(BSPK|BS|KTV|ĐD|NV)\.?\s*/i,'').trim(); if(!t) return null;
    const k = rsNorm(t), ex = idx.exact.get(k);
    if(ex&&ex!=='__AMBIG__') return {kind:'ok',code:ex,text:t};
    const fz = idx.last.get(k);
    if(fz&&fz.length===1) return {kind:'fuzzy',code:fz[0],text:t};
    return {kind:'miss',text:t.slice(0,60)};
  }).filter(Boolean);
}
function rsBuildPlan(kind,body){
  const idx = rsStaffIndex(), out = []; let cur = '';
  body.forEach(row=>{
    if(row[0]) cur = row[0].trim();
    const label = (row[1]||'').trim();
    if(!label||/^(vị trí|vi tri|nhóm)$/i.test(label)) return;
    const found = rsFindRow(label,kind), days = [];
    for(let d=0;d<7;d++) days.push(rsResolve(row[2+d]||'',idx));
    const secExists = !!rsLayout(kind).find(s=>rsNorm(s.label)===rsNorm(cur));
    out.push({rid:found?found.row.id:null,label:found?found.row.label:label.slice(0,60),secName:found?null:(cur||'NHÓM KHÁC').slice(0,40),
      status:found?'Có sẵn':(secExists?'Vị trí mới':'Vị trí + nhóm mới'),days});
  });
  return out;
}

  const f = e.target.files[0]; if(!f) return;

function rsAnalyze(){
  const rows = rsParseText($('#ri-text').value);

function rsApply(){
  if(!RS_IMP) return;

    if(it.rid) return;

    let sec = L.find(s=>rsNorm(s.label)===rsNorm(it.secName));
    if(!sec){ sec = {id:uid(),label:it.secName,color:'gray',rows:[]}; L.push(sec); }
    const row = {id:uid(),label:it.label}; sec.rows.push(row); it.rid = row.id; layoutChanged = true;
  });
  if(layoutChanged) cfgSet('rs_layout_'+kind, L);
  const r = rsEnsure(kind,RS_IMP.week);
  RS_IMP.plan.forEach(it=>{ if(!it.rid) return; it.days.forEach((list,day)=>{
    const key = it.rid+'|'+day, entries = list.map(x=>x.kind==='miss'?'~'+x.text:x.code);
    const value = RS_IMP.mode==='merge'?[...new Set([...(r.cells[key]||[]),...entries])]:entries;
    if(value.length) r.cells[key] = value; else delete r.cells[key];
  });});
  r.updatedAt = Date.now(); saveDB(); audit('import',RS_KINDS[kind].key,r.id,`${RS_IMP.week}: ${RS_IMP.plan.length} dòng`);
  RS_WEEK[kind] = RS_IMP.week; RS_IMP = null;

function rsLMoveRow(si,ri,d){ const a = RS_LEDIT[si].rows, j = ri+d; if(j<0||j>=a.length) return; [a[ri],a[j]] = [a[j],a[ri]]; rsLayoutPaint(); }

function rsLDelRow(si,ri){

/* ---------- 13. MEETINGS / CALENDAR ---------- */
const MT_TYPES = {'Giao ban':'#2563eb','Hội chẩn':'#d97706','Hội nghị/Chuyên đề':'#7c3aed','Đào tạo':'#16a34a','Họp khoa':'#0891b2','Khác':'#64748b'};
const MT_FORMATS = ['Trực tiếp','Trực tuyến','Hỗn hợp'];
const MT_REPEAT = ['Không lặp','Hàng tuần','Hàng tháng'];
let MT = {view:'week', date:localDate()};

function mtMigrate(){
  if(!DB.meta) DB.meta = {};
  if(DB.meta.mtMigrated55) return;
  if(!DB.data.meetings) DB.data.meetings = [];
  const T = {Truc:'Khác',HoiChan:'Hội chẩn',DaoTao:'Đào tạo',Khac:'Khác'};
  (DB.data.events||[]).filter(e=>!e._deleted&&e.date).forEach(e=>{
    const st = e.time||'08:00', [h,mi] = st.split(':').map(Number);
    const en = String((h+1)%24).padStart(2,'0')+':'+String(mi||0).padStart(2,'0');
    DB.data.meetings.push({id:uid(),title:e.title||'(không tiêu đề)',date:e.date,start:st,end:en,
      type:T[e.type]||'Khác',format:'Trực tiếp',location:'',link:'',organizer:'',
      attendees:e.empCode?[e.empCode]:[],agenda:e.note||'',repeat:'Không lặp',repeatUntil:'',
      createdBy:'',createdAt:Date.now(),updatedAt:Date.now()});
  });
  DB.meta.mtMigrated55 = true; saveDB();
}
// Chỉ nhận cuộc họp có mã và ngày/giờ đúng định dạng (các giá trị này được chèn vào thuộc tính HTML/onclick)
const MT_DATE_RE = /^\d{4}-\d{2}-\d{2}$/, MT_TIME_RE = /^\d{2}:\d{2}$/;
function mtAll(){
  if(!DB.data.meetings) DB.data.meetings = [];
  return DB.data.meetings.filter(m=>m && !m._deleted && validId(m.id) && MT_DATE_RE.test(m.date||'') && MT_TIME_RE.test(m.start||'') && MT_TIME_RE.test(m.end||''));
}
function mtDateAdd(s,n){const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return localDate(d);}
function mtOccs(from,to){
  const out = [];
  mtAll().forEach(m=>{
    const until = m.repeatUntil||'9999-12-31';
    if(m.repeat==='Hàng tuần'){
      let n = 0;
      for(let s = m.date; s<=to && s<=until && n<400; s = mtDateAdd(s,7), n++) if(s>=from) out.push({m,date:s});
    } else if(m.repeat==='Hàng tháng'){
      const base = new Date(m.date+'T00:00:00'), bd = base.getDate();
      for(let k=0;k<400;k++){
        const d = new Date(base.getFullYear(),base.getMonth()+k,bd), s = localDate(d);
        if(s>to||s>until) break;
        if(d.getDate()===bd && s>=from) out.push({m,date:s});
      }
    } else if(m.date>=from && m.date<=to) out.push({m,date:m.date});
  });
  return out.sort((a,b)=>(a.date+a.m.start).localeCompare(b.date+b.m.start));
}
function mtClash(occs){
  const bad = new Set();
  for(let i=0;i<occs.length;i++) for(let j=i+1;j<occs.length;j++){
    const a = occs[i], b = occs[j];
    if(a.date!==b.date) continue;
    if(!(a.m.start<b.m.end && b.m.start<a.m.end)) continue;
    const shared = (a.m.attendees||[]).some(x=>!String(x).startsWith('~')&&(b.m.attendees||[]).includes(x));
    const room = a.m.location && a.m.location===b.m.location;
    if(shared||room){ bad.add(a.m.id+'|'+a.date); bad.add(b.m.id+'|'+b.date); }
  }
  return bad;
}
function mtRange(){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return [MT.date,MT.date];
  if(MT.view==='week'){const s = rsWeekStart(d); return [s, mtDateAdd(s,6)];}
  if(MT.view==='month'){
    const f = new Date(d.getFullYear(),d.getMonth(),1), l = new Date(d.getFullYear(),d.getMonth()+1,0);
    return [rsWeekStart(f), mtDateAdd(rsWeekStart(l),6)];
  }
  return [MT.date, mtDateAdd(MT.date,30)];
}
function mtTitle(){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='day') return `${RS_DOW[(d.getDay()+6)%7]}, ${rsFmt(d)}/${d.getFullYear()}`;
  if(MT.view==='month') return `Tháng ${d.getMonth()+1} / ${d.getFullYear()}`;
  const [f,t] = mtRange();
  if(MT.view==='week') return `${rsFmt(new Date(f+'T00:00:00'))} – ${rsFmt(new Date(t+'T00:00:00'))} / ${d.getFullYear()}`;
  return `31 ngày từ ${rsFmt(d)}`;
}
function mtShift(n){
  const d = new Date(MT.date+'T00:00:00');
  if(MT.view==='month') d.setMonth(d.getMonth()+n);
  else if(MT.view==='day') d.setDate(d.getDate()+n);
  else if(MT.view==='week') d.setDate(d.getDate()+7*n);
  else d.setDate(d.getDate()+31*n);
  MT.date = localDate(d); renderCalendar();
}
function mtNames(m){return (m.attendees||[]).map(e=>e.startsWith('~')?e.slice(1):rsShort(e)).join(', ');}
function mtChip(o,clash){
  const m = o.m, c = MT_TYPES[m.type]||'#64748b';
  return `<div title="${esc(m.title)}" onclick="event.stopPropagation();mtEdit('${m.id}','${o.date}')"
    style="border-left:3px solid ${c};background:${c}22;padding:3px 6px;border-radius:5px;margin-bottom:3px;font-size:11px;cursor:pointer;${clash?'box-shadow:inset 0 0 0 1px var(--bad);':''}">
    <b>${esc(m.start)}</b> ${clash?'⚠ ':''}${esc(m.title)}</div>`;
}
function mtRow(o,clash){
  const m = o.m, c = MT_TYPES[m.type]||'#64748b';
  return `<div onclick="mtEdit('${m.id}','${o.date}')" style="display:flex;gap:12px;padding:10px;border-bottom:1px solid var(--ln);cursor:pointer;border-left:4px solid ${c}">
    <div style="min-width:110px;font-weight:700;color:${c}">${esc(m.start)} – ${esc(m.end)}</div>
    <div style="flex:1"><b>${clash?'⚠ ':''}${esc(m.title)}</b>
      <div style="font-size:12px;color:var(--mut)">${esc(m.type)} · ${esc(m.format)}${m.location?' · 📍 '+esc(m.location):''}${mtNames(m)?' · 👥 '+esc(mtNames(m)):''}</div>
      ${safeUrl(m.link)?`<a href="${esc(safeUrl(m.link))}" target="_blank" rel="noopener noreferrer" style="font-size:12px" onclick="event.stopPropagation()">🔗 Tham gia</a>`:''}</div>
    ${m.repeat!=='Không lặp'?'<span class="badge info">↻ '+esc(m.repeat)+'</span>':''}
  </div>`;
}
function renderCalendar(){
  mtMigrate();
  const [from,to] = mtRange(), occs = mtOccs(from,to), clash = mtClash(occs), canC = can('calendar','c');
  const byDay = {}; occs.forEach(o=>{(byDay[o.date] = byDay[o.date]||[]).push(o);});
  const days = []; for(let s = from; s<=to; s = mtDateAdd(s,1)) days.push(s);
  let body = '';
  if(MT.view==='agenda'){
    body = days.filter(s=>byDay[s]).map(s=>`<div class="card"><h3>${RS_DOW[(new Date(s+'T00:00:00').getDay()+6)%7]} ${rsFmt(new Date(s+'T00:00:00'))}</h3>${byDay[s].map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')}</div>`).join('')
      || '<div class="card"><div class="empty">Không có cuộc họp trong 31 ngày tới</div></div>';
  } else if(MT.view==='day'){
    body = `<div class="card">${(byDay[from]||[]).map(o=>mtRow(o,clash.has(o.m.id+'|'+o.date))).join('')||'<div class="empty">Không có cuộc họp</div>'}</div>`;
  } else if(MT.view==='week'){
    body = `<div class="table-wrap"><table style="min-width:900px;table-layout:fixed"><thead><tr>${days.map((s,i)=>`<th style="text-align:center;${i>=5?'background:#fff7ed;':''}">${RS_DOW[i]}<br><small>${rsFmt(new Date(s+'T00:00:00'))}</small></th>`).join('')}</tr></thead>
      <tbody><tr>${days.map(s=>`<td style="vertical-align:top;height:280px;padding:4px;${canC?'cursor:pointer;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>${(byDay[s]||[]).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}</td>`).join('')}</tr></tbody></table></div>`;
  } else {
    const dow = ['T2','T3','T4','T5','T6','T7','CN'];
    body = `<div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${days.map(s=>{
      const list = byDay[s]||[], other = s.slice(0,7)!==MT.date.slice(0,7);
      return `<div class="cal-cell ${s===localDate()?'today':''}" style="min-height:110px;${other?'opacity:.45;':''}" ${canC?`onclick="mtNew('${s}')"`:''}>
        <div class="cal-day">${Number(s.slice(8))}</div>
        ${list.slice(0,3).map(o=>mtChip(o,clash.has(o.m.id+'|'+o.date))).join('')}
        ${list.length>3?`<div style="font-size:10px;color:var(--mut)">+${list.length-3} lượt</div>`:''}
      </div>`;}).join('')}</div>`;
  }
  $('#view').innerHTML = `<div class="page-head">
    <div><h1>🤝 Lịch họp &amp; hội chẩn</h1><div class="subtitle">${esc(mtTitle())} · ${occs.length} lượt ${scopeTag('meetings')}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn-soft btn-sm" onclick="mtShift(-1)">◀</button>
      <button class="btn-soft btn-sm" onclick="MT.date=localDate();renderCalendar()">Hôm nay</button>
      <button class="btn-soft btn-sm" onclick="mtShift(1)">▶</button>
      <div class="cal-modes">${[['day','Ngày'],['week','Tuần'],['month','Tháng'],['agenda','Lịch biểu']].map(([k,l])=>`<button class="${MT.view===k?'on':''}" onclick="MT.view='${k}';renderCalendar()">${l}</button>`).join('')}</div>
      ${canC?'<button class="btn btn-sm" onclick="mtNew(null)">+ Tạo cuộc họp</button>':''}
      <button class="btn-soft btn-sm" onclick="mtICS()">📅 .ics</button>
      <button class="btn-soft btn-sm" onclick="mtCSV()">📤 CSV</button>
    </div></div>${body}`;
}
function mtNew(date){mtForm(null, date||MT.date);}
function mtEdit(id,occDate){const m = mtAll().find(x=>x.id===id); if(m) mtForm(m, occDate||m.date);}
function mtForm(m,date){
  const v = m||{title:'',type:'Giao ban',format:'Trực tiếp',start:'07:30',end:'08:30',location:'',link:'',organizer:CURRENT.name,attendees:[],agenda:'',repeat:'Không lặp',repeatUntil:''};
  const picked = (v.attendees||[]).filter(e=>!e.startsWith('~')), free = (v.attendees||[]).filter(e=>e.startsWith('~')).map(e=>e.slice(1)).join(', ');

  <div class="form-group"><label>Lặp lại</label><select id="mt-repeat">${MT_REPEAT.map(t=>`<option ${v.repeat===t?'selected':''}>${t}</option>`).join('')}</select></div>
  <div class="form-group"><label>Bắt đầu</label><input type="time" id="mt-start" value="${esc(v.start)}"></div>
  <div class="form-group"><label>Kết thúc</label><input type="time" id="mt-end" value="${esc(v.end)}"></div>

  <div class="form-group"><label>Phòng / địa điểm</label><input id="mt-loc" value="${esc(v.location)}" placeholder="Phòng họp 2F"></div>

  <div class="form-group full"><label>Thành phần</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:7px;padding:8px">${
      staff.map(s=>`<label style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:12px;letter-spacing:0"><input type="checkbox" data-mt-emp="${esc(s.empCode)}" ${picked.includes(s.empCode)?'checked':''} style="width:auto">${esc(rsShort(s.empCode))}</label>`).join('')
      || '<div class="empty">Chưa có nhân sự</div>'}</div></div>
  <div class="form-group full"><label>Người ngoài (cách nhau bằng dấu phẩy)</label><input id="mt-free" value="${esc(free)}"></div>
  <div class="form-group full"><label>Nội dung (không ghi thông tin định danh bệnh nhân)</label><textarea id="mt-agenda" rows="3" maxlength="2000">${esc(v.agenda)}</textarea></div>`;
  let foot = `<button type="button" class="btn-soft" onclick="closeDlg()">Đóng</button>`;
  if(ro) foot = `<span class="hint" style="margin:0 auto 0 0">Chỉ người tạo hoặc Quản trị được sửa cuộc họp này</span>` + foot;
  else if(m) foot = (isAdmin()||can('calendar','d')?`<button type="button" class="btn-danger" onclick="mtDel('${m.id}')">Xóa</button>`:'')+foot+`<button type="button" class="btn" onclick="mtSave('${m.id}')">💾 Lưu</button>`;
  else foot += `<button type="button" class="btn" onclick="mtSave('')">💾 Lưu</button>`;
  $('#dlg-foot').innerHTML = foot;
  if(ro) $$('input,select,textarea',$('#dlg-body')).forEach(el=>{ el.disabled = true; });
  $('#dlg').showModal();
}
function mtSave(id){
  const cur = id ? DB.data.meetings.find(x=>x.id===id) : null;
  if(id ? !(cur && (isAdmin() || (can('calendar','u') && isOwner(cur)))) : !can('calendar','c')){ toast('Không có quyền lưu cuộc họp này'); return; }
  const title = $('#mt-title').value.trim(), date = $('#mt-date').value, start = $('#mt-start').value, end = $('#mt-end').value;
  if(!title||!date){ toast('Nhập tiêu đề và ngày'); return; }
  if(!start||!end||start>=end){ toast('Giờ kết thúc phải sau giờ bắt đầu'); return; }
  const linkRaw = $('#mt-link').value.trim();
  if(linkRaw && !safeUrl(linkRaw)){ toast('Link trực tuyến phải bắt đầu bằng http:// hoặc https://'); return; }
  const until = $('#mt-until').value;
  if(until && until < date){ toast('"Lặp đến" phải từ ngày họp trở đi'); return; }
  const picked = $$('[data-mt-emp]:checked',$('#dlg-body')).map(x=>x.dataset.mtEmp);
  const free = ($('#mt-free').value||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean).map(s=>'~'+s);
  const data = {title,type:$('#mt-type').value,format:$('#mt-format').value,date,start,end,
    repeat:$('#mt-repeat').value,repeatUntil:$('#mt-until').value||'',location:$('#mt-loc').value.trim(),
    link:$('#mt-link').value.trim(),organizer:$('#mt-org').value.trim(),attendees:[...picked,...free],
    agenda:$('#mt-agenda').value.trim(),updatedAt:Date.now()};
  const clash = mtOccs(date,date).some(o=>o.m.id!==id && start<o.m.end && o.m.start<end &&
    (o.m.attendees.some(x=>!x.startsWith('~')&&data.attendees.includes(x)) || (data.location && o.m.location===data.location)));
  if(clash && !confirm('Trùng giờ với cuộc họp khác. Vẫn lưu?')) return;
  if(id){ const m = DB.data.meetings.find(x=>x.id===id); Object.assign(m, data); audit('update','calendar',id,title); }
  else { const nid = uid(); DB.data.meetings.push({id:nid, ...data, createdBy:CURRENT.username, createdAt:Date.now()}); audit('create','calendar',nid,title); }
  saveDB(); closeDlg(); MT.date = date; renderCalendar(); toast('Đã lưu');
}
function mtDel(id){
  const m = DB.data.meetings.find(x=>x.id===id);
  if(!m || !(isAdmin() || (can('calendar','d') && isOwner(m)))){ toast('Không có quyền xóa cuộc họp này'); return; }
  if(!confirm(m.repeat&&m.repeat!=='Không lặp'?'Xóa cuộc họp này và TẤT CẢ các lần lặp của nó?':'Xóa cuộc họp này?')) return;
  if(m){ m._deleted = true; m._deletedAt = Date.now(); m.updatedAt = Date.now(); }
  audit('delete','calendar',id,''); saveDB(); closeDlg(); renderCalendar(); toast('Đã xóa');
}
function mtICS(){
  const e2 = s=>String(s??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,x=>'\\'+x);
  const dt = (d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ND2 V5.5//VN','CALSCALE:GREGORIAN'];
  mtAll().forEach(m=>{
    L.push('BEGIN:VEVENT','UID:'+m.id+'@nd2','DTSTAMP:'+dt(localDate(),'00:00'),
      'DTSTART:'+dt(m.date,m.start),'DTEND:'+dt(m.date,m.end),'SUMMARY:'+e2(m.title),'LOCATION:'+e2(m.location||''));
    const desc = [m.type,m.format,m.link,m.agenda,'Thành phần: '+mtNames(m)].filter(Boolean).join('\n');
    L.push('DESCRIPTION:'+e2(desc));
    if(m.repeat==='Hàng tuần'||m.repeat==='Hàng tháng')
      L.push('RRULE:FREQ='+(m.repeat==='Hàng tuần'?'WEEKLY':'MONTHLY')+(m.repeatUntil?';UNTIL='+m.repeatUntil.replace(/-/g,'')+'T235959':''));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download = 'lich_hop_'+localDate()+'.ics'; a.click();
}
function mtCSV(){
  const [from,to] = mtRange(), occs = mtOccs(from,to);
  rsCSV([['Ngày','Bắt đầu','Kết thúc','Tiêu đề','Loại','Hình thức','Địa điểm','Link','Thành phần','Chủ trì'],
    ...occs.map(o=>[o.date,o.m.start,o.m.end,o.m.title,o.m.type,o.m.format,o.m.location,o.m.link,mtNames(o.m),o.m.organizer])],
    `lich_hop_${from}_${to}.csv`);
}
